# Publish gpuwm to PyPI via Trusted Publishing (OIDC; no API token).
#
# Registered publisher (cross-check on PyPI): project `gpuwm`,
# owner `FahrenheitResearch`, repository `arwen`,
# workflow `publish.yml`, environment `pypi`.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      # The externalized Thompson table (freezeH2O.dat, 243 MiB) is
      # deliberately absent from both the repository and the wheel: it is
      # a release asset staged by `gpuwm fetch-tables`, so the build here
      # needs nothing beyond the plain checkout.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
