# Publish gpuwm to PyPI via Trusted Publishing (OIDC; no API token), and
# publish the prebuilt Rust bundles the wheel's pins point at.
#
# Registered publisher (cross-check on PyPI): project `gpuwm`,
# owner `FahrenheitResearch`, repository `arwen`, workflow `publish.yml`,
# environment `pypi`.
#
# Two ingresses, one set of proofs.  Publishing a GitHub release is a cut
# motion -- it is how every release through v1.4.0 shipped -- and a manual
# dispatch on the exact tag is the other.  The tag comes from the release
# payload on the release event and from the required input on a dispatch;
# every job then compares it against the selected ref either way.  Which
# ingress ran changes exactly one thing: the release state each job expects
# to see (a draft the final job promotes, or a release already public).
# Every byte proof below is identical on both paths.
#
# Order and privilege separation are part of the release contract:
#
#   test -> release_authority (also captures assets a previous run
#           already uploaded to the draft: Rust builds are not
#           byte-reproducible, so a re-run must adopt those exact bytes)
#          -> cut
#          -> bridges (one target-native build/probe per platform)
#          -> prepare (adopt captured assets by content contract;
#             generate pins; build and prove exact dists)
#          -> assets (reconcile the proven bridge payload on the draft)
#          -> authorize_pypi (re-prove draft, assets, and tag commit)
#          -> publish (push the already-proven dists to PyPI)
#          -> release (re-prove everything and promote the draft)
#
# `prepare` cannot mutate either public destination.  The GitHub authority
# cells have contents:write but no checkout and no PyPI identity.  `publish`
# has only the PyPI OIDC identity and cannot read or mutate GitHub contents.
# No public asset is written until every wheel, sdist, pin, bundle member,
# executable, and host library has passed.
name: publish

on:
  # Publishing a GitHub release cuts a release.  Restored by owner ruling
  # 2026-08-03: it was the motion for every release through v1.4.0, it was
  # removed on 2026-08-01 without one, and the tag it carries is exactly the
  # tag a dispatch has to be told.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact vX.Y.Z tag selected as this workflow's ref
        required: true
        type: string
      stable_release_expected:
        description: >-
          Optional. Tick to require a stable X.Y.Z version; the cut then
          refuses any other pyproject version. Left unticked -- the default --
          a non-stable version publishes and the cut prints a workflow warning
          naming what it is.
        required: false
        default: false
        type: boolean
      immutable_releases_enabled:
        description: >-
          Optional. Tick only if GitHub release immutability was enabled BEFORE
          this draft was created; the cut then asserts the published release is
          immutable and fails if it is not. Left unticked the cut proceeds and
          only warns, which is how every release through v1.4.0 shipped.
        required: false
        default: false
        type: boolean
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # This is the package/contract surface that a public cut can break on a
  # GPU-less runner.  Model tests requiring CUDA and staged case data remain
  # in their GPU gates; these tests deliberately avoid importing CuPy.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: packaging and contract tests
        run: |
          python -m pytest -q -m "not gpu and not slow and not network" \
            tests/test_bridge_fetch.py \
            tests/test_table_fetch.py \
            tests/test_package_data_coverage.py \
            tests/test_doctor.py \
            tests/test_doctor_nexrad.py \
            tests/test_cli.py \
            tests/test_source_adapters.py \
            tests/test_namelist_compat.py \
            tests/test_native_wrf_distribution.py \
            tests/test_publish_workflow_state_machine.py \
            tests/test_bridge_bundle_adopt.py \
            tests/test_verify_source_bridge_pins.py \
            tests/test_verify_release_artifacts.py

  # Draft visibility requires push authority. Isolate that authority in a
  # no-checkout, no-OIDC cell and pass only the captured ID/tag/commit on.
  release_authority:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.capture.outputs.tag }}
      release_id: ${{ steps.capture.outputs.release_id }}
      commit: ${{ steps.capture.outputs.commit }}
      prerelease: ${{ steps.capture.outputs.prerelease }}
    steps:
      - id: capture
        env:
          # The release event carries its own tag; a dispatch is told one.
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          # Which release state this ingress implies.  A dispatch expects a
          # draft it will promote in the final job; the release event fires
          # on an already-public release, so there is nothing left to promote
          # and the final job's already-public path is the whole of it.
          EXPECTED_DRAFT: ${{ github.event_name == 'release' && 'false' || 'true' }}
          IMMUTABLE_RELEASES_CONFIRMED: ${{ inputs.immutable_releases_enabled }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Advisory, not a gate.  Immutability is a genuine improvement -- it
          # locks a published release's tag and assets so binaries cannot be
          # swapped afterwards -- but it is a repo setting the owner may not
          # have enabled, it cannot be set through the API, and every release
          # through v1.4.0 shipped without it.  Refusing the cut over it blocks
          # something that demonstrably works.  Tick the input to opt into
          # enforcement; leave it unticked and the cut says so and continues.
          if [ "$IMMUTABLE_RELEASES_CONFIRMED" != "true" ]; then
            echo "::warning::release immutability not confirmed; publishing without it (Settings -> General -> Releases enables it for FUTURE releases)"
          fi
          tag="$DISPATCH_RELEASE_TAG"
          if [ -z "$tag" ] || [ "$tag" != "$GITHUB_REF_NAME" ] \
             || [ "$GITHUB_REF_TYPE" != "tag" ] \
             || [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "draft authority requires the exact selected tag ref" >&2
            exit 1
          fi
          matches=$(gh api --paginate --slurp -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]')
          # Integrity, and it stays a refusal: two releases on one tag means
          # the cut cannot know which one it is publishing, and one release
          # in the wrong state for this ingress means the motion is not the
          # one the trigger claimed.
          if [ "$(jq 'length' <<<"$matches")" -ne 1 ]; then
            echo "exactly one authenticated release must carry tag $tag" >&2
            exit 1
          fi
          if [ "$(jq -r '.[0].draft' <<<"$matches")" != "$EXPECTED_DRAFT" ]; then
            echo "release $tag must have draft=$EXPECTED_DRAFT for a ${GITHUB_EVENT_NAME:-workflow_dispatch} cut" >&2
            exit 1
          fi
          # Procedure, not integrity, and demoted to a warning by owner ruling
          # 2026-08-03.  "Stable versions are never GitHub prereleases" is a
          # convention the operator owns, not a property of these bytes.  The
          # captured value is carried to every later job, which re-proves the
          # state is still the one captured here -- so a prerelease publishes
          # as a prerelease rather than being silently cleared.
          prerelease=$(jq -r '.[0].prerelease' <<<"$matches")
          if [[ ! "$prerelease" =~ ^(true|false)$ ]]; then
            echo "release $tag has a non-boolean prerelease state" >&2
            exit 1
          fi
          if [ "$prerelease" != "false" ]; then
            echo "::warning::release $tag is marked prerelease; it is published as one and its prerelease state is carried through the cut unchanged"
          fi
          release_id=$(jq -r '.[0].id' <<<"$matches")
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "draft release id is not numeric" >&2
            exit 1
          fi
          ref_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag")
          object_type=$(jq -r '.object.type' <<<"$ref_json")
          object_sha=$(jq -r '.object.sha' <<<"$ref_json")
          hops=0
          while [ "$object_type" = "tag" ]; do
            if [ "$hops" -ge 16 ]; then
              echo "annotated tag chain is unexpectedly deep" >&2
              exit 1
            fi
            tag_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/tags/$object_sha")
            object_type=$(jq -r '.object.type' <<<"$tag_json")
            object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            hops=$((hops + 1))
          done
          if [ "$object_type" != "commit" ] \
             || [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release tag does not peel to one commit" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "commit=$object_sha" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
      # A re-run's recovery path starts here.  Rust bridge builds are not
      # byte-reproducible, so a re-dispatched run rebuilds different zips
      # than the ones a previous run already uploaded -- and the assets
      # job's byte-identity reconcile would strand the release on that
      # difference.  This cell is the only one that can see the draft's
      # assets, so it captures them (with the sizes and digests GitHub
      # recorded at upload) for `prepare` to adopt by content contract.
      # A first run captures an empty inventory and changes nothing.
      - name: capture the assets the draft already carries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.capture.outputs.release_id }}
          RELEASE_TAG: ${{ steps.capture.outputs.tag }}
          EXPECTED_DRAFT: ${{ github.event_name == 'release' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          mkdir -p draft-held/assets
          # Resolve through the full paginated list, never a GET by id:
          # authority here means the captured id still names exactly one
          # draft carrying exactly the selected tag.
          matches=$(gh api --paginate --slurp -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -c --argjson id "$RELEASE_ID" '[.[][] | select(.id == $id)]')
          if [ "$(jq 'length' <<<"$matches")" -ne 1 ]; then
            echo "captured release id no longer resolves exactly once" >&2
            exit 1
          fi
          release_json=$(jq -c '.[0]' <<<"$matches")
          if [ "$(jq -r '.tag_name' <<<"$release_json")" != "$RELEASE_TAG" ] \
             || [ "$(jq -r '.draft' <<<"$release_json")" != "$EXPECTED_DRAFT" ]; then
            echo "captured release changed while capturing its assets" >&2
            exit 1
          fi
          jq '[.assets[] | {name, state, size, digest: (.digest // null)}]' <<<"$release_json" >draft-held/inventory.json
          count=0
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            state=$(jq -r '.state' <<<"$asset")
            if [ "$state" != "uploaded" ]; then
              continue
            fi
            name=$(jq -r '.name' <<<"$asset")
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "uploaded draft asset name is not URL-safe: $name" >&2
              exit 1
            fi
            asset_id=$(jq -r '.id' <<<"$asset")
            if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "uploaded draft asset $name has a non-numeric id" >&2
              exit 1
            fi
            size=$(jq -r '.size' <<<"$asset")
            digest=$(jq -r '.digest // ""' <<<"$asset")
            curl --fail-with-body --silent --show-error --location -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" --output "draft-held/assets/$name" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            actual_size=$(stat -c '%s' -- "draft-held/assets/$name")
            actual_sha=$(sha256sum -- "draft-held/assets/$name" | awk '{print $1}')
            if [ "$actual_size" != "$size" ] \
               || { [ -n "$digest" ] && [ "$digest" != "sha256:$actual_sha" ]; }; then
              echo "downloaded draft asset $name does not match its recorded size and digest" >&2
              exit 1
            fi
            count=$((count + 1))
          done < <(jq -c '.assets[]' <<<"$release_json")
          echo "captured $count uploaded asset(s) the draft already carries"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: draft-held-assets
          path: draft-held
          if-no-files-found: error

  # Resolve one name once, and prove that the event, Git ref, checkout, tag,
  # pyproject, and intentionally-unpinned source archive all describe the same
  # immutable commit and the release release_authority captured. Either
  # ingress lands here identically; on the dispatch ingress the last job makes
  # the captured draft public only after its assets and PyPI distributions
  # have passed.
  cut:
    if: github.event_name != 'pull_request'
    needs: [test, release_authority]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      # Forwarded, not re-read: every later job re-proves the release still
      # carries the prerelease state release_authority captured.
      prerelease: ${{ needs.release_authority.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: prove the tagged source archive is honestly unpinned
        run: python tools/verify_source_bridge_pins.py
      - id: resolve
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          # Empty on any trigger that is not workflow_dispatch, which the
          # comparison below treats as "not opted in".
          STABLE_RELEASE_EXPECTED: ${{ inputs.stable_release_expected }}
          CAPTURED_RELEASE_ID: ${{ needs.release_authority.outputs.release_id }}
          CAPTURED_REMOTE_COMMIT: ${{ needs.release_authority.outputs.commit }}
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          # Opt-in, following the immutability idiom.  Whether a public cut
          # must carry a stable X.Y.Z is the operator's call, not this file's:
          # tick the input and a non-stable version is refused exactly as
          # before; leave it unticked -- the default -- and the cut names what
          # it is publishing and proceeds.  Demoted by owner ruling
          # 2026-08-03; the refusal was added on 2026-08-01 without one.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "$STABLE_RELEASE_EXPECTED" = "true" ]; then
              echo "stable_release_expected was ticked, but $version is not a stable X.Y.Z" >&2
              exit 1
            fi
            echo "::warning::publishing non-stable version $version; tick stable_release_expected to refuse anything but X.Y.Z"
          fi
          tag="$DISPATCH_RELEASE_TAG"
          if [ -z "$tag" ] || [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "release_tag input $tag must equal selected workflow ref $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "release cut must run from a tag ref, not $GITHUB_REF" >&2
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "release tag $tag does not match pyproject version $version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "event ref $GITHUB_REF does not match refs/tags/$tag" >&2
            exit 1
          fi
          tag_commit=$(git rev-parse "${tag}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$tag_commit" ] \
             || [ "$head_commit" != "$GITHUB_SHA" ] \
             || [ "$head_commit" != "$CAPTURED_REMOTE_COMMIT" ]; then
            echo "checkout=$head_commit tag=$tag_commit event=$GITHUB_SHA remote=$CAPTURED_REMOTE_COMMIT" >&2
            exit 1
          fi
          if [[ ! "$CAPTURED_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "captured draft release id is not numeric" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$CAPTURED_RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  # One bundle per target platform.  Each target runner executes all seven
  # executables and loads the CPU preprocessing library before packing bytes.
  bridges:
    if: github.event_name != 'pull_request'
    needs: cut
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2025
            platform: win-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: pin the toolchain
        shell: bash
        env:
          RUST_TOOLCHAIN: "1.94.0"
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: build the GRIB decoders and the CPU preprocessing library
        working-directory: tools/grib1_bridge
        run: cargo build --release --locked
      - name: build the fetch backbone and the batch renderer
        working-directory: tools/rustwx
        run: cargo build --release --locked
      # The vendored dealiasing crate is its own tree, not a member of
      # either workspace, so it is built on its own line.  It ships
      # because --dealias runs it by default.
      - name: build the region-global dealiasing library
        working-directory: tools/region_global_dealias
        run: cargo build --release --locked
      - name: probe every native artifact on its target runner
        shell: bash
        env:
          BUNDLE_PLATFORM: ${{ matrix.platform }}
          BUNDLE_SOURCE_REV: ${{ needs.cut.outputs.commit }}
        run: |
          python - <<'PY'
          import ctypes
          import os
          from pathlib import Path

          from gpuwm import bridge_assets, bridges, doctor

          platform = os.environ["BUNDLE_PLATFORM"]
          source_rev = os.environ["BUNDLE_SOURCE_REV"]
          search = (
              Path("tools/grib1_bridge/target/release"),
              Path("tools/rustwx/target/release"),
              Path("tools/region_global_dealias/target/release"),
          )
          # Each library's ABI entry point comes from the one table that
          # declares it, gpuwm.bridge_assets.LIBRARY_ABI, so this probe
          # and tools/verify_release_artifacts.py cannot disagree about
          # which symbol proves which artifact.  This block used to
          # declare its own copy; the verifier kept the older blanket
          # rule and refused a correct bundle mid cut.
          for artifact in bridge_assets.BUNDLED_ARTIFACTS:
              filename = bridge_assets.artifact_filename(artifact, platform)
              matches = [directory / filename for directory in search
                         if (directory / filename).is_file()]
              assert len(matches) == 1, (artifact.name, matches)
              path = matches[0]
              payload = path.read_bytes()
              if artifact.vendored:
                  # Upstream's tree, frozen at a recorded commit: it does
                  # not move with this checkout, so what is asked of it is
                  # the contract marker the pin step will ask for too.
                  marker = bridges.BRIDGE_ABI_MARKERS[artifact.name]
                  assert marker in payload, (artifact.name, marker)
              else:
                  # The build just ran from this checkout, so its embedded
                  # source-revision stamp must name the cut commit.
                  # Failing here, on the platform runner, is hours earlier
                  # than the same refusal at the pin step.
                  bridge_assets.verify_source_revision(
                      payload, expected=source_rev, label=str(path))
              if artifact.kind == "executable":
                  ok, evidence = doctor._exec_probe(path)
                  assert ok, (path, evidence)
              else:
                  symbol, expected = bridge_assets.library_abi_for(
                      artifact.name)
                  library = ctypes.CDLL(str(path.resolve()))
                  abi = getattr(library, symbol)
                  abi.argtypes = []
                  abi.restype = ctypes.c_uint32
                  assert int(abi()) == expected, (artifact.name, symbol)
              print(platform, artifact.name, path)
          PY
      - name: pack the bundle
        shell: bash
        run: |
          python tools/build_bridge_bundle.py pack \
            --release '${{ needs.cut.outputs.tag }}' \
            --platform '${{ matrix.platform }}' \
            --search tools/grib1_bridge/target/release \
            --search tools/rustwx/target/release \
            --search tools/region_global_dealias/target/release \
            --out dist-bridges
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridges-${{ matrix.platform }}
          path: dist-bridges/*.zip
          if-no-files-found: error

  # No public-write or OIDC privilege: produce every byte, then prove it from
  # an isolated wheel installation before making it available to later jobs.
  prepare:
    if: github.event_name != 'pull_request'
    needs: [cut, bridges]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bridges-*
          merge-multiple: true
          path: dist-bridges
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: draft-held-assets
          path: draft-held
      # On a re-run the draft may already carry uploaded bundles from a
      # previous run's non-reproducible build.  Adopt them by content
      # contract -- exact member list, map-asset bytes hash-checked
      # against this checkout, the uploaded manifest pinning them member
      # by member -- so the pins, the wheel, and the assets job's
      # byte-identity reconcile all describe the bytes the draft holds.
      # A diverging member is named and the run refuses.  On a first run
      # nothing was uploaded and nothing changes.
      - name: adopt the assets the draft already carries, by content contract
        run: |
          python tools/build_bridge_bundle.py adopt \
            --release '${{ needs.cut.outputs.tag }}' \
            --held draft-held \
            --bundles dist-bridges \
            --source-rev '${{ needs.cut.outputs.commit }}'
      - name: generate pins and manifest from the candidate asset bytes
        run: |
          python tools/build_bridge_bundle.py pin \
            --release '${{ needs.cut.outputs.tag }}' \
            --source-rev '${{ needs.cut.outputs.commit }}' \
            $(for bundle in dist-bridges/*.zip; do printf -- '--bundle %s ' "$bundle"; done) \
            --out gpuwm/data/bridges/bridge-pins.json \
            --manifest dist-bridges/bridge-bundle-manifest.json
      - run: python -m pip install build
      - run: python -m build
      - name: prove distributions, pins, bundles, and Linux artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.cut.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.cut.outputs.commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          bundles=(dist-bridges/*.zip)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "expected exactly one wheel and one sdist" >&2
            exit 1
          fi
          if [ "${#bundles[@]}" -ne 2 ]; then
            echo "expected exactly two platform bundles" >&2
            exit 1
          fi
          wheel=$(realpath "${wheels[0]}")
          sdist=$(realpath "${sdists[0]}")
          smoke="$RUNNER_TEMP/gpuwm-wheel-smoke"
          python -m venv "$smoke/venv"
          "$smoke/venv/bin/python" -m pip install --no-index --no-deps "$wheel"
          mkdir -p "$smoke/outside" "$smoke/staged" "$smoke/home" release-proof
          cd "$smoke/outside"
          env -u PYTHONPATH HOME="$smoke/home" \
            "$smoke/venv/bin/python" -I \
            "$GITHUB_WORKSPACE/tools/verify_release_artifacts.py" \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --pins "$GITHUB_WORKSPACE/gpuwm/data/bridges/bridge-pins.json" \
            --manifest "$GITHUB_WORKSPACE/dist-bridges/bridge-bundle-manifest.json" \
            --bundles "$GITHUB_WORKSPACE/dist-bridges" \
            --release "$RELEASE_TAG" \
            --source-rev "$RELEASE_COMMIT" \
            --repo-root "$GITHUB_WORKSPACE" \
            --stage "$smoke/staged" \
            --receipt "$GITHUB_WORKSPACE/release-proof/release-artifact-proof.json"
          cd "$GITHUB_WORKSPACE"
          cp gpuwm/data/bridges/bridge-pins.json release-proof/bridge-pins.json
          (
            cd dist
            sha256sum -- *.whl *.tar.gz \
              >../release-proof/python-dists-SHA256SUMS
            sha256sum -c ../release-proof/python-dists-SHA256SUMS
          )
          (
            cd dist-bridges
            sha256sum -- *.zip bridge-bundle-manifest.json \
              >../release-proof/release-assets-SHA256SUMS
            sha256sum -c ../release-proof/release-assets-SHA256SUMS
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist-bridges/*.zip
            dist-bridges/bridge-bundle-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-proof
          path: release-proof
          if-no-files-found: error

  # GitHub release assets, and nothing else.  This job executes no repository
  # code and holds no PyPI identity.  Existing asset names are immutable.
  assets:
    if: github.event_name != 'pull_request'
    needs: [cut, prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: release-proof
      - name: reconcile immutable assets by captured release id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.cut.outputs.release_id }}
          RELEASE_TAG: ${{ needs.cut.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.cut.outputs.commit }}
          EXPECTED_DRAFT: ${{ github.event_name == 'release' && 'false' || 'true' }}
          CAPTURED_PRERELEASE: ${{ needs.cut.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-assets/*)
          bundles=(dist-assets/*.zip)
          manifests=(dist-assets/bridge-bundle-manifest.json)
          if [ "${#files[@]}" -ne 3 ] || [ "${#bundles[@]}" -ne 2 ] \
             || [ "${#manifests[@]}" -ne 1 ]; then
            echo "release-assets must contain exactly two bundles and one manifest" >&2
            exit 1
          fi
          (
            cd dist-assets
            sha256sum -c ../release-proof/release-assets-SHA256SUMS
          )

          resolve_remote_tag_commit() {
            local ref_json object_type object_sha tag_json hops
            ref_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG") || return 1
            object_type=$(jq -r '.object.type' <<<"$ref_json")
            object_sha=$(jq -r '.object.sha' <<<"$ref_json")
            hops=0
            while [ "$object_type" = "tag" ]; do
              if [ "$hops" -ge 16 ]; then return 1; fi
              tag_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/tags/$object_sha") || return 1
              object_type=$(jq -r '.object.type' <<<"$tag_json")
              object_sha=$(jq -r '.object.sha' <<<"$tag_json")
              hops=$((hops + 1))
            done
            if [ "$object_type" != "commit" ]; then return 1; fi
            printf '%s' "$object_sha"
          }

          assert_draft_authority() {
            local all_releases id_matches tag_matches by_id by_tag remote_commit
            if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then return 1; fi
            all_releases=$(gh api --paginate --slurp -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/releases?per_page=100") || return 1
            id_matches=$(jq -c --argjson id "$RELEASE_ID" '[.[][] | select(.id == $id)]' <<<"$all_releases")
            tag_matches=$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' <<<"$all_releases")
            if [ "$(jq 'length' <<<"$id_matches")" -ne 1 ] \
               || [ "$(jq 'length' <<<"$tag_matches")" -ne 1 ]; then
              echo "captured release id/tag no longer resolve exactly once" >&2
              return 1
            fi
            by_id=$(jq -c '.[0]' <<<"$id_matches")
            by_tag=$(jq -c '.[0]' <<<"$tag_matches")
            remote_commit=$(resolve_remote_tag_commit) || return 1
            # Compared against what release_authority captured, never against
            # a literal: the property this re-proof owns is "nothing moved
            # since capture", which is integrity.  Whether the operator marked
            # the release a prerelease is their call, made once, upstream.
            if [ "$(jq -r '.id' <<<"$by_id")" != "$RELEASE_ID" ] \
               || [ "$(jq -r '.tag_name' <<<"$by_id")" != "$RELEASE_TAG" ] \
               || [ "$(jq -r '.draft' <<<"$by_id")" != "$EXPECTED_DRAFT" ] \
               || [ "$(jq -r '.prerelease' <<<"$by_id")" != "$CAPTURED_PRERELEASE" ] \
               || [ "$(jq -r '.id' <<<"$by_tag")" != "$RELEASE_ID" ] \
               || [ "$remote_commit" != "$RELEASE_COMMIT" ]; then
              echo "captured release id/tag/draft/commit authority changed before asset publication" >&2
              return 1
            fi
            printf '%s' "$by_id"
          }

          declare -A local_path=()
          declare -A local_sha=()
          declare -A local_size=()
          for path in "${files[@]}"; do
            name=$(basename "$path")
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "release asset name is not URL-safe: $name" >&2
              exit 1
            fi
            local_path["$name"]="$path"
            local_sha["$name"]=$(sha256sum -- "$path" | awk '{print $1}')
            local_size["$name"]=$(stat -c '%s' -- "$path")
          done

          release_json=$(assert_draft_authority)
          mapfile -t assets < <(jq -c '.assets[]' <<<"$release_json")
          declare -A seen=()
          declare -A present=()
          for asset in "${assets[@]}"; do
            name=$(jq -r '.name' <<<"$asset")
            asset_id=$(jq -r '.id' <<<"$asset")
            state=$(jq -r '.state' <<<"$asset")
            if [[ -z "${local_path[$name]:-}" ]]; then
              echo "draft carries unexpected release asset: $name" >&2
              exit 1
            fi
            if [[ -n "${seen[$name]:-}" ]]; then
              echo "draft carries duplicate release asset name: $name" >&2
              exit 1
            fi
            seen["$name"]=1
            if [ "$state" = "starter" ]; then
              gh api --method DELETE --silent -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
              echo "removed interrupted starter asset: $name"
              continue
            fi
            if [ "$state" != "uploaded" ]; then
              echo "release asset $name has unsupported state $state" >&2
              exit 1
            fi
            size=$(jq -r '.size' <<<"$asset")
            digest=$(jq -r '.digest // ""' <<<"$asset")
            if [ "$size" != "${local_size[$name]}" ] \
               || [ "$digest" != "sha256:${local_sha[$name]}" ]; then
              echo "refusing changed bytes for immutable release asset: $name" >&2
              exit 1
            fi
            present["$name"]=1
            echo "immutable release asset already matches: $name"
          done

          # Bundles first, the manifest last.  The manifest pins the
          # bundles' exact bytes, so uploading it only after every bundle
          # it pins means an interrupted run can never leave a manifest
          # on the draft pinning bundle bytes the draft does not hold --
          # the one partial state a re-run could never adopt, because a
          # non-reproducible rebuild cannot recreate those bytes.
          manifest_name=$(basename "${manifests[0]}")
          for name in $(printf '%s\n' "${!local_path[@]}" | grep -Fxv -- "$manifest_name" | sort) "$manifest_name"; do
            if [[ -z "${present[$name]:-}" ]]; then
              path="${local_path[$name]}"
              curl --fail-with-body --silent --show-error --request POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/octet-stream" --data-binary "@$path" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$name" >/dev/null
            fi
          done

          final_json=$(assert_draft_authority)
          if [ "$(jq '.assets | length' <<<"$final_json")" -ne "${#files[@]}" ]; then
            echo "draft release asset set is not exact after upload" >&2
            exit 1
          fi
          for name in "${!local_path[@]}"; do
            match=$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$final_json")
            if [ "$(jq 'length' <<<"$match")" -ne 1 ] \
               || [ "$(jq -r '.[0].state' <<<"$match")" != "uploaded" ] \
               || [ "$(jq -r '.[0].size' <<<"$match")" != "${local_size[$name]}" ] \
               || [ "$(jq -r '.[0].digest // ""' <<<"$match")" != "sha256:${local_sha[$name]}" ]; then
              echo "uploaded release asset failed final proof: $name" >&2
              exit 1
            fi
          done

  # Last GitHub authority check before PyPI.  This no-checkout, no-OIDC cell
  # proves the captured draft, its exact assets, and the peeled tag commit.
  # The succeeding identity cell therefore needs no GitHub visibility at all.
  authorize_pypi:
    if: github.event_name != 'pull_request'
    needs: [cut, prepare, assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: release-proof
      - name: authorize the exact draft immediately before PyPI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.cut.outputs.release_id }}
          RELEASE_TAG: ${{ needs.cut.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.cut.outputs.commit }}
          EXPECTED_DRAFT: ${{ github.event_name == 'release' && 'false' || 'true' }}
          CAPTURED_PRERELEASE: ${{ needs.cut.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          asset_files=(dist-assets/*)
          if [ "${#asset_files[@]}" -ne 3 ]; then
            echo "local release asset proof set must contain exactly three files" >&2
            exit 1
          fi
          (
            cd dist-assets
            sha256sum -c ../release-proof/release-assets-SHA256SUMS
          )
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]] \
             || [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "captured release authority is malformed" >&2
            exit 1
          fi

          all_releases=$(gh api --paginate --slurp -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          id_matches=$(jq -c --argjson id "$RELEASE_ID" '[.[][] | select(.id == $id)]' <<<"$all_releases")
          tag_matches=$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' <<<"$all_releases")
          if [ "$(jq 'length' <<<"$id_matches")" -ne 1 ] \
             || [ "$(jq 'length' <<<"$tag_matches")" -ne 1 ]; then
            echo "captured draft id/tag no longer resolve exactly once" >&2
            exit 1
          fi
          by_id=$(jq -c '.[0]' <<<"$id_matches")
          by_tag=$(jq -c '.[0]' <<<"$tag_matches")
          if [ "$(jq -r '.id' <<<"$by_tag")" != "$RELEASE_ID" ] \
             || [ "$(jq -r '.tag_name' <<<"$by_id")" != "$RELEASE_TAG" ] \
             || [ "$(jq -r '.draft' <<<"$by_id")" != "$EXPECTED_DRAFT" ] \
             || [ "$(jq -r '.prerelease' <<<"$by_id")" != "$CAPTURED_PRERELEASE" ]; then
            echo "captured release id/tag/state changed before PyPI" >&2
            exit 1
          fi

          ref_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG")
          object_type=$(jq -r '.object.type' <<<"$ref_json")
          object_sha=$(jq -r '.object.sha' <<<"$ref_json")
          hops=0
          while [ "$object_type" = "tag" ]; do
            if [ "$hops" -ge 16 ]; then
              echo "annotated tag chain is unexpectedly deep" >&2
              exit 1
            fi
            tag_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/tags/$object_sha")
            object_type=$(jq -r '.object.type' <<<"$tag_json")
            object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            hops=$((hops + 1))
          done
          if [ "$object_type" != "commit" ] \
             || [ "$object_sha" != "$RELEASE_COMMIT" ]; then
            echo "release tag moved after the build" >&2
            exit 1
          fi

          if [ "$(jq '.assets | length' <<<"$by_id")" -ne "${#asset_files[@]}" ]; then
            echo "captured draft asset set changed before PyPI" >&2
            exit 1
          fi
          for path in "${asset_files[@]}"; do
            name=$(basename "$path")
            size=$(stat -c '%s' -- "$path")
            sha=$(sha256sum -- "$path" | awk '{print $1}')
            match=$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$by_id")
            if [ "$(jq 'length' <<<"$match")" -ne 1 ] \
               || [ "$(jq -r '.[0].state' <<<"$match")" != "uploaded" ] \
               || [ "$(jq -r '.[0].size' <<<"$match")" != "$size" ] \
               || [ "$(jq -r '.[0].digest // ""' <<<"$match")" != "sha256:$sha" ]; then
              echo "captured draft asset differs before PyPI: $name" >&2
              exit 1
            fi
          done

  # PyPI, and nothing else.  No checkout and no rebuild: Trusted Publishing
  # receives the exact wheel and sdist that `prepare` already proved.
  publish:
    if: github.event_name != 'pull_request'
    needs: [cut, prepare, authorize_pypi]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dists
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: release-proof
      - name: verify the exact prevalidated distributions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#files[@]}" -ne 2 ] || [ "${#wheels[@]}" -ne 1 ] \
             || [ "${#sdists[@]}" -ne 1 ]; then
            echo "python-dists must contain exactly one wheel and one sdist" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum -c ../release-proof/python-dists-SHA256SUMS
          )
      - name: reconcile exact PyPI distribution state
        id: pypi
        shell: bash
        env:
          PYPI_PROJECT: gpuwm
          PYPI_VERSION: ${{ needs.cut.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          mkdir -p dist-upload
          declare -A local_path=()
          declare -A local_sha=()
          declare -A local_size=()
          for path in "${files[@]}"; do
            name=$(basename "$path")
            local_path["$name"]="$path"
            local_sha["$name"]=$(sha256sum -- "$path" | awk '{print $1}')
            local_size["$name"]=$(stat -c '%s' -- "$path")
          done

          state="$RUNNER_TEMP/pypi-before.json"
          status=$(curl --silent --show-error --location -H "Accept: application/json" -H "Cache-Control: no-cache" --output "$state" --write-out '%{http_code}' "https://pypi.org/pypi/${PYPI_PROJECT}/${PYPI_VERSION}/json")
          case "$status" in
            200) ;;
            404) printf '{"urls":[]}\n' >"$state" ;;
            *) echo "PyPI JSON API returned HTTP $status" >&2; exit 1 ;;
          esac

          declare -A remote_seen=()
          mapfile -t remote_names < <(jq -r '.urls[].filename' "$state")
          for name in "${remote_names[@]}"; do
            if [[ -z "${local_path[$name]:-}" ]]; then
              echo "PyPI version carries unexpected distribution: $name" >&2
              exit 1
            fi
            if [[ -n "${remote_seen[$name]:-}" ]]; then
              echo "PyPI version carries duplicate distribution filename: $name" >&2
              exit 1
            fi
            remote_seen["$name"]=1
          done

          missing=0
          for name in "${!local_path[@]}"; do
            match=$(jq -c --arg name "$name" '[.urls[] | select(.filename == $name)]' "$state")
            count=$(jq 'length' <<<"$match")
            if [ "$count" -eq 0 ]; then
              cp -- "${local_path[$name]}" dist-upload/
              missing=$((missing + 1))
              continue
            fi
            if [ "$count" -ne 1 ] \
               || [ "$(jq -r '.[0].size' <<<"$match")" != "${local_size[$name]}" ] \
               || [ "$(jq -r '.[0].digests.sha256' <<<"$match")" != "${local_sha[$name]}" ] \
               || [ "$(jq -r '.[0].yanked // false' <<<"$match")" != "false" ]; then
              echo "PyPI distribution differs from the proven artifact: $name" >&2
              exit 1
            fi
            echo "PyPI distribution already matches: $name"
          done
          if [ "$missing" -eq 0 ]; then
            echo "upload_required=false" >>"$GITHUB_OUTPUT"
          else
            echo "upload_required=true" >>"$GITHUB_OUTPUT"
          fi
          echo "missing_count=$missing" >>"$GITHUB_OUTPUT"
      - if: steps.pypi.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist-upload/
      - name: prove exact PyPI state before release promotion
        shell: bash
        env:
          PYPI_PROJECT: gpuwm
          PYPI_VERSION: ${{ needs.cut.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          state="$RUNNER_TEMP/pypi-after.json"
          # The upload above can return 200 OK a beat before PyPI's JSON API
          # lists the new version -- index lag measured in the hundreds of
          # milliseconds, occasionally longer.  Retry ONLY this index read,
          # only while it answers 404, with exponential backoff bounded at
          # five minutes total.  Any other status, and every exact-state
          # assertion below, keeps its original single-shot fail-closed
          # semantics: once the budget is exhausted a 404 is the same hard
          # failure it always was.
          budget="${PYPI_INDEX_RETRY_BUDGET_SECONDS:-300}"
          delay="${PYPI_INDEX_RETRY_INITIAL_DELAY_SECONDS:-1}"
          if [ "$delay" -lt 1 ]; then
            delay=1
          fi
          elapsed=0
          while :; do
            status=$(curl --silent --show-error --location -H "Accept: application/json" -H "Cache-Control: no-cache" --output "$state" --write-out '%{http_code}' "https://pypi.org/pypi/${PYPI_PROJECT}/${PYPI_VERSION}/json")
            if [ "$status" != "404" ] || [ "$elapsed" -ge "$budget" ]; then
              break
            fi
            pause=$delay
            remaining=$((budget - elapsed))
            if [ "$pause" -gt "$remaining" ]; then
              pause=$remaining
            fi
            echo "PyPI index does not list ${PYPI_PROJECT} ${PYPI_VERSION} yet (HTTP 404); retrying in ${pause}s"
            sleep "$pause"
            elapsed=$((elapsed + pause))
            delay=$((delay * 2))
          done
          if [ "$status" != "200" ]; then
            echo "PyPI exact-state proof returned HTTP $status" >&2
            exit 1
          fi
          if [ "$(jq '.urls | length' "$state")" -ne "${#files[@]}" ]; then
            echo "PyPI release does not carry the exact distribution set" >&2
            exit 1
          fi
          for path in "${files[@]}"; do
            name=$(basename "$path")
            size=$(stat -c '%s' -- "$path")
            sha=$(sha256sum -- "$path" | awk '{print $1}')
            match=$(jq -c --arg name "$name" '[.urls[] | select(.filename == $name)]' "$state")
            if [ "$(jq 'length' <<<"$match")" -ne 1 ] \
               || [ "$(jq -r '.[0].size' <<<"$match")" != "$size" ] \
               || [ "$(jq -r '.[0].digests.sha256' <<<"$match")" != "$sha" ] \
               || [ "$(jq -r '.[0].yanked // false' <<<"$match")" != "false" ]; then
              echo "PyPI exact-state proof failed for $name" >&2
              exit 1
            fi
          done

  # GitHub draft promotion, and nothing else. No checkout, repository code,
  # build toolchain, or PyPI identity is present in this final privilege cell.
  release:
    if: github.event_name != 'pull_request'
    needs: [cut, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dists
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: release-proof
      - name: publish the fully-proven draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.cut.outputs.release_id }}
          RELEASE_TAG: ${{ needs.cut.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.cut.outputs.commit }}
          PYPI_PROJECT: gpuwm
          PYPI_VERSION: ${{ needs.cut.outputs.version }}
          # The prerelease state release_authority captured.  Promotion
          # preserves it rather than forcing it to false: with the
          # non-prerelease check demoted to a warning upstream, clearing the
          # flag here would publish as stable something the operator marked
          # otherwise -- a silent state change, which is worse than either
          # refusing or preserving.
          CAPTURED_PRERELEASE: ${{ needs.cut.outputs.prerelease }}
          # Empty on any trigger that is not workflow_dispatch, which the
          # comparisons below treat as "not opted in".  Declared here because
          # this step runs under `set -u` and the input is otherwise only in
          # scope in release_authority.
          IMMUTABLE_RELEASES_CONFIRMED: ${{ inputs.immutable_releases_enabled }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]] \
             || [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "captured release authority is malformed" >&2
            exit 1
          fi

          all_releases=$(gh api --paginate --slurp -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          id_matches=$(jq -c --argjson id "$RELEASE_ID" '[.[][] | select(.id == $id)]' <<<"$all_releases")
          tag_matches=$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' <<<"$all_releases")
          if [ "$(jq 'length' <<<"$id_matches")" -ne 1 ] \
             || [ "$(jq 'length' <<<"$tag_matches")" -ne 1 ]; then
            echo "captured release id/tag no longer resolve exactly once" >&2
            exit 1
          fi
          current=$(jq -c '.[0]' <<<"$id_matches")
          by_tag=$(jq -c '.[0]' <<<"$tag_matches")
          if [ "$(jq -r '.tag_name' <<<"$current")" != "$RELEASE_TAG" ] \
             || [ "$(jq -r '.id' <<<"$by_tag")" != "$RELEASE_ID" ] \
             || [ "$(jq -r '.prerelease' <<<"$current")" != "$CAPTURED_PRERELEASE" ]; then
            echo "captured release id/tag authority changed before promotion" >&2
            exit 1
          fi

          ref_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG")
          object_type=$(jq -r '.object.type' <<<"$ref_json")
          object_sha=$(jq -r '.object.sha' <<<"$ref_json")
          hops=0
          while [ "$object_type" = "tag" ]; do
            if [ "$hops" -ge 16 ]; then
              echo "annotated tag chain is unexpectedly deep" >&2
              exit 1
            fi
            tag_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/tags/$object_sha")
            object_type=$(jq -r '.object.type' <<<"$tag_json")
            object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            hops=$((hops + 1))
          done
          if [ "$object_type" != "commit" ] \
             || [ "$object_sha" != "$RELEASE_COMMIT" ]; then
            echo "release tag moved before final promotion" >&2
            exit 1
          fi

          shopt -s nullglob
          asset_files=(dist-assets/*)
          dist_files=(dist/*)
          if [ "${#asset_files[@]}" -ne 3 ] || [ "${#dist_files[@]}" -ne 2 ]; then
            echo "final promotion local artifact sets are not exact" >&2
            exit 1
          fi
          (
            cd dist-assets
            sha256sum -c ../release-proof/release-assets-SHA256SUMS
          )
          (
            cd dist
            sha256sum -c ../release-proof/python-dists-SHA256SUMS
          )
          if [ "$(jq '.assets | length' <<<"$current")" -ne "${#asset_files[@]}" ]; then
            echo "final promotion draft asset set changed" >&2
            exit 1
          fi
          for path in "${asset_files[@]}"; do
            name=$(basename "$path")
            size=$(stat -c '%s' -- "$path")
            sha=$(sha256sum -- "$path" | awk '{print $1}')
            match=$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$current")
            if [ "$(jq 'length' <<<"$match")" -ne 1 ] \
               || [ "$(jq -r '.[0].state' <<<"$match")" != "uploaded" ] \
               || [ "$(jq -r '.[0].size' <<<"$match")" != "$size" ] \
               || [ "$(jq -r '.[0].digest // ""' <<<"$match")" != "sha256:$sha" ]; then
              echo "final promotion asset proof failed: $name" >&2
              exit 1
            fi
          done

          pypi_state="$RUNNER_TEMP/pypi-final.json"
          # The same index lag the publish job absorbs on its own read of
          # this endpoint: uploads return 200 OK a beat before PyPI's JSON
          # API lists the new version, and this read was measured to hit
          # that window live (uploads at T+0, a 404 here at T+59s while the
          # publish job's retry logged the same 404s before succeeding).
          # Retry ONLY this index read, only while it answers 404, with the
          # same exponential backoff bounded at five minutes total.  Any
          # other status, and every exact-state assertion below, keeps its
          # single-shot fail-closed semantics.
          budget="${PYPI_INDEX_RETRY_BUDGET_SECONDS:-300}"
          delay="${PYPI_INDEX_RETRY_INITIAL_DELAY_SECONDS:-1}"
          if [ "$delay" -lt 1 ]; then
            delay=1
          fi
          elapsed=0
          while :; do
            pypi_status=$(curl --silent --show-error --location -H "Accept: application/json" -H "Cache-Control: no-cache" --output "$pypi_state" --write-out '%{http_code}' "https://pypi.org/pypi/${PYPI_PROJECT}/${PYPI_VERSION}/json")
            if [ "$pypi_status" != "404" ] || [ "$elapsed" -ge "$budget" ]; then
              break
            fi
            pause=$delay
            remaining=$((budget - elapsed))
            if [ "$pause" -gt "$remaining" ]; then
              pause=$remaining
            fi
            echo "PyPI index does not list ${PYPI_PROJECT} ${PYPI_VERSION} yet (HTTP 404); retrying in ${pause}s"
            sleep "$pause"
            elapsed=$((elapsed + pause))
            delay=$((delay * 2))
          done
          if [ "$pypi_status" != "200" ] \
             || [ "$(jq '.urls | length' "$pypi_state")" -ne "${#dist_files[@]}" ]; then
            echo "final promotion PyPI artifact set changed" >&2
            exit 1
          fi
          for path in "${dist_files[@]}"; do
            name=$(basename "$path")
            size=$(stat -c '%s' -- "$path")
            sha=$(sha256sum -- "$path" | awk '{print $1}')
            match=$(jq -c --arg name "$name" '[.urls[] | select(.filename == $name)]' "$pypi_state")
            if [ "$(jq 'length' <<<"$match")" -ne 1 ] \
               || [ "$(jq -r '.[0].size' <<<"$match")" != "$size" ] \
               || [ "$(jq -r '.[0].digests.sha256' <<<"$match")" != "$sha" ] \
               || [ "$(jq -r '.[0].yanked // false' <<<"$match")" != "false" ]; then
              echo "final promotion PyPI proof failed: $name" >&2
              exit 1
            fi
          done

          # Retry safety.  This recognises an already-promoted release so a
          # re-run exits clean instead of trying to promote twice.  The
          # immutable leg is only required when enforcement was opted into --
          # otherwise a retry after a successful promotion would fail this
          # test, fall through to the draft check below, find draft=false and
          # abort with "invalid draft state" on a release that is in fact fine.
          # This is also the whole of the release-event ingress: that trigger
          # fires on an already-public release, so everything above proved it
          # and there is nothing left to promote.
          if [ "$(jq -r '.draft' <<<"$current")" = "false" ] \
             && { [ "$IMMUTABLE_RELEASES_CONFIRMED" != "true" ] \
                  || [ "$(jq -r '.immutable' <<<"$current")" = "true" ]; } \
             && [ "$(jq -r '.prerelease' <<<"$current")" = "$CAPTURED_PRERELEASE" ]; then
            echo "release ${RELEASE_TAG} is already public at the captured id"
            exit 0
          fi
          if [ "$(jq -r '.draft' <<<"$current")" != "true" ]; then
            echo "release ${RELEASE_TAG} has an invalid draft state" >&2
            exit 1
          fi
          gh api --method PATCH -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -F "prerelease=$CAPTURED_PRERELEASE" >/dev/null
          after_releases=$(gh api --paginate --slurp -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          after_id_matches=$(jq -c --argjson id "$RELEASE_ID" '[.[][] | select(.id == $id)]' <<<"$after_releases")
          after_tag_matches=$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' <<<"$after_releases")
          if [ "$(jq 'length' <<<"$after_id_matches")" -ne 1 ] \
             || [ "$(jq 'length' <<<"$after_tag_matches")" -ne 1 ]; then
            echo "published release id/tag do not resolve exactly once" >&2
            exit 1
          fi
          after=$(jq -c '.[0]' <<<"$after_id_matches")
          after_by_tag=$(jq -c '.[0]' <<<"$after_tag_matches")
          after_ref_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/ref/tags/$RELEASE_TAG")
          after_object_type=$(jq -r '.object.type' <<<"$after_ref_json")
          after_object_sha=$(jq -r '.object.sha' <<<"$after_ref_json")
          after_hops=0
          while [ "$after_object_type" = "tag" ]; do
            if [ "$after_hops" -ge 16 ]; then
              echo "published annotated tag chain is unexpectedly deep" >&2
              exit 1
            fi
            after_tag_json=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/git/tags/$after_object_sha")
            after_object_type=$(jq -r '.object.type' <<<"$after_tag_json")
            after_object_sha=$(jq -r '.object.sha' <<<"$after_tag_json")
            after_hops=$((after_hops + 1))
          done
          if [ "$(jq '.assets | length' <<<"$after")" -ne "${#asset_files[@]}" ]; then
            echo "immutable release asset set changed during promotion" >&2
            exit 1
          fi
          for path in "${asset_files[@]}"; do
            name=$(basename "$path")
            size=$(stat -c '%s' -- "$path")
            sha=$(sha256sum -- "$path" | awk '{print $1}')
            match=$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$after")
            if [ "$(jq 'length' <<<"$match")" -ne 1 ] \
               || [ "$(jq -r '.[0].state' <<<"$match")" != "uploaded" ] \
               || [ "$(jq -r '.[0].size' <<<"$match")" != "$size" ] \
               || [ "$(jq -r '.[0].digest // ""' <<<"$match")" != "sha256:$sha" ]; then
              echo "immutable release asset changed during promotion: $name" >&2
              exit 1
            fi
          done

          promoted_pypi_state="$RUNNER_TEMP/pypi-promoted.json"
          promoted_pypi_status=$(curl --silent --show-error --location -H "Accept: application/json" -H "Cache-Control: no-cache" --output "$promoted_pypi_state" --write-out '%{http_code}' "https://pypi.org/pypi/${PYPI_PROJECT}/${PYPI_VERSION}/json")
          if [ "$promoted_pypi_status" != "200" ] \
             || [ "$(jq '.urls | length' "$promoted_pypi_state")" -ne "${#dist_files[@]}" ]; then
            echo "immutable release PyPI artifact set changed during promotion" >&2
            exit 1
          fi
          for path in "${dist_files[@]}"; do
            name=$(basename "$path")
            size=$(stat -c '%s' -- "$path")
            sha=$(sha256sum -- "$path" | awk '{print $1}')
            match=$(jq -c --arg name "$name" '[.urls[] | select(.filename == $name)]' "$promoted_pypi_state")
            if [ "$(jq 'length' <<<"$match")" -ne 1 ] \
               || [ "$(jq -r '.[0].size' <<<"$match")" != "$size" ] \
               || [ "$(jq -r '.[0].digests.sha256' <<<"$match")" != "$sha" ] \
               || [ "$(jq -r '.[0].yanked // false' <<<"$match")" != "false" ]; then
              echo "immutable release PyPI artifact changed during promotion: $name" >&2
              exit 1
            fi
          done
          # Everything that proves THIS cut published what it built stays a hard
          # gate: the release id, the tag, the release going public with the
          # prerelease state it was captured with, the tag resolving to the
          # exact commit, and the asset and PyPI byte checks above.  What is
          # not asserted is that the operator chose any particular prerelease
          # value -- that is procedure, and it warns upstream.
          # Immutability is the one leg that is a repo setting
          # rather than a property of this cut, so it is asserted only when the
          # operator opted in, and reported otherwise.
          if [ "$(jq -r '.id' <<<"$after")" != "$RELEASE_ID" ] \
             || [ "$(jq -r '.tag_name' <<<"$after")" != "$RELEASE_TAG" ] \
             || [ "$(jq -r '.draft' <<<"$after")" != "false" ] \
             || [ "$(jq -r '.prerelease' <<<"$after")" != "$CAPTURED_PRERELEASE" ] \
             || [ "$(jq -r '.id' <<<"$after_by_tag")" != "$RELEASE_ID" ] \
             || [ "$after_object_type" != "commit" ] \
             || [ "$after_object_sha" != "$RELEASE_COMMIT" ]; then
            echo "release promotion did not preserve the proven id/tag or public state" >&2
            exit 1
          fi
          after_immutable=$(jq -r '.immutable' <<<"$after")
          if [ "$IMMUTABLE_RELEASES_CONFIRMED" = "true" ]; then
            if [ "$after_immutable" != "true" ]; then
              echo "immutability was confirmed at dispatch but GitHub reports the published release as mutable" >&2
              exit 1
            fi
            echo "published release is immutable"
          else
            echo "::warning::published release immutable=${after_immutable}; immutability was not opted into for this cut"
          fi
