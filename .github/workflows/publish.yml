# Promote a complete prepared packet without rebuilding its bytes.
# Both PyPI projects retain the publish.yml / pypi Trusted Publisher binding.
# See docs/dev/prepared-publication.md for preparation and retry procedure.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact prepared tag; select the same tag as the workflow ref
        required: true
        type: string
      publication_manifest_sha256:
        description: SHA-256 of PUBLICATION-ASSETS.json (or use the release-body marker)
        required: false
        type: string
      stable_release_expected:
        description: Require a stable X.Y.Z version
        required: false
        default: false
        type: boolean
      immutable_releases_enabled:
        description: Require GitHub to report the public release immutable
        required: false
        default: false
        type: boolean
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GPUWM_NO_LOCAL_GPU: '1'
    outputs:
      controller_sha256: ${{ steps.controller.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # These are unpinned validation fixtures. Only the captured packet can
      # flow to upload jobs; the test installation is never a release input.
      - name: install the companion from the tree, then gpuwm editable
        env:
          GPUWM_ALLOW_UNPINNED_WHEEL: '1'
        run: |
          python -m pip install build pyyaml
          python -m build --outdir companion-dist gpuwm-data
          python -m pip install companion-dist/*.whl
          python -m pip install -e ".[dev]"
      - name: packaging and contract tests
        run: |
          python tools/verify_source_bridge_pins.py
          python -m pytest -q -m "not gpu and not slow and not network" \
            tests/test_bridge_fetch.py \
            tests/test_table_fetch.py \
            tests/test_package_data_coverage.py \
            tests/test_companion_distribution.py \
            tests/test_configs_are_packaged.py \
            tests/test_doctor.py \
            tests/test_doctor_nexrad.py \
            tests/test_cli.py \
            tests/test_tui_cli.py \
            tests/test_source_adapters.py \
            tests/test_namelist_compat.py \
            tests/test_native_wrf_distribution.py \
            tests/test_prepared_publication.py \
            tests/test_publish_workflow_state_machine.py \
            tests/test_publish_dist_shape_agreement.py \
            tests/test_release_version_declaration.py \
            tests/test_bridge_bundle_adopt.py \
            tests/test_verify_source_bridge_pins.py \
            tests/test_verify_release_artifacts.py
      - id: controller
        name: capture the tested controller hash
        shell: bash
        run: echo "sha256=$(sha256sum tools/promote_prepared_release.py | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-controller
          path: tools/promote_prepared_release.py
          if-no-files-found: error

  # Authenticated reads capture the complete draft/public release. This job
  # cannot upload to PyPI and executes only the same-run tested controller.
  release_authority:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.capture.outputs.tag }}
      version: ${{ steps.capture.outputs.version }}
      commit: ${{ steps.capture.outputs.commit }}
      release_id: ${{ steps.capture.outputs.release_id }}
      manifest_sha256: ${{ steps.capture.outputs.manifest_sha256 }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-controller
          path: controller
      - name: verify the tested controller
        env:
          CONTROLLER_SHA256: ${{ needs.test.outputs.controller_sha256 }}
        run: echo "$CONTROLLER_SHA256  controller/promote_prepared_release.py" | sha256sum --check --strict
      - id: capture
        name: capture exact prepared assets and release authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          MANIFEST_SHA256: ${{ inputs.publication_manifest_sha256 }}
          STABLE_RELEASE_EXPECTED: ${{ inputs.stable_release_expected }}
          IMMUTABLE_RELEASES_ENABLED: ${{ inputs.immutable_releases_enabled }}
        shell: bash
        run: |
          flags=()
          if [ "$STABLE_RELEASE_EXPECTED" = true ]; then flags+=(--stable-release-expected); fi
          if [ "$IMMUTABLE_RELEASES_ENABLED" = true ]; then flags+=(--immutable-releases-enabled); fi
          python controller/promote_prepared_release.py capture --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --ref "$GITHUB_REF" --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --manifest-sha256 "$MANIFEST_SHA256" --out "$RUNNER_TEMP/prepared-packet" "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-packet
          path: ${{ runner.temp }}/prepared-packet
          if-no-files-found: error
          retention-days: 30

  prepare:
    if: github.event_name != 'pull_request'
    needs: [test, release_authority]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PUBLICATION_COMMIT: ${{ needs.release_authority.outputs.commit }}
      PUBLICATION_MANIFEST_SHA256: ${{ needs.release_authority.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_authority.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-packet
          path: ${{ runner.temp }}/prepared-packet
      - name: verify the tested controller
        env:
          CONTROLLER_SHA256: ${{ needs.test.outputs.controller_sha256 }}
        run: echo "$CONTROLLER_SHA256  tools/promote_prepared_release.py" | sha256sum --check --strict
      - name: prove all six distributions and exact native bundles
        run: |
          python -m pip install 'twine>=7,<8' 'setuptools>=77' packaging
          python tools/promote_prepared_release.py verify --packet "$RUNNER_TEMP/prepared-packet" --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/release-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-proof
          path: ${{ runner.temp }}/release-proof
          if-no-files-found: error
          retention-days: 30

  qualify:
    if: github.event_name != 'pull_request'
    needs: [test, release_authority, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: win-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PUBLICATION_COMMIT: ${{ needs.release_authority.outputs.commit }}
      PUBLICATION_MANIFEST_SHA256: ${{ needs.release_authority.outputs.manifest_sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release_authority.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-packet
          path: ${{ runner.temp }}/prepared-packet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: ${{ runner.temp }}/release-proof
      - name: verify the tested controller
        env:
          CONTROLLER_SHA256: ${{ needs.test.outputs.controller_sha256 }}
        run: echo "$CONTROLLER_SHA256  tools/promote_prepared_release.py" | sha256sum --check --strict
      - name: qualify a fresh platform installation without a forecast
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python tools/promote_prepared_release.py smoke --packet "$RUNNER_TEMP/prepared-packet" --proof "$RUNNER_TEMP/release-proof" --repo "$GITHUB_WORKSPACE" --platform "$RELEASE_PLATFORM" --out "$RUNNER_TEMP/platform-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.platform }}
          path: ${{ runner.temp }}/platform-smoke/SMOKE.json
          if-no-files-found: error

  # GitHub assets must be public before the engine can need their URLs.
  assets:
    if: github.event_name != 'pull_request'
    needs: [test, release_authority, prepare, qualify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PUBLICATION_COMMIT: ${{ needs.release_authority.outputs.commit }}
      PUBLICATION_MANIFEST_SHA256: ${{ needs.release_authority.outputs.manifest_sha256 }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-controller
          path: controller
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: ${{ runner.temp }}/release-proof
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: smoke-*
          path: ${{ runner.temp }}/platform-smokes
      - name: verify the tested controller
        env:
          CONTROLLER_SHA256: ${{ needs.test.outputs.controller_sha256 }}
        run: echo "$CONTROLLER_SHA256  controller/promote_prepared_release.py" | sha256sum --check --strict
      - name: publish the verified GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/promote_prepared_release.py promote --proof "$RUNNER_TEMP/release-proof" --smokes "$RUNNER_TEMP/platform-smokes" --out "$RUNNER_TEMP/PUBLIC-ASSETS.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-assets-proof
          path: ${{ runner.temp }}/PUBLIC-ASSETS.json
          if-no-files-found: error

  # OIDC alone: no checkout, GitHub credential, build or asset mutation here.
  publish:
    if: github.event_name != 'pull_request'
    needs: [test, release_authority, prepare, assets]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment: pypi
    env:
      PUBLICATION_COMMIT: ${{ needs.release_authority.outputs.commit }}
      PUBLICATION_MANIFEST_SHA256: ${{ needs.release_authority.outputs.manifest_sha256 }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-controller
          path: controller
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: ${{ runner.temp }}/release-proof
      - name: verify the tested controller
        env:
          CONTROLLER_SHA256: ${{ needs.test.outputs.controller_sha256 }}
        run: echo "$CONTROLLER_SHA256  controller/promote_prepared_release.py" | sha256sum --check --strict
      - id: data
        name: reconcile and stage only missing companion files
        run: python controller/promote_prepared_release.py stage-missing --proof "$RUNNER_TEMP/release-proof" --dists "$RUNNER_TEMP/release-proof/dists" --project gpuwm-data --out upload-data
      - name: upload companion files
        if: steps.data.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: upload-data/
      - name: prove both companion index entries
        run: python controller/promote_prepared_release.py wait-index --proof "$RUNNER_TEMP/release-proof" --project gpuwm-data --out "$RUNNER_TEMP/DATA-INDEX.json"
      - id: native
        name: reconcile and stage only missing platform engine wheels
        run: python controller/promote_prepared_release.py stage-missing --proof "$RUNNER_TEMP/release-proof" --dists "$RUNNER_TEMP/release-proof/dists" --project gpuwm --phase native --out upload-native
      - name: upload platform engine wheels
        if: steps.native.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: upload-native/
      - name: prove both native engine index entries
        run: python controller/promote_prepared_release.py wait-index --proof "$RUNNER_TEMP/release-proof" --project gpuwm --phase native --out "$RUNNER_TEMP/NATIVE-INDEX.json"
      - id: pure
        name: reconcile and stage only missing universal engine files
        run: python controller/promote_prepared_release.py stage-missing --proof "$RUNNER_TEMP/release-proof" --dists "$RUNNER_TEMP/release-proof/dists" --project gpuwm --phase pure --out upload-pure
      - name: upload universal wheel and engine source
        if: steps.pure.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: upload-pure/
      - name: prove the complete four-file engine index
        run: python controller/promote_prepared_release.py wait-index --proof "$RUNNER_TEMP/release-proof" --project gpuwm --out "$RUNNER_TEMP/ENGINE-INDEX.json"

  release:
    if: github.event_name != 'pull_request'
    needs: [test, release_authority, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PUBLICATION_COMMIT: ${{ needs.release_authority.outputs.commit }}
      PUBLICATION_MANIFEST_SHA256: ${{ needs.release_authority.outputs.manifest_sha256 }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-controller
          path: controller
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: ${{ runner.temp }}/release-proof
      - name: verify the tested controller
        env:
          CONTROLLER_SHA256: ${{ needs.test.outputs.controller_sha256 }}
        run: echo "$CONTROLLER_SHA256  controller/promote_prepared_release.py" | sha256sum --check --strict
      - name: record exact public release and both complete indexes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/promote_prepared_release.py finish --proof "$RUNNER_TEMP/release-proof" --out "$RUNNER_TEMP/PUBLICATION-RESULT.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-result
          path: ${{ runner.temp }}/PUBLICATION-RESULT.json
          if-no-files-found: error
          retention-days: 90
