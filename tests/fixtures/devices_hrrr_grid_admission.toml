# Admission-only fixture with the HRRR CONUS footprint (1797 x 1057) and
# physics (mp 28 with WIF aerosol climatology, MYNN 5 and sf_sfclay 5,
# RUC 3 with nine soil layers, legacy RRTMG). The public 50-level ladder
# is resampled to 64 mass levels to keep a clear two-card memory premise.
# This taller vertical grid is synthetic, not the operational HRRR grid.
# test_per_card_admission requires at least 10% over one 96 GiB card
# and at least 10% free capacity per card when split across two.

[experiment]
name = "hrrr-grid-admission"
start_time = 2026-09-29T12:00:00
run_seconds = 64800.0
feedback = 1
smooth_option = 0
blend_width = 5
spec_bdy_width = 10
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 38.5
truelat2 = 38.5
stand_lon = -97.5

[shared]
# Synthetic WRF e_vert = 65 staggered full levels -> nz = 64 mass levels.
nz = 64
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 1500.0
eta_levels = [
    1.0, 0.9984375, 0.99575, 0.99159375, 0.9855,
    0.976125, 0.964, 0.949625, 0.93325, 0.91525,
    0.8965, 0.87596875, 0.85375, 0.82984375, 0.8040625,
    0.776125, 0.7465, 0.7151875, 0.6821875, 0.64703125,
    0.61, 0.5716875, 0.5335625, 0.49840625, 0.466625,
    0.437375, 0.41025, 0.38493437, 0.3618875, 0.34080938,
    0.32124375, 0.30309687, 0.2863, 0.27122188, 0.2572125,
    0.24385937, 0.2311375, 0.22012187, 0.20910625, 0.19809062,
    0.187075, 0.17605937, 0.16504375, 0.15402812, 0.1430125,
    0.13199688, 0.12098125, 0.10996562, 0.09895, 0.08793437,
    0.07704375, 0.06759062, 0.0601375, 0.05346875, 0.04715625,
    0.04114063, 0.0355, 0.03019375, 0.0251625, 0.02035625,
    0.015825, 0.01155625, 0.0075125, 0.00367188, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.1
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
# Adaptive time step (Registry.EM_COMMON:2269-2281).  Off unless
# the namelist asked for it; with it off every value below is
# WRF's Registry default and nothing reads them.
use_adaptive_time_step = true
step_to_output_time = true
adaptation_domain = 1
target_cfl = 1.4
target_hcfl = 0.98
max_step_increase_pct = 5
starting_time_step = 15
starting_time_step_den = 0
max_time_step = 60
max_time_step_den = 0
min_time_step = 3
min_time_step_den = 0
h_sca_adv_order = 5
smdiv = 0.1
top_lid = false
moist = true
moist_cq = false
mp_physics = 28
morr_rimed_ice = 1
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 0
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
# &physics use_aero_icbc = .true. + &domains wif_input_opt = 1:
# the ported QNWFA_QNIFA_SIGMA_MONTHLY.dat climatology ingest.
# Leave wif_climatology_path unset to read the staged copy
# (`gpuwm fetch-tables --wif`, ~/.gpuwm/wif).
aer_init_opt = 1
wif_input_opt = 1
diff_6th_thresh = 0.05
moist_mix6_off = false
spec_zone = 1
relax_zone = 9
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 5
sf_surface_physics = 3
bl_pbl_physics = 5
ra_physics = 4
num_soil_layers = 9
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
bldt = 0.0

[[domain]]
# HRRR e_we = 1800, e_sn = 1060 (1799 x 1059 mass points). One row is trimmed on every side (1797 x 1057, same centre):
# the engine refuses a domain whose cell corners reach past the hrrr-prs grid it is driven from.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 1797
ny = 1057
time_step = 15
dx = 3000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 15.0
cu_physics = 0
diff_6th_factor = 0.12

[output]
# The engine's 'minimal' surface set plus REFL_10CM (composite reflectivity is drawn from it) and the fields the quick
# skill needs (T2, Q2, PSFC, U10, V10, COSALPHA, SINALPHA, RAINC, RAINNC, LANDMASK); the engine adds its structural
# fields (T, PHB, HGT, coordinates). Same list as the 2026-09-28 CONUS 3 km speed run.
history_vars = ["COSALPHA", "E", "F", "GLW", "GRAUPELNC", "GRDFLX", "HAILNC", "HFX", "ISLTYP", "IVGTYP",
    "LANDMASK", "LH", "LU_INDEX", "MAPFAC_M", "MAPFAC_U", "MAPFAC_V", "MU", "OLR", "PBLH", "PSFC", "PSIH",
    "PSIM", "Q2", "QFX", "RAINC", "RAINNC", "RAINSH", "SEAICE", "SINALPHA", "SNOW", "SNOWC", "SNOWH",
    "SNOWNC", "SWDOWN", "T2", "TH2", "TMN", "TSK", "U10", "UP_HELI_MAX", "UST", "V10", "VEGFRA", "XLAT_U",
    "XLAT_V", "XLONG_U", "XLONG_V", "REFL_10CM"]

[fetch]
source = "hrrr-prs"
cycle = "2026-09-29T12"
hours = 18
cadence = 1
