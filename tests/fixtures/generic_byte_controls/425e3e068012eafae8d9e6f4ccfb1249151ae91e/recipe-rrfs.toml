# Emitted by `gpuwm domain` -- point 38.5,-97.5, ladder 3 km.
# PHYSICS: wsm6-mynn-mynn-ruc-no-radiation-implemented-unverified-v1: mp_physics 6, longwave OFF, shortwave Dudhia (radt 1 min), NO cumulus parameterization, bl_pbl_physics 5, sf_surface_physics 3.
# Taken verbatim from gpuwm.physics_compat, so this file passes the prepared-
# forecast runner's profile guard as emitted.  Child dx/dt derive exactly from
# the parent chain and are never hand-typed (gpuwm/experiment.py).
# NOT NOCTURNALLY VALID (shortwave on, longwave OFF) -- acceptable for this
# all-daylight window; re-emit with a full lw+sw profile before running any
# window that includes local night.
# JUSTIFY constant-downward-longwave-v1: this suite sets
# ra_lw_physics = 0, so NOTHING computes downward longwave and
# the surface integrates a declared constant 300 W m-2 for the whole
# forecast.  Emitted only because this profile was selected explicitly.
# Re-emit with a full lw+sw profile for any run whose surface fields you
# intend to believe.

[experiment]
name = "source-request"
