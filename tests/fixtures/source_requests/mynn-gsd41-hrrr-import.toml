# gpuwm experiment translated from WRF namelists by `gpuwm import-namelist`
# (hrrr_namelist.wps.c18 + hrrr_wrf.nl).  WRF staggered e_we/e_sn/e_vert convert
# to gpuwm mass dimensions nx/ny/nz (one fewer point).  Child dx/dt are NEVER
# written: gpuwm/experiment.py derives them exactly from the parent chain
# (the namelist chain is authoritative).
# Physics substitutions (ratified, never silent):
#   ra_lw_physics/ra_sw_physics 4 (RRTMG) -> ra_physics 4 (WRF legacy RRTMG)
#   use_theta_m 1 (moist potential temperature (theta_m) prognostic) -> use_theta_m 0 (dry potential temperature)

[experiment]
name = "wrf_2026092912_1dom"
start_time = 2026-09-29T12:00:00
run_seconds = 64800.0
feedback = 1
smooth_option = 0
blend_width = 5
spec_bdy_width = 10
restart_interval_s = 300000.0

[projection]
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 38.5
truelat2 = 38.5
stand_lon = -97.5

[shared]
mynn_sfclay_variant = "gsl_wrf39"
diff_6th_factor2 = 0.04
mp_zero_out = 2
mp_zero_out_thresh = 1e-12
mp_zero_out_all = 1
rrtmg_cloud_optics_form = "noaa_wrf39"
bl_mynn_version = "gsd_41"
# WRF e_vert = 51 staggered full levels -> nz = 50 mass levels.
nz = 50
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 1500.0
eta_levels = [
    1.0, 0.998, 0.994, 0.987, 0.975,
    0.959, 0.939, 0.916, 0.892, 0.865,
    0.835, 0.802, 0.766, 0.727, 0.685,
    0.64, 0.592, 0.542, 0.497, 0.4565,
    0.4205, 0.3877, 0.3582, 0.3317, 0.3078,
    0.2863, 0.267, 0.2496, 0.2329, 0.2188,
    0.2047, 0.1906, 0.1765, 0.1624, 0.1483,
    0.1342, 0.1201, 0.106, 0.0919, 0.0778,
    0.0657, 0.0568, 0.0486, 0.0409, 0.0337,
    0.0271, 0.0209, 0.0151, 0.0097, 0.0047,
    0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 6
epssm = 0.1
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
# Adaptive time step (Registry.EM_COMMON:2269-2281).  Off unless
# the namelist asked for it; with it off every value below is
# WRF's Registry default and nothing reads them.
use_adaptive_time_step = false
step_to_output_time = true
adaptation_domain = 1
target_cfl = 1.2
target_hcfl = 0.84
max_step_increase_pct = 5
starting_time_step = 20
starting_time_step_den = 0
max_time_step = 20
max_time_step_den = 0
min_time_step = 20
min_time_step_den = 0
# The namelist's starting = max = min step is WRF's fixed step through
# the adaptive clock, with the acoustic count WRF derives from it; the
# engine runs that clock as written and records the terrain clock's
# verdict as advice in the receipt.
terrain_clock = "pinned"
h_sca_adv_order = 5
smdiv = 0.1
top_lid = true
moist = true
moist_cq = true
mp_physics = 28
morr_rimed_ice = 1
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 0
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
# &physics use_aero_icbc = .true. + &domains wif_input_opt = 1:
# the ported QNWFA_QNIFA_SIGMA_MONTHLY.dat climatology ingest.
# Leave wif_climatology_path unset to read the staged copy
# (`gpuwm fetch-tables --wif`, ~/.gpuwm/wif).
aer_init_opt = 1
wif_input_opt = 1
diff_6th_thresh = 0.05
moist_mix6_off = false
diff_6th_form = "noaa_wrf39"
upper_wind_limiter_form = "noaa_wrf39"
spec_zone = 1
relax_zone = 9
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 5
sf_surface_physics = 3
bl_pbl_physics = 5
ra_physics = 4
sf_urban_physics = 0
use_wudapt_lcz = 0
num_urban_hi = 15
num_soil_layers = 9
bl_mynn_mixlength = 1
fractional_seaice = 1
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
bldt = 0.0

[[domain]]
# WRF e_we = 1800, e_sn = 1060 (staggered) -> mass dimensions.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 1799
ny = 1059
time_step = 20
dx = 3000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 900.0
radt = 15.0
cu_physics = 0
diff_6th_factor = 0.12
