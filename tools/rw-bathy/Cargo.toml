[package]
name = "rw-bathy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace]
members = ["."]

[[bin]]
name = "rw_bathy"
path = "src/main.rs"

[dependencies]
netcrust = { path = "../rustwx/vendor/netcrust" }
netcdf-writer = { path = "../rustwx/crates/netcdf-writer" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
