[package]
name = "nextgen-hydrofabric"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[lib]
crate-type = ["rlib", "cdylib"]
[[bin]]
name = "rw_hydrofabric"
path = "src/main.rs"
[[bin]]
name = "rw_hydrofabric_source_archive"
path = "src/bin/source_archive.rs"
required-features = ["source-archive"]
[[bin]]
name = "rw_hydrofabric_netcdf_subset"
path = "src/bin/netcdf_subset.rs"
required-features = ["source-netcdf"]
[features]
source-archive = []
source-netcdf = []
[dependencies]
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the parent_grid_contract (and every f64 in a request)
# comes back bit-identical; without it the copied contract lost the last digit
# of moad_cen_lon (-97.38461704178019 -> -97.3846170417802) and the provider
# refused its own routing ("warm routing lost the exact forecast parent-grid identity").
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# The cdylib ships in the platform wheel (gpuwm/libexec/bridges); 2.9.4 shipped it with its
# static symbol table, the only unstripped artifact there.  The ABI symbol stays in .dynsym.
[profile.release]
strip = "symbols"
[workspace]
