# GFS quickstart -- one 12 km Lambert domain over the southern Great Plains
# (35.5N 97.5W), 60 x 48 x 49, three forecast hours from a 12Z cycle at the
# source's own 3 h boundary cadence, history every 30 min.  The smallest
# configuration that still does the whole job: real bytes down, prepared,
# integrated and rendered by one command in under a minute.
#
#   source     gfs -- GFS 0.25 degree, public, no credentials
#   sized for  a 10 GiB card.  `gpuwm check configs/gfs_12km_quickstart.toml
#              --vram-gib 10 --budget-gib 8.75` prices the forecast at a
#              4.50 GiB peak envelope inside the 9.50 GiB budget, 5.00 GiB
#              spare, and PASSes alloc_estimate_le_vram_budget.
#   measured   2.29 GiB peak device memory held by the run; 0 m 59 s launch to
#              done for every stage together (fetch, prepare, forecast,
#              render), first plot at 0 m 17 s; 1344 product PNGs from 7
#              history frames.  RTX 5070 Ti 16 GiB, Linux, CUDA 13.
#
# Run it (the download the [fetch] table below describes happens inside):
#
#   gpuwm go configs/gfs_12km_quickstart.toml
#
# The cycle is the one these numbers were measured on.  For a current run move
# [experiment].start_time and [fetch].cycle together; NOMADS keeps about ten
# days, and `--cycle latest` on `gpuwm fetch` resolves the newest complete one.
#
# Emitted by `gpuwm domain` -- point 35.5,-97.5, ladder 12 km.
# PHYSICS: morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1: mp_physics 10, longwave RTE+RRTMGP, shortwave RTE+RRTMGP (radt 12 min), Kain-Fritsch cumulus, bl_pbl_physics 1, sf_surface_physics 2.
# Taken verbatim from gpuwm.physics_compat, so this file passes the prepared-
# forecast runner's profile guard as emitted.  Child dx/dt derive exactly from
# the parent chain and are never hand-typed (gpuwm/experiment.py).
# NOCTURNALLY VALID: longwave and shortwave both run, so the surface longwave
# budget stays closed through the night.

[experiment]
name = "area_35p50n_97p50w"
start_time = 2026-08-20T12:00:00
run_seconds = 10800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 35.5
ref_lon = -97.5
truelat1 = 25.5
truelat2 = 45.5
stand_lon = -97.5

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 60
ny = 48
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 1800.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror `gpuwm fetch` flags.
[fetch]
source = "gfs"
cycle = "2026-08-20T12"
hours = 3
area = "17.81,-116.67,53.13,-78.33"
out = "data/gfs-small"
cadence = 3
