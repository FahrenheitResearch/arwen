# Los Angeles Basin 750 m: the verified marine-layer configuration.
#
# Parent 2.25 km, 288 x 288 cells (648 km) over Southern California and the
# adjacent Pacific; 750 m nest, 216 x 186 cells (162 x 139.5 km) over the
# Los Angeles basin from Point Mugu to San Clemente, the San Fernando and
# San Gabriel valleys, the Inland Empire and the Soledad and Cajon passes,
# two-way (feedback 1). 59 levels to 50 hPa, Thompson microphysics (mp 8),
# MYNN surface layer and PBL, RUC land (6 soil levels), RTE-RRTMGP radiation every
# 10 min on the parent and 3 min on the nest, target CFL 1.4 (horizontal
# 0.98) and 5% step growth. The parent steps up to 13.5 s and the nest up
# to 4.5 s: 6 s per km of grid spacing on both grids, the 750 m city rule.
#
# High-resolution terrain (Copernicus GLO-30) comes from the template's
# engine settings, and the [fetch] table for the HRRR cycle is appended per
# run. start_time and run_seconds are rewritten for every run.

