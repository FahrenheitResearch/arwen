# Boston and the Charles River, 250 m.
#
# A 648 km parent at 2.25 km covers Massachusetts Bay and the Gulf of Maine.
# A 162 km nest at 750 m covers Greater Boston, Cape Ann and the South Shore.
# A 39 km square nest at 250 m covers the Charles from Watertown to the
# harbor, Logan and the inner harbor. All three share the basin center.
# The SF coastal-fog physics and vertical grid are unchanged. Both nests
# use high-resolution terrain and land cover from the engine settings.
# Parent and middle grid save hourly; the finest grid saves every 10 minutes.
# The HRRR fetch table, start time and run length are supplied per run.
# The finest adaptive clock caps steps at 5/3 s and keeps 12 sound substeps.

