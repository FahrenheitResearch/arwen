# New York City 750 m: the city base forecast at 750 m.
#
# Parent 2.25 km, 120 x 120 cells (270 km) from the Delaware Valley and the
# Jersey shore to the lower Hudson Valley and central Long Island; 750 m nest,
# 126 x 126 cells (94.5 km) over the metro footprint the 500 m nest had: the
# harbour and the five boroughs, Newark and the Watchung ridges, the Jersey shore
# to Sandy Hook, Westchester and Nassau, two-way (feedback 1), 3:1. 59 levels to
# 50 hPa. Thompson microphysics (mp 8), YSU PBL with the MM5 surface layer, Noah
# land (4 soil levels), RTE+RRTMGP radiation every 10 min on the parent and
# 3 min on the nest, no cumulus.
# Adaptive time step: target CFL 1.4 (horizontal 0.98), 5% growth per step on
# both grids, capped at 6 s per km of grid spacing: the parent starts at 10 s
# and steps up to 13.5 s, the nest starts at 10/3 s and steps up to 4.5 s.
#
# High-resolution terrain (Copernicus GLO-30) and land cover come from the
# template's engine settings, and the [fetch] table for the HRRR cycle is
# appended per run. start_time and run_seconds are rewritten for every run.
# The template id stays nyc-500m: it keys the scheduled runs, links and
# translations already published under it.

