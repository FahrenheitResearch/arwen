# Mexico City 750 m: a 48-hour GFS forecast over the Valley of Mexico.
#
# Parent 6.75 km, 172 x 168 cells (1,161 x 1,134 km) from the Gulf coast to the
# Pacific; 2.25 km nest, 198 x 192 cells (445.5 x 432 km) over the central
# plateau, Toluca, Puebla, Cuernavaca, Pachuca and the volcanoes; 750 m nest,
# 192 x 162 cells (144 x 121.5 km) over the Valley of Mexico and its mountain
# ring: Sierra de las Cruces, Ajusco and Chichinautzin, Popocatepetl,
# Iztaccihuatl, the Texcoco lake bed and the Toluca valley. One-way
# (feedback 0). 49 levels to 50 hPa. Physics as the 3 km template:
# Morrison microphysics (mp 10), Kain-Fritsch cumulus on the 6.75 km parent
# only, YSU PBL with the MM5 surface layer, Noah land (4 soil levels),
# RTE+RRTMGP radiation every 12 min on all grids.
# Fixed time step: 15 s on the parent, 5 s and 5/3 s on the nests (2.2 s per
# km), the engine's tropical clock (2.5 s per km under 25 degrees of latitude,
# trimmed to land the 5-min cumulus and 12-min radiation calls on exact steps).
# A fixed step cannot grow, so there is no adaptive growth to bound
# (max_step_increase_pct applies only to adaptive domains); the city ensemble
# keeps this fixed clock for its members. On the storm case the engine's
# per-step probe (the eta-form vertical Courant number its w-damping grades)
# peaked at 0.28, 0.19 and 0.10 by grid and never damped. The adaptive clock
# (5% growth, caps at 6 s per km) ran 40% faster on the same case; its 2.0 was
# the geometric hourly-snapshot measure, not the graded one, and it is not
# qualified with the probe, so this template stays on the fixed clock.
# Qualification: forecast-timing.json. The 10-day product stays the 3 km
# template (mexico-city-3km), which keeps running next to this one.
#
# Geometry and physics from `gpuwm domain --polygon <the valley and its
# mountain ring, 99.80-98.45 W, 18.85-19.90 N> --buffer-km 500,150,0
# --projection lambert --root-dx 6.75 --chain 3,3 --clock auto --source gfs
# --hours 48 --physics-profile morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1
# --cumulus grid` on 2.8.5, with restart files and the hourly maxima off and
# the light history output at the end of this file. The [fetch] table for the
# GFS cycle is appended per run; start_time and run_seconds are rewritten for
# every run.

[experiment]
name = "mexico-city-750m"
start_time = 2026-10-04T12:00:00
run_seconds = 172800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 19.375
ref_lon = -99.125
truelat1 = 15.0
truelat2 = 29.38
stand_lon = -99.125

[shared]
nz = 49
ztop = 20000.0
p_top = 5000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 0
bl_pbl_physics = 1
diff_6th_opt = 2
diff_6th_slopeopt = 1
epssm = 0.5
km_opt = 4
moist = true
moist_cq = true
morr_rimed_ice = 1
mp_physics = 10
num_soil_layers = 4
ra_lw_physics = 4
ra_physics = 0
ra_rrtmg_variant = "rte-rrtmgp"
ra_sw_physics = 4
sf_sfclay_physics = 91
sf_surface_physics = 2
sf_urban_physics = 0
terrain_opt = 1
top_lid = false
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
wsm6_hail_opt = 0
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 172
ny = 168
time_step = 15
time_step_fract_num = 0
time_step_fract_den = 1
dx = 6750.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 54
j_parent_start = 53
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 198
ny = 192
specified = false
nested = true
history_interval_s = 3600.0
epssm = 0.5
radt = 12.0
cu_physics = 0
diff_6th_factor = 0.1

[[domain]]
grid_id = 3
parent_id = 2
i_parent_start = 68
j_parent_start = 70
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 192
ny = 162
specified = false
nested = true
history_interval_s = 3600.0
epssm = 0.5
radt = 12.0
cu_physics = 0
diff_6th_factor = 0.08

# Light history output, the same on all three grids: what the six maps and the 3D viewer read, about half the bytes
# of the full set (d02 45.2 MB an hour against 87.1 MB, d01 59.2 against 114.2: the 12Z 29 Sep run's frames cut
# to this list). The engine always keeps its structural fields (Times, XTIME, ITIMESTEP, XLAT, XLONG, HGT, ZNU, ZNW,
# P_TOP, MUB, PHB and T). The list is every 2-D field of the engine's own "minimal" preset (surface state,
# fluxes, accumulators and grid metadata) and nine volumes: the winds U, V and W, geopotential PH, pressure P
# and PB, water vapour, cloud water and REFL_10CM. Left out: the rain, ice, snow and graupel mixing ratios and
# number concentrations, the radiative heating rates and the soil columns, which no map or 3D layer reads.
[output]
history_vars = [
    "COSALPHA", "E", "F", "GLW", "GRAUPELNC", "GRDFLX", "HAILNC", "HFX", "ISLTYP", "IVGTYP", "LANDMASK",
    "LH", "LU_INDEX", "MAPFAC_M", "MAPFAC_U", "MAPFAC_V", "MU", "OLR", "PBLH", "PSFC", "PSIH", "PSIM", "Q2",
    "QFX", "RAINC", "RAINNC", "RAINSH", "SEAICE", "SINALPHA", "SNOW", "SNOWC", "SNOWH", "SNOWNC", "SWDOWN",
    "T2", "TH2", "TMN", "TSK", "U10", "UP_HELI_MAX", "UST", "V10", "VEGFRA", "XLAT_U", "XLAT_V", "XLONG_U",
    "XLONG_V",
    "U", "V", "W", "PH", "P", "PB", "QVAPOR", "QCLOUD", "REFL_10CM",
]
