# San Francisco Bay 250 m: the verified coastal-fog configuration, a
# 2.25 km / 750 m / 250 m tree whose finest grid is 250 m. The slug keeps
# "750m" because the forecast host, the schedule, stored runs and template
# files are keyed by it.
#
# Parent 2.25 km, 288 x 288 cells (648 km) over Northern California and the
# adjacent Pacific; 750 m nest, 216 x 216 cells (162 km) over the Bay Area;
# 250 m nest, 144 x 240 cells (36 x 60 km) from just south of Half Moon Bay
# to Mill Valley and from the ocean off the Golden Gate to Oakland and
# Berkeley; all two-way (feedback 1). 59 levels to 50 hPa. Thompson microphysics (mp 8),
# MYNN surface layer and PBL, Noah land (4 soil levels) on Annual NLCD land cover
# with no urban canopy, RTE-RRTMGP
# radiation every 10 min on the parent and 3 min on the nest.
# Adaptive time step: target CFL 1.4 (horizontal 0.98); the parent steps up
# to 13.5 s, the 750 m nest up to 4.5 s and the 250 m nest up to 3/2 s: caps
# of 6 s per km of grid spacing on every grid, the city rule (at 30 / 10 / 10/3 s
# every grid ran at 13.3 s per km), each grid at 5% step growth and a 3:1
# ratio. Measured (forecast-timing.json): the parent sits on its cap, but both
# nests run at a quarter and a twelfth of the parent's step, 4.4 s per km
# (3.37 s and 1.12 s): a nest that falls to four steps per parent step never
# returns to three under 5% growth. Radiation every 3 min on both nests.
#
# High-resolution terrain (Copernicus GLO-30), Annual NLCD land cover and
# SoilGrids soils come from the template's
# engine settings, and the [fetch] table for the HRRR cycle is appended per
# run. start_time and run_seconds are rewritten for every run.

