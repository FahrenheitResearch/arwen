[package]
name = "rustwx-io"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []

[dependencies]
bincode = "1.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
grib-core = { path = "../../vendor/grib-core" }
hdf5-reader = "0.3"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustwx-core = { path = "../rustwx-core" }
rustwx-models = { path = "../rustwx-models" }
# The version is pinned beside the path deliberately: a governorless
# wx-core 0.3.9 is also vendored (vendor/crates-io), and a bare path
# dependency would accept it silently if resolution ever changed.
wx-core = { path = "../../vendor/wx-core", version = "0.3.10", default-features = false, features = ["network"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
