# The MPAS crate: mesh generation, initial conditions, history conversion.
#
# `build.rs` injects GPUWM_BRIDGE_SOURCE_REV so every binary here embeds
# the commit it was built from.  The gpuwm release cut reads that stamp
# out of the staged bytes -- never by executing them, because it inspects
# both platforms' bundles from one machine -- and refuses a bundle whose
# binaries cannot prove they came from the commit being released.  Without
# it, `rw_mpas_mesh`, `rw_mpas_init` and `rw_mpas_convert` could be staged
# and pinned perfectly while being last month's build.
[package]
name = "rw-mpas"
version = "0.1.0"
build = "build.rs"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Formerly gated the composition and raw-word proof binaries. They are tools
# of rw_mpas_static now and always built; the name stays so recorded proof
# recipes that pass `--features native-init-composition-test` still resolve.
native-init-composition-test = []
# Optional lossless render-frame storage; ordinary bridge builds stay classic.
render-netcdf4 = []
# The hex tools rw_mpas_physics_pool and rw_mpas_stream link the system netCDF
# C library, which the public CI runners do not carry; they build only with this.
system-netcdf = []

[dependencies]
netcrust = { path = "../../vendor/netcrust" }
netcdf-reader = { path = "../../vendor/netcrust/vendor/netcdf-reader" }
rayon.workspace = true
rw-host-memory = { path = "../rw-host-memory" }
rw-store = { path = "../rw-store" }
static-fields = { path = "../static-fields" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
# rw_mpas_static's stream comparator reads through the netCDF C library,
# loaded at run time so no build or shipped binary needs it to link or start.
libloading = "0.9"
# Window coordinates and the nearest-cell map: pure IEEE `libm` (the same
# vendored 0.2.16 static-fields pins), so they are the same bits on every
# x86-64 CPU and C library. See the note at the top of src/window.rs.
libm = { version = "0.2.16", default-features = false, features = ["force-soft-floats"] }
thiserror.workspace = true

[[bin]]
name = "cpas_bench_probe"
path = "src/bin/cpas_bench_probe.rs"

[[bin]]
name = "rw_mpas_convert"
path = "src/bin/rw_mpas_convert.rs"

[[bin]]
name = "rw_mpas_init"
path = "src/bin/rw_mpas_init.rs"

[[bin]]
name = "rw_mpas_geometry"
path = "src/bin/rw_mpas_geometry.rs"

[[bin]]
name = "rw_mpas_hostprep"
path = "src/bin/rw_mpas_hostprep.rs"

[[bin]]
name = "rw_mpas_lbc"
path = "src/bin/rw_mpas_lbc.rs"

[[bin]]
name = "rw_mpas_mesh"
path = "src/bin/rw_mpas_mesh.rs"

# The writer the mesh registry pins, and the one `gpuwm mesh` runs. It is
# also five more tools that used to be binaries of their own: `bounded`
# (rw_mpas_static_bounded), `words` (rw_mpas_static_words), `gwd-replace`
# (rw_mpas_gwd_replace), `gwd-review` (rw_mpas_gwd_review) and `verify`
# (rw_mpas_verify), reached as subcommands or by invoking this binary under
# the old name. One copy of the shared code in each platform wheel instead
# of six; see src/bin/rw_mpas_static/main.rs.
[[bin]]
name = "rw_mpas_static"
path = "src/bin/rw_mpas_static/main.rs"

[[bin]]
name = "rw_mpas_stream"
path = "src/bin/rw_mpas_stream.rs"
required-features = ["system-netcdf"]

[[bin]]
name = "rw_mpas_physics_pool"
path = "src/bin/rw_mpas_physics_pool.rs"
required-features = ["system-netcdf"]
