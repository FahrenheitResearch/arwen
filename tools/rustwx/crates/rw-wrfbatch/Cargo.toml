# Headless wrfout import + Rusty Weather production batch render.
#
# main.rs is the source workspace's untracked rw_wrf_batch bin adapted
# for gpuwm (all stored frames by default, --frames selection, request-
# sized work limits); the five processing modules beside it are verbatim
# copies of rusty-weather-ui's hardened WRF modules (see ../../VENDOR.md).
# This crate exists so the batch path builds WITHOUT the egui UI stack
# the source bin inherited from its host package.

[package]
name = "rw-wrfbatch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "rw_wrfbatch"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
grib-core = { path = "../../vendor/grib-core", default-features = false }
netcrust = { path = "../../vendor/netcrust" }
rayon.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
wrf-core = { git = "https://github.com/FahrenheitResearch/wrf-rust.git", rev = "93bd2ca670c13fec35bcfc27a58108e6fd71c627", package = "wrf-core", default-features = false, features = ["pure-rust-reader"] }
rustwx-core = { path = "../rustwx-core" }
rustwx-models = { path = "../rustwx-models" }
rustwx-products = { path = "../rustwx-products" }
rusty-weather = { path = "../rusty-weather" }
rw-ingest = { path = "../rw-ingest" }
rw-store = { path = "../rw-store" }
