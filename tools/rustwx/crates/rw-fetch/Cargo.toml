# ArWen's fetch backbone: a thin CLI over the download stack already
# vendored at ../../vendor/wx-core (parallel whole-file range GETs, .idx
# coalescing, the cross-process NOMADS rate governor, the disk cache)
# plus the rustwx-models URL algebra for 23 models.  Every dependency
# already exists in this workspace's `cargo vendor` closure, so the bin
# builds with --locked --offline like every other vendored artifact.

[package]
name = "rw-fetch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "rw_fetch"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = { version = "0.39", features = ["serialize"] }
# Static archives and compressed tables decode in process: the host's
# pzstd, bzip2 and gzip are not on a stock Windows PATH. All three crates
# are already in this workspace's vendored closure, at the versions and
# backends rw-store, wx-radar and rustwx-io use.
zstd = "0.13"
bzip2 = "0.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustwx-core = { path = "../rustwx-core" }
rustwx-models = { path = "../rustwx-models" }
# The version is pinned beside the path deliberately: a governorless
# wx-core 0.3.9 is also vendored (vendor/crates-io), and a bare path
# dependency would accept it silently if resolution ever changed.
wx-core = { path = "../../vendor/wx-core", version = "0.3.10", default-features = false, features = ["network"] }
