## gpuwm vendored Rusty Weather renderer workspace.
##
## The crates under crates/ and vendor/ are a verbatim subset of the project's
## rusty-weather workspace (MIT, LICENSE in this directory), vendored at
## the exact working-tree state that produced the campaign renderer
## binary (rw_wrf_batch.exe sha256 aa220a5a...); provenance and the two
## deliberate divergences are documented in VENDOR.md.  The one new
## crate is crates/rw-wrfbatch, the headless wrfout -> product-PNG
## batch renderer `gpuwm render --engine rust` drives.

[workspace]
members = [
    "crates/netcdf-writer",
    "crates/obs-regrid",
    "crates/obs-score",
    "crates/rustwx-calc",
    "crates/rustwx-contour",
    "crates/rustwx-core",
    "crates/rustwx-cross-section",
    "crates/rustwx-ensemble",
    "crates/rustwx-io",
    "crates/rustwx-models",
    "crates/rustwx-products",
    "crates/rustwx-render",
    "crates/rusty-weather",
    "crates/rw-atms",
    "crates/rw-fetch",
    "crates/rw-fieldcmp",
    "crates/rw-host-memory",
    "crates/rw-ingest",
    "crates/rw-isobaric",
    "crates/rw-libm",
    "crates/rw-mpas",
    "crates/rw-mlexport",
    "crates/rw-post",
    "crates/rw-netcdf",
    "crates/rw-nexrad",
    "crates/rw-odim",
    "crates/rw-post",
    "crates/rw-obs",
    "crates/rw-post",
    "crates/rw-sat",
    "crates/rw-simradar",
    "crates/rw-goes",
    "crates/rw-grib2export",
    "crates/rw-store",
    "crates/rw-superob",
    "crates/rw-wrfbatch",
    "crates/static-fields",
]
## `vendor/grib-core` is deliberately absent from both lists: the GRIB
## decoder is ONE crate for the whole tree, and it lives at
## `tools/grib1_bridge/vendor/grib-core`, which is where its VENDOR.md
## delta discipline (per-file SHA-256, Rust 1.75 spellings) already
## lives.  This workspace reaches it by path.  Two copies is what the
## tree had before, and the copy that lived here was the one WITHOUT
## `missing_value_management`, so every renderer and ingest read of a
## complex-packed message decoded the encoder's missing-value markers as
## physical data.  Do not re-vendor a second copy here.
exclude = [
    "vendor/bowecho",
    "vendor/recast-radar-tools",
    "vendor/ecape-rs",
    "vendor/metrust",
    "vendor/netcrust",
    "vendor/netcrust/vendor/hdf5-reader",
    "vendor/netcrust/vendor/netcdf-reader",
    "vendor/wx-core",
    "vendor/wx-field",
    "vendor/wx-math",
    "vendor/wx-radar",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
rayon = "1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

# Direct registry dependencies use the same readers as netcrust's path
# dependencies. The facade itself does not require a workspace patch.
[patch.crates-io]
hdf5-reader = { path = "vendor/netcrust/vendor/hdf5-reader" }
netcdf-reader = { path = "vendor/netcrust/vendor/netcdf-reader" }

[profile.release]
lto = "thin"
codegen-units = 1
# The bundled binaries are package data in a platform wheel, and the
# manylinux wheel is measured against PyPI's 100,000,000-byte per-file
# limit.  The whole static symbol table goes, not only the debug info:
# on Linux both live inside the ELF.  Under MSVC they live in the side
# .pdb either way (a probe crate built with rustc 1.94.0 gave an .exe of
# the same size and a .pdb for both settings), so the Windows binaries
# do not change.  Keeping .symtab after dropping the debug info cost
# 5,084,832 B compressed across the 42 Linux bridges in the 2.8.7
# manylinux wheel (74,526,220 -> 69,441,388 B, measured on
# weather-node-4 on 2026-10-07).  Nothing that proves an artifact reads
# .symtab: the
# source-revision stamp (`GPUWM_BRIDGE_SOURCE_REV=`) and the contract
# markers are string constants in .rodata, the executables' ABI probes
# run the binary and read its answer, and the library ABI probe and the
# manylinux qualification (`readelf --dyn-syms`) resolve EXPORTED
# symbols, which live in .dynsym and survive a symbol strip.
strip = "symbols"
