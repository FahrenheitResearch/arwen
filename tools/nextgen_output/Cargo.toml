[package]
name = "rw-nextgen-output"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust output boundaries for NOAA NextGen"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rw_nextgen_output"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
parquet = { version = "=56.2.0", default-features = false, features = ["snap"] }
bytes = "1"
netcdf-writer = { path = "../rustwx/crates/netcdf-writer" }
netcdf-reader = { path = "../rustwx/vendor/netcrust/vendor/netcdf-reader" }

[profile.release]
lto = "thin"
strip = "symbols"
