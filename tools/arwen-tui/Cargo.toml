[package]
name = "arwen-tui"
version = "2.7.0"
edition = "2021"
rust-version = "1.94"
license-file = "../../LICENSE"
description = "Terminal workspace for configuring and running ArWen forecasts"

[dependencies]
ratatui = { version = "=0.29.0", features = ["unstable-rendered-line-info"] }
crossterm = "=0.28.1"
toml_edit = "=0.22.27"
serde_json = "1.0"
sha2 = "=0.10.9"
unicode-width = "0.2"
unicode-segmentation = "=1.13.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
