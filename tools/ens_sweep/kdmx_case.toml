# Emitted by `gpuwm domain` -- point 41.73,-93.96, ladder 3 km.
# PHYSICS: thompson-mp8-ysu-mm5-noah-rrtmg-legacy-v1: mp_physics 8, WRF v4.6.1's bundled legacy RRTMG on BOTH streams (radt 12 min), NO cumulus parameterization, bl_pbl_physics 1, sf_surface_physics 2.
# RE-SPECIFIED 2026-08-09.  This case was emitted with
# wsm6-ysu-mm5-noah-no-radiation-v1 -- longwave OFF, Dudhia shortwave -- over a
# 04Z + 6 h window at 41.73 N that has NO DAYLIGHT IN IT AT ALL (the sun is
# below the horizon at every 15-minute sample).  So the shortwave half never
# fired, no scheme computed the downward longwave, and the ensemble's land
# surface ran the whole sweep against the initialize_physics seed: 300.0 W/m2
# of sky that nothing produced.  This is live sweep tooling, not a campaign
# record, so it is fixed rather than annotated.  Runs made under the old
# profile are not comparable to runs made under this one -- the named
# profile also pins moist_cq true (was false) and diff_6th_factor 0.12 (was
# 0.08), because a config that NAMES a profile must match it switch for
# switch or the prepared runner's guard refuses it.
# Taken verbatim from gpuwm.physics_compat, so this file passes the prepared-
# forecast runner's profile guard as emitted.  Child dx/dt derive exactly from
# the parent chain and are never hand-typed (gpuwm/experiment.py).

[experiment]
name = "ens_sweep_case"
start_time = 2026-08-05T04:00:00
run_seconds = 21600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# No acknowledgements.  This window is 04Z-10Z over central Iowa, which is
# 23:00-05:00 local: the run is night from end to end.  Through 1.8.7 it ran
# the wsm6 no-radiation profile with ``asymmetric-radiation-nocturnal-
# window-v1`` declared, so every member of every sweep spent all six hours
# with Noah reading a fixed 300 W m-2 downward longwave.  An ensemble whose
# members share one fabricated surface energy budget is not measuring
# spread, so the physics moved to a nocturnally valid shipped profile
# instead of the declaration being renewed.

[projection]
map_proj = "lambert"
ref_lat = 41.73
ref_lon = -93.96
