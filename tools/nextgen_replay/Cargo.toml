[package]
name = "nextgen-replay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Offline sealed raw-word verification and host staging for NextGen GPU modules"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
