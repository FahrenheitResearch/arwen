[package]
name = "netcrust-compat"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Compatibility entry point for the shared pure-Rust NetCDF reader"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FahrenheitResearch/netcrust"
keywords = ["netcdf", "hdf5", "wrf", "weather", "meteorology"]
categories = ["science", "parser-implementations"]

[lib]
name = "netcrust"

[dependencies]
netcrust_shared = { package = "netcrust", path = "../../../rustwx/vendor/netcrust" }
