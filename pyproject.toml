[build-system]
# >=77 is the PEP 639 floor: it is what turns the `license` SPDX
# expression below into a License-Expression metadata field.  Older
# setuptools would either reject the string or ship it as a bare
# License field, and the whole point is `pip show gpuwm` answering
# "Apache-2.0" instead of dumping the license text.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuwm"
version = "2.6.2"
description = "Native WRF preprocessing and GPU-native limited-area weather modeling"
readme = "README.md"
# The SPDX expression (PEP 639), not `{ file = "LICENSE" }`: the file
# form pasted all 202 lines of Apache-2.0 into the METADATA License
# field, which is what `pip show gpuwm` prints.  The license text
# itself still ships in the wheel via `license-files` below.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# numpy>=2 is load-bearing: the legacy-RRTMG FP32 max_ulp-0 discipline
# relies on NEP-50 weak promotion (float32 op python-scalar stays
# float32); numpy 1.26 would silently widen those chains to float64.
# The rrtmg modules also guard this at import time.
# jsonschema: every forecast route validates its certification capsule
# against gpuwm/certify/capsule_v1.schema.json at emission (found live:
# a pip install without it ran a whole forecast, then hit the import at
# capsule time -- emission is non-fatal now, but the dependency is real).
#
# rasterio/pyproj are NOT here, and the reason is the whole point: the
# high-resolution warp substrate -- GeoTIFF decode, CRS construction,
# the mosaic and void fill, the reprojection onto the WPS spherical grid
# and the area average -- runs in the Rust `static-fields` library on
# the bare default of `[static.highres] enabled = true`.  That library
# is a BUNDLED ARTIFACT (gpuwm.bridge_assets.BUNDLED_ARTIFACTS), staged
# into a wheel install exactly as the NetCDF writer is, so a bare `pip
# install gpuwm` builds high-resolution terrain with neither library
# present.  They moved to the [geog] extra, whose comment below records
# what they are FOR now.
#
# This is not a return to 2.3.2, and the difference is the one that
# matters.  Through 2.3.2 they were an extra nobody named while being
# the ONLY engine, so following HIGHRES-TERRAIN.md on a documented
# install downloaded 160.7 MiB of Copernicus tiles and then died on the
# import: a headline feature nobody could reach.  They became runtime
# dependencies in 2.3.3 to fix exactly that.  What changed is not the
# rule but the fact underneath it -- the feature no longer reads them --
# and a dependency the shipped configuration never imports is not a
# reachability guarantee, it is 118.8 MiB of GDAL stack.  The
# reachability contract is now enforced where the engine actually is:
# tests/test_static_highres_warp_routing.py makes rasterio, pyproj and
# affine unimportable and requires every default high-resolution call to
# still produce its answer.
#
# scipy and pyshp stayed on the reasoning rasterio and pyproj arrived on,
# for two more capabilities that were shipped-but-unreachable:
#
#   scipy.  Two capabilities, and the weaker of the two arguments is the
#   one about dealiasing, so it is stated exactly: gpuwm/obs/dealias.py's
#   `vad-region` engine labels its gate regions with
#   scipy.sparse.csgraph.connected_components.  Since 2026-08-12 the
#   DEFAULT engine is `region-global`, the Rust crate, so scipy is not
#   what the default dealias run reads -- but `vad-region` is a
#   selectable, supported, documented engine that every run before that
#   date used, and without scipy it is not selectable at all.
#
#   The second was gpuwm/verify/obs/regrid.py, and that claim is DEAD.
#   It used to read "every remap plan the observation battery builds
#   goes through scipy.spatial.cKDTree, with no second engine and no
#   fallback".  Since the obs-regrid port both halves of that module --
#   the plan build and the apply -- run on
#   tools/rustwx/crates/obs-regrid by DEFAULT, proven bit-identical to
#   the scipy path on real staged observation and model grids.  scipy is
#   now the announced fallback (GPUWM_OBSREGRID_PYTHON=1), which is a
#   reported workaround, so the battery still needs the package
#   installed and this dependency stays -- but nothing on a bare default
#   path reads it.
#
#   Both sat behind an [obs]/[dealias] pair that `pip install
#   'gpuwm[all-cu12]'` -- the README's own recommended line -- did not
#   pull, and that no quickstart named.
#
#   This block used to argue that the mandate did not bind either use,
#   on the reading that Rust-or-CUDA-only is "a rule about READING and
#   DECODING data".  That reading was WRONG and was never a Drew ruling:
#   his 2026-08-16 wording is "GRIB decode, NetCDF read/write,
#   regrid/transform, dealiasing, rendering", and the two operations the
#   argument exempted are the two the law names beyond decode --
#   "regrid/transform" is gpuwm/verify/obs/regrid.py's k-d tree and
#   "dealiasing" is gpuwm/obs/dealias.py's connected-components pass.
#   The k-d tree half is settled: it is Rust by DEFAULT now.  The
#   dealiasing half is `vad-region`, which is not the default engine,
#   and it is open porting work.  This table says who SHIPS a library;
#   it does not get to say which laws reach it.  Neither use is an
#   exception, and this file has no authority to declare one -- only
#   Drew does.  Open work is recorded where open work belongs and not
#   in a dependency comment.
#
#   Cost, measured on cp313/win_amd64: 36.6 MiB of wheel.  Platform reach
#   is unchanged -- scipy's wheel matrix is a superset of numpy's, which
#   has been a hard dependency here since the first release.
#
#   pyshp.  The basemap reader.  tools/da_nowcast_render.py, the
#   launcher's basemap endpoint and tilestream/realcase_render.py read
#   the vendored Natural Earth shapefiles with a bare `import shapefile`
#   -- no try/except, no front-door check -- at the very END of the DA
#   nowcast chain, after survey, fetch, prepare, forecast and every DA
#   cycle.  It was in [render], which is the wrong home twice over: the
#   DEFAULT render engine is the rust one, which needs nothing from
#   [render] at all (measured: 161 PNGs from a bare install with staged
#   bridges), so the install that draws maps was not the install
#   carrying the shapefile reader.  73.7 kB of pure Python with no
#   dependencies of its own; there is no case for making anyone choose.
#
# gpuwm-data: the companion distribution carrying the RRTMGP k-distribution
# NetCDFs and the Thompson microphysics lookup tables, pinned `==` to this
# exact version.  It is a HARD dependency and never an extra, for the same
# reason rasterio and scipy above stopped being extras: a bare `pip install
# gpuwm` that cannot run radiation is not an install, and an extra nobody
# names is a headline feature nobody can reach.
#
# It exists because of a channel limit, not a design preference.  PyPI
# rejects any file over 100 MiB; the 2.5.0 wheel measured 103.62 MiB with
# the Rust bridges staged, and those two directories were 64.21 MiB of it.
# Splitting them leaves gpuwm at 39.41 MiB and gpuwm-data at 64.31 MiB.
# The companion is pure data -- py3-none-any, one file for every platform.
#
# The `==` is not caution, it is the contract: the tables are versioned
# data read by versioned physics, so a `>=` would let pip pair 2.5.0's
# radiation with another release's k-distribution and produce numbers
# instead of an error.  gpuwm.data_assets refuses a mismatch by name at
# runtime as well, because pip is not the only thing that edits a venv.
# The literal is restated here rather than computed because
# `[project].version` must stay a static string (gpuwm.provenance reads it
# straight out of this file for the code-version receipt);
# tests/test_companion_distribution.py fails if the two ever disagree.
dependencies = ["numpy>=2.0", "netCDF4>=1.6", "matplotlib>=3.8",
                "jsonschema>=4.0",
                "scipy>=1.11", "pyshp>=2.3", "gpuwm-data==2.6.2"]
keywords = ["WRF", "WPS", "GRIB", "NetCDF", "weather", "CUDA"]
# No `License ::` classifier: PEP 639 deprecates them outright and
# setuptools >=77 refuses to combine one with the SPDX expression above.

[project.urls]
Homepage = "https://github.com/FahrenheitResearch/arwen"
Repository = "https://github.com/FahrenheitResearch/arwen"
Changelog = "https://github.com/FahrenheitResearch/arwen/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# CuPy ships ONE wheel per CUDA major, and the wheel must match the CUDA
# major the box actually serves: cupy-cuda12x on a CUDA-13-only box
# imports cleanly, compiles kernels, and then dies at the first cuBLAS
# load (proven on a rented CUDA 13.2 node, 2026-08-05).
#
# A pip extra CANNOT detect a CUDA major -- there is no environment
# marker for it -- so this table does not pretend to choose.  The choice
# is NAMED, one extra per major:
#
#     CUDA 12.x box .......... gpuwm[gpu-cu12]   (or gpuwm[all-cu12])
#     CUDA-13-only box ....... gpuwm[gpu-cu13]   (or gpuwm[all-cu13])
#
# [gpu] and [all] are kept and still resolve to cu12, because every
# install that already works names them and a silently-changed default
# would break those boxes.  They are ALIASES for the cu12 pair, not a
# third policy: there is exactly one place each wheel is pinned.
#
# The honest-intent rule this table cannot enforce by itself is enforced
# by `gpuwm doctor`, which reads the box's CUDA major straight off the
# driver -- with or without CuPy installed -- and prints the extra that
# matches it rather than a cu12 default.
#
# `[ctk]`: THE CUDA TOOLKIT, WHICH THE WHEEL ALONE DOES NOT CARRY.
#
# A CuPy wheel ships NVRTC -- the compiler -- and no CUDA headers, and
# CuPy's own kernels include the CUDA runtime headers.  So on a box with
# a driver and no toolkit (every stock Ubuntu with the NVIDIA driver
# from the archive; every fresh rental) the wheel installs, `import
# cupy` succeeds, and the FIRST device call of any kind dies.  MEASURED
# on weather-node-1 (CUDA 13 driver, no nvcc, no /usr/local/cuda, no
# conda), 2026-08-17:
#
#   pip install cupy-cuda13x          274 MiB venv; cuBLAS, a
#                                     self-contained RawModule and a
#                                     cupy reduction ALL fail with
#                                     "Failed to find CUDA headers"
#   pip install 'cupy-cuda13x[ctk]'   1867 MiB venv; all three ok
#
# The delta is ~1.6 GiB and it buys the difference between a GPU box
# that runs and one that cannot execute a single kernel, so the extras
# carry it.  "Fixed" means a bare default run stops showing the defect,
# and the bare default run here is the quickstart's own pip line; an
# opt-in second command would have been a workaround, and the workaround
# is what 2.4.1 already had (`gpuwm doctor` printing an install line).
#
# A box that ALREADY has a matching system toolkit does not need these
# wheels, and can skip them with
#
#     pip install gpuwm && pip install cupy-cuda13x    # or cupy-cuda12x
#
# which is documented in docs/install.md.  It is the smaller install,
# not the safer one: CuPy resolves the wheels ahead of a system toolkit,
# so the [ctk] set is also the self-consistent one.
#
# The floor moves to 14.0 BECAUSE of `[ctk]`: CuPy added that extra in
# 14.0, and pip only WARNS when a resolved version does not provide a
# requested extra.  Kept at >=13.0/>=13.6, a box already holding CuPy
# 13.x would resolve, print a warning nobody reads, install no toolkit,
# and sit in exactly the broken state this line closes.
gpu-cu12 = ["cupy-cuda12x[ctk]>=14.0"]
gpu-cu13 = ["cupy-cuda13x[ctk]>=14.0"]
gpu = ["gpuwm[gpu-cu12]"]
# gpuwm render's mandated science core: derived quantities come from the
# wrf package (pip distribution wrf-rust).  A RANGE, not an exact pin:
# `==0.2.35` made `pip install gpuwm[render]` DOWNGRADE a user who already
# ran a newer wrf-rust (field report: 0.2.38 -> 0.2.35), which is a
# hostile thing to do to the co-developed core on someone else's box.
# <0.3 is the ceiling because that is where upstream is free to change
# the diagnostic surface.  The same window is written once in
# gpuwm/science_core.py and enforced at runtime from there, alongside
# SCIENCE_CORE_CERTIFIED -- the release 2.5.0's suites actually run on
# (0.2.39, installed from the index as a plain wheel).
# This extra is ONLY that window now.  pyshp moved into the runtime
# dependencies above: see the note there for why the shapefile reader had
# no business riding along with a science core the default render engine
# does not even use.
#
# WHY THE FLOOR IS 0.2.39, and why there is no environment marker on this
# line.  MEASURED on weather-node-1 (python3.14.4), 2026-08-17: wrf-rust
# 0.2.38 published no cp314 wheel, so pip fell back to the sdist, and
# the sdist did not build --
#
#   error: failed to run custom build command for `pyo3-ffi v0.23.5`
#   error: the configured Python interpreter version (3.14) is newer than
#          PyO3's maximum supported version (3.13)
#
# -- and pip fails a WHOLE resolution when one requirement fails.  So on
# a 3.14 box `pip install 'gpuwm[gpu-cu13,render]'`, which is the line
# install.sh itself runs, installed no gpuwm at all: fetch, prep, the
# CUDA runtime and the rust renderer all died for the one package none of
# them use.
#
# Upstream closed it the same day: 0.2.39 publishes cp310-cp314 wheels on
# all five platforms (macOS x86_64/arm64, manylinux x86_64/aarch64,
# win_amd64) -- 26 artifacts, MEASURED off the index.  So the remedy is
# the floor, not a marker: 0.2.39 is the oldest release with a wheel for
# every interpreter gpuwm supports, and every supported interpreter gets
# the real package instead of a skip.  A marker left here after the
# wheels landed would be the same defect pointed the other way -- pip
# silently skipping a package that installs perfectly, on a box whose
# install line said it was covered.
#
# The RUNTIME floor stays at 0.2.35 (SCIENCE_CORE_FLOOR): a 0.2.38
# already installed on a 3.13 box renders every product it ever did, and
# a refusal that cannot name what it prevents does not get to exist.
render = ["wrf-rust>=0.2.39,<0.3"]
# The PARITY FALLBACK for the high-resolution warp, and nothing else.
#
# What this extra is NOT: the way to get high-resolution terrain.  That
# runs on the Rust `static-fields` library, on the bare default, from a
# bare `pip install gpuwm` -- the library is a bundled artifact and
# `gpuwm doctor` reports it as the `static builder` row.  Installing
# this changes no default and unlocks no product.
#
# What it IS: the two libraries `GPUWM_STATIC_PYTHON=1` runs on.  That
# switch is the explicit workaround the fixed-means-default law requires
# a correctness remedy to carry -- it prints a WORKAROUND line, stamps
# `static_compute` on the receipt, and exists so a divergence can be
# bisected against the reference implementation the crate's goldens were
# extracted from.  Deliberately outside [all]: a forecast user needs the
# default, not the reference, and 118.8 MiB of GDAL stack does not
# belong in the recommended one-liner for a debugging aid.
#
# The name is unchanged on purpose.  `pip install gpuwm[geog]` is
# written down in the wild -- in 2.3.2's own docs, in shell history, in
# other people's scripts -- and pip fails an install naming an extra
# that does not exist.  Same discipline as the [gpu]/[all] aliases
# below: never invalidate an install line that already works.
geog = ["rasterio>=1.3", "pyproj>=3.6"]
# RETAINED AND EMPTY ON PURPOSE.  [geog] above kept its NAME for the same
# reason and then got contents back; these two kept the name and have
# nothing left to put in it.  scipy moved into the runtime dependencies,
# so neither of these has anything to add: `pip install gpuwm` now scores
# against observations and dealiases velocity.  They are kept because
# both spellings are written down --
# 2.3.3's own docs/install.md extras table names them, and until this
# release two code remedies told readers to run them -- and pip fails an
# install naming an extra that does not exist.  Never invalidate an
# install line that already works.
obs = []
dealias = []
# psutil: tests/test_prepare_hrrr_wrf.py's Windows arm walks the process
# ancestry to find the cmd.exe shim that owns a decoder worker, and a
# fresh venv running the union battery breaks on the bare import.  It is
# a test-time need only -- no gpuwm/ or tools/ module imports it -- so
# it lives here beside pytest rather than in the runtime dependencies.
# The two previously-audited undeclared imports of the same class are
# already declared where their features live: pyshp (task #65) in
# [render] and scipy (task #78) in [obs]/[dealias].
dev = ["pytest>=8.0", "psutil>=5.9"]
# Maintainer-only, and both entries are the same shape: a tool that
# REGENERATES something the wheel ships, reachable by nobody else.
#
# `python -m tools.publish_geog_mirror upload` pushes the WPS_GEOG mirror
# snapshot to Hugging Face.  It needs write credentials on a dataset
# repository nobody but the maintainers owns -- but huggingface_hub was
# declared in NO table at all, which is the same third state pyshp and
# scipy were in.
#
# `python -m tools.harvest_radar_heights` reads `/where/height` out of one
# European polar volume per radar to fill the antenna heights in
# `gpuwm/obs/data/radar_sites_odim.json`, which the wheel ships frozen.  A
# user reads that table; only a maintainer rebuilds it, and rebuilding it
# means opening HDF5 from Python.  Nothing on a user path does: the product
# decodes ODIM through `rw_odim`, which carries its own pure-Rust reader,
# so h5py is a build-the-table dependency and not a read-the-table one.
#
# Deliberately outside [all]: an extra nobody can use should not be in the
# one-liner.
publish = ["huggingface_hub>=0.23", "h5py>=3.10"]
# The two extras a person running a forecast on their own card needs,
# under one name, so the quickstart is one pip line instead of a choice
# between two that most readers want both of.  It does not name geog,
# and the reason is a fact about what geog now contains rather than a
# judgement about terrain: [geog] is the pure-Python PARITY FALLBACK for
# the high-resolution warp, and the warp itself runs on the Rust
# static-fields library that a bare install already stages.  So [all]
# carries high-resolution terrain the same way a bare install does --
# by carrying the engine -- and adding [geog] would add 118.8 MiB of
# GDAL stack that changes no default and unlocks no product.
#
# That is NOT the 2.3.2 reasoning wearing a new hat.  Through 2.3.2 this
# line read "deliberately NOT geog" while those libraries were the ONLY
# engine, which was sound about the JOB (authoring tiles is not running
# the model) and wrong about the consequence: it left the documented
# terrain path unreachable from every install line the project
# publishes.  The test that catches a repeat is not this comment; it is
# tests/test_static_highres_warp_routing.py, which makes rasterio,
# pyproj and affine unimportable and requires the default terrain build
# to still produce its answer.
#
# obs and dealias are absent for a different reason again: they are
# empty.  The 2.3.2 audit's H14 -- "pip install 'gpuwm[all-cu12]'
# silently ships without velocity dealiasing" -- is closed by scipy
# being a base dependency, NOT by aggregating a name here.  Aggregation
# would have been the bandaid: [all] would have been right and a bare
# `pip install gpuwm` would still have been missing the default dealias
# engine.
#
# The invariant, rather than the enumeration, is what is enforced:
# tests/test_dependency_declaration_parity.py fails if any extra that is
# NOT dev, publish, a CUDA-major alternative, or recorded as excused
# ever holds a requirement [all-cu12]/[all-cu13] does not.
#
# One [all-*] per CUDA major for the same reason [gpu-*] is split: the
# quickstart's one-liner is the single most-followed instruction in the
# project, so it must be able to reach the cu13 wheel.  Before this pair
# existed, [all] was the ONLY documented one-liner and it hard-routed to
# cu12 -- a CUDA-13 box following the quickstart got the wrong wheel and
# no warning until its first matmul.
all-cu12 = ["gpuwm[gpu-cu12]", "gpuwm[render]"]
all-cu13 = ["gpuwm[gpu-cu13]", "gpuwm[render]"]
all = ["gpuwm[all-cu12]"]
# The MCP server (`arwen-mcp` / `python -m gpuwm.mcp`): ArWen's doors
# spoken over the Model Context Protocol so an LLM agent can drive
# plan/price/fetch/prep/forecast/render as tools.  The SDK is an extra
# rather than a base dependency because the server is an AGENT
# integration surface, not a forecast capability: no `gpuwm` door and
# no data path imports it, and a person's install should not carry a
# protocol stack their shell never speaks.  The import is guarded in
# gpuwm/mcp/__init__.py with a one-sentence remedy naming this extra.
# Floor 1.26: the FastMCP structured-output surface the server returns
# dicts through; built and tested against mcp 1.26.0 (2026-08-31).
# Ceiling <2, EXCLUSIVE, because a floor with no ceiling always
# resolves to the newest SDK and the newest SDK is by definition the
# one this server has never run on: measured 2026-08-31, a fresh
# `pip install gpuwm[mcp]` resolved mcp 2.x, where FastMCP is renamed
# MCPServer, and `arwen-mcp` died at import on a green install.
# Admitting 2.x is a deliberate act that ports the server to the
# renamed API and moves this ceiling, not a resolver accident.
# Deliberately outside [all]: the quickstart one-liner serves a person
# running a forecast, and the excuse is recorded where the invariant is
# enforced (tests/test_dependency_declaration_parity.py).
mcp = ["mcp>=1.26,<2"]

[project.scripts]
gpuwm = "gpuwm.cli:main"
gpuwm-wrf-init = "gpuwm.source_cli:main"
rw-wps = "gpuwm.source_cli:main"
gpuwm-wrf-runtime-check = "gpuwm.native_wrf_distribution:main"
gpuwm-mapped-inspect = "gpuwm.mapped_source:main"
# The two prepared-cache forecast runners.  They used to be reachable
# only as script paths under tools/, which meant a `pip install gpuwm`
# could preprocess a GFS cycle and then had nowhere to run it -- the
# product's own documented chain required a git checkout to finish.
# Their substance is in the package now; tools/ keeps thin delegating
# entry points for the spelling the docs and receipts already use.
gpuwm-prepared-forecast = "gpuwm.prepared_single_domain_forecast:main"
gpuwm-prepared-tree-forecast = "gpuwm.prepared_domain_tree_forecast:main"
# The ensemble member front door: verify a declared member's bytes and
# stage it into a member-addressed prepared tree.  Members are fetched
# by filename but verified at decode on the GRIB ensemble identity, and
# ensemble means/spreads that share the member namespace refuse by name.
gpuwm-member-prep = "gpuwm.member_prep:main"
# The MCP stdio server ([mcp] extra).  The script installs with the base
# wheel -- a console script cannot be extra-gated -- and running it
# without the SDK prints the one-sentence remedy naming
# `pip install gpuwm[mcp]` instead of a traceback.
arwen-mcp = "gpuwm.mcp.server:main"

# `tilestream*` is not optional and not a convenience: it is the streamed
# transport, and gpuwm/core/streaming.py -- which DOES ship -- imports it at
# about twenty sites.  Every one is function-local, so the omission was
# invisible to any import of gpuwm and to every gate, because
# tools/battery/tiles_gates.txt says to run FROM THE REPOSITORY ROOT and a
# repository root on sys.path makes tilestream importable whether it is
# installed or not.  From a clean install it was not: `[tiles]` mode `auto`
# and `on` both died in `decide()` at `from tilestream.harness import
# halo_radius` with ModuleNotFoundError, and tools/les1m_probe.py the same
# way.  tests/test_tiles_distribution.py is the gate, and it asks setuptools
# rather than restating the pattern.
#
# The glob rather than a bare `tilestream`: a bare name ships the top level
# only, so the first subpackage anyone adds would reproduce exactly the
# defect this line closes.  The directories of evidence and receipts under it
# -- evidence/, evidence-reconcile/, rescued-tools/, skeptic/ -- ARE swept in
# as PEP 420 namespace packages (a pyproject `find` defaults to
# namespaces = true).  The receipt trees carry no Python and no package-data
# pattern names them, so what ships from each is an empty directory --
# EXCEPT rescued-tools/, which is excluded below: it holds .py files, and
# they are stale FORKS of live modules (boxdelta-forks/driver.py,
# rings.py, bench.py ... against tilestream/driver.py et al.), so the sweep
# was shipping a second, silently diverging copy of the transport inside
# the same wheel.  skeptic/ also carries .py (one-shot probe scripts, not
# forks of anything live); it ships today and is recorded here rather than
# swept quietly -- excluding it too is a smaller argument than the forks
# were, and it can join the exclude list when someone makes it.
# tests/test_tiles_distribution.py gates the rescued-tools exclusion in
# both directions (declaration and setuptools measurement).
#
# `configs*` is the top-level repository config directory, and it is here
# rather than under `gpuwm/` for one reason: it must land at
# `<site-packages>/configs`, which is exactly where
# gpuwm/verify/cases/_repo_config.py has always looked for it
# (`Path(__file__).parents[3] / "configs"`).  It had been in NO distribution
# at all -- 97 files in the repository, 0 in every wheel -- while
# docs/public/VERIFICATION.md's reproduce recipe and docs/public/LES.md's
# "see configs/ for a real, config-driven run" both send readers there.  The
# resolver's refusal was honest and the remedies (`--config`,
# GPUWM_CONFIGS_ROOT) were real; a headline claim that requires a git
# checkout to follow is still a headline claim nobody can reach.
# tests/test_configs_are_packaged.py measures both halves.
# `gpuwm` and `gpuwm.*` rather than `gpuwm*`, and that is not a tidy-up.
# These patterns are fnmatch over DIRECTORY names walked from the project
# root, and this repository holds a second distribution's project directory
# beside gpuwm/: `gpuwm-data/`.  `gpuwm*` matched it.  MEASURED on
# `python -m build --wheel`: gpuwm-2.5.0-py3-none-any.whl carried
# `gpuwm-data/gpuwm_data/__init__.py` and its top_level.txt named
# `gpuwm-data`, so `pip install gpuwm` wrote a `gpuwm_data` package into
# site-packages holding no data/ at all -- one fragment of the companion,
# shipped by the wrong distribution, answering to the companion's import
# name.  (`gpuwm-data` is not a valid identifier, which is why this was
# assumed to be impossible; `find` in a pyproject defaults to
# `namespaces = true`, and a namespace finder does not require one.)
#
# The pair is anchored: `gpuwm` matches the package and `gpuwm.*` matches
# its subpackages, and neither can ever match a sibling PROJECT directory
# again.  The exclusion below is the second lock rather than the fix -- it
# holds even if someone re-globs this line.
# tests/test_package_data_coverage.py measures both the package list and
# the top-level names it produces, against setuptools' own finder.
# `docs` is here for exactly one file, and it is anchored (`docs`, never
# `docs*`) so it stays that way: the repository's `docs/` holds .py under
# `docs/superpowers/receipts/`, and `docs*` would sweep those subtrees in
# as packages.  Anchored, the finder returns the top-level `docs`
# namespace package alone, and the `package-data` entry below names the
# single file it carries.
#
# WHY the wheel carries a repository document at all, and why at this
# exact path.  gpuwm-hex verifies the physics seam it builds against by
# hashing sixteen engine files by SHA-256, keyed on their repository
# paths, and it runs that manifest against two roots with one key set:
# a source checkout, and `site-packages` (the directory
# `importlib.util.find_spec("gpuwm").origin`'s grandparent names, which
# is where `gpuwm/core/mpas_column_batch.py` and the other fifteen
# already land).  Fifteen keys resolved under both roots.
# `docs/mpas-seam.md` -- the document that STATES the seam contract the
# other fifteen implement -- resolved under the checkout only, because
# no distribution placed it anywhere, so every installed-engine check
# reported it `absent` and the remedy told the reader to clone the
# repository beside the wheel they had just installed.
#
# `<site-packages>/docs/mpas-seam.md` is the one path that closes that
# with no second key: any other location (`gpuwm/docs/...`, a
# `.dist-info` extra) would make the installed root need a different key
# from the checkout root for the same document.  The shape is the one
# `configs` already ships under and for the same kind of reason -- a
# claim a reader cannot follow without a git checkout is a claim nobody
# can reach.
[tool.setuptools.packages.find]
# mpas_cycle_bridge is TOP-LEVEL on purpose and must ship. It is the far
# side of the MPAS port seam, and it is deliberately gpuwm-free: the port
# pins its own gpuwm checkout and installs an import guard, so the bridge
# package cannot live under gpuwm/ and cannot import it. gpuwm.cycle.anchor
# imports FROM it at module scope, so leaving it out of this list does not
# degrade a feature -- it makes `import gpuwm.cycle.anchor` fail outright on
# any installed copy, while every in-tree test keeps passing because
# PYTHONPATH=<worktree> finds it either way.
include = ["gpuwm", "gpuwm.*", "tools", "tilestream*", "configs*", "docs", "mpas_cycle_bridge*"]
# rescued-tools is development record that FORKED live modules; shipping the
# forks put a diverging driver.py/rings.py inside the wheel.  See the note
# above `include`; the files stay in the repository, only the wheel loses
# them.
#
# gpuwm-data is the OTHER distribution built from this repository
# (gpuwm-data/pyproject.toml).  It is not this project's to ship in any
# form, and a partial copy is worse than either whole answer: see the
# measurement above and MANIFEST.in, which prunes the same directory out
# of the sdist for the same reason.
exclude = ["tilestream.rescued-tools*", "gpuwm-data*"]

# Recursive globs, never an enumeration of filenames. The previous per-directory
# enumeration had drifted 52 files behind the tree -- including parameter tables
# and lookup fixtures that physics code loads at run time -- because every new
# oracle directory needed a line here and nobody regenerated the list.
# gpuwm/data and gpuwm/authorities hold no Python, so "everything under them"
# is both correct and incapable of going stale.
# tests/test_package_data_coverage.py fails if any file lands outside these.
[tool.setuptools.package-data]
gpuwm = [
    "*.json",
    "authorities/**/*",
    "data/**/*",
    # The prebuilt Rust artifacts a PLATFORM wheel carries, staged by
    # tools/stage_wheel_bridges.py between `cargo build --release` and
    # `python -m build`.  Absent from a source checkout and from the
    # py3-none-any fallback wheel, which is why the glob is written to
    # match nothing rather than to fail: setup.py tags the wheel from
    # whether this directory exists, so "no artifacts" is a valid build
    # that produces the universal wheel, not an error.
    #
    # Shipping them is what makes `pip install gpuwm` a COMPLETE install:
    # through 2.3.3 the wheel deliberately carried no Rust and every
    # decoder, the fetch backbone, the renderer and the radar front door
    # arrived only if `gpuwm setup` later succeeded -- which made a
    # post-install network step the failure surface on the first command
    # anyone runs, and left the Rust decode paths unreachable on a bare
    # install.
    "libexec/bridges/*",
]
"gpuwm.core.kernels" = ["*.cu", "*.cuh"]
# The frozen surface-observation network table. It is the thing that turns a
# domain anywhere on Earth into the network ids the surface front door is
# asked for, so a wheel without it can fetch nothing outside whatever the
# caller happened to name by hand.
"gpuwm.obs" = ["data/**/*"]
# The FTZ claim census is a shipped register, not a development artifact: a
# reader who installs the wheel and finds an FTZ sentence in the docs needs
# the record that says which measured cell backs it.
"gpuwm.verify" = ["*.json"]
# The capsule schema ships with the code that emits against it: a capsule a
# reader cannot validate is a receipt they have to take on trust.
"gpuwm.certify" = ["*.json"]
"gpuwm.ingest" = ["*.md"]
tools = ["prepare_hrrr_*.sh"]
# The one non-Python file under tilestream/ that a shipped module OPENS:
# make_plots.py and make_output_json.py both resolve it as
# `Path(__file__).with_name("output-scaling.json")`, which in an install
# resolves inside site-packages and nowhere else.  Declared for the same
# reason the enumeration under `tools` is: this is not a data directory and
# a blanket glob would be wrong.  Everything else beside it -- 27 markdown
# handoffs, 19 gate logs, the skeptic/ and evidence/ receipt trees -- is
# development record read by people out of a checkout, never by code, and
# is deliberately not shipped.  tests/test_tiles_distribution.py pins that
# claim by re-deriving it from the source rather than trusting this comment.
tilestream = ["output-scaling.json"]
# The repository configs, recursively and without an enumeration, for the
# same reason `gpuwm` above is written that way: a per-file list here would
# drift behind the tree and the first casualty would be whichever config a
# document had just started naming.  One glob covers the flat files and the
# five subdirectories (battery/, ensemble/, frozen/, real74/, scaffolds/)
# alike -- the sibling namespace packages `find` reports for those
# directories carry no pattern of their own, so every file is claimed once,
# by this key.  2.74 MB of TOML, JSON, WPS namelists and the five NetCDF
# terrain overrides the real74 comparison reads.
configs = ["**/*"]
# ONE file, enumerated, and the enumeration is the point.  `docs/` is 200+
# markdown pages plus receipt trees carrying their own .py; none of that
# is a wheel's business and a glob here would ship all of it.  What ships
# is the seam contract document, because gpuwm-hex's engine pin hashes it
# by the repository path this lands under -- see the `find` block above
# for the whole reasoning and why no other installed location works.
# tests/test_package_data_coverage.py measures that this key ships
# exactly this file, and no sibling.
docs = ["mpas-seam.md"]

# NOTHING is excluded from this wheel any more, and the empty table is the
# statement.  Both exclusion classes named files under `gpuwm/data/rrtmgp`
# and `gpuwm/data/thompson/tables`, and BOTH DIRECTORIES MOVED: since 2.5.0
# they ship in the `gpuwm-data` companion distribution (gpuwm-data/), whose
# pyproject.toml carries the two lists verbatim, for the same two reasons,
# beside the files they name.  Nothing was dropped and nothing was
# loosened -- the four CC-BY-NC-SA-4.0 RFMIP reference results still do not
# ship, and freezeH2O.dat / qr_acr_qg_V4.dat still arrive only through
# `gpuwm fetch-tables` under their size + SHA-256 pins.
#
# The move was a channel limit: this wheel measured 103.62 MiB against
# PyPI's 100 MiB per-file cap with the Rust bridges staged, and those two
# directories were 64.21 MiB of it.  See gpuwm/data_assets.py, which is the
# one resolver that knows which distribution holds which directory, and
# gpuwm-data/README.md for the split.
#
# The table is kept rather than deleted so this reasoning has somewhere to
# live and so re-adding an exclusion is a deliberate edit.  Anything added
# here must fit one of the two pinned classes, and
# tests/test_package_data_coverage.py pins both lists across BOTH
# pyprojects exactly.
#
# There WAS a third class -- redistribution-driven -- holding exactly
# data/thompson/tables/CCN_ACTIVATE.BIN, the aerosol-aware Thompson
# (mp_physics=28) CCN activation table.  It was removed on 2026-08-01: the
# file is WRF v4.6.1's own run/CCN_ACTIVATE.BIN bit for bit, WRF's
# LICENSE.txt is a public-domain dedication with a notice request rather
# than a condition, and the notice ships in
# gpuwm/data/wrf_radiation/LICENSE-WRF.txt.  It is now tracked, listed in
# that directory's MANIFEST.sha256, and swept into the COMPANION wheel by
# its "data/**/*" glob like every other packaged table.  It is still NOT in
# thompson_contract.CLASSIC_TABLE_ASSETS and TABLE_SET_ID is unchanged, so
# mp_physics=8 acquires no dependency on it, and the loader still fails
# closed on a missing or byte-different table.  Do not re-add an exclusion
# for it without also flipping
# thompson_aerosol_contract.AEROSOL_ASSET_REDISTRIBUTED back.
[tool.setuptools.exclude-package-data]
gpuwm = []

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA GPU + cupy",
           "slow: an exhaustive sweep, minutes rather than seconds",
           "network: live-internet smoke, additionally gated on GPUWM_NETWORK_TESTS=1",
           "static_rust_parity: RED until the static-fields Rust port lanes land (lane/static-rust-port); run with -m static_rust_parity"]
# Both test trees.  tilestream/ carries 13 pytest suites (312 tests) beside
# its `python -m` script gates; with only "tests" here, a bare `pytest` --
# which is what CI and the battery's full-suite legs run -- collected none
# of them, and 11 failures plus a collection error sat invisible until the
# 2.5.0 gating pass.  The script gates stay where they are: they define no
# top-level test_ functions, so collecting their modules adds no tests, and
# tools/battery/tiles_gates.txt remains their runner.  tilestream/conftest.py
# extends the GPU-marking discipline over the new tree so `-m "not gpu"` and
# GPUWM_NO_LOCAL_GPU=1 stay honest there.
testpaths = ["tests", "tilestream"]
