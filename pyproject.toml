[build-system]
# >=77 is the PEP 639 floor: it is what turns the `license` SPDX
# expression below into a License-Expression metadata field.  Older
# setuptools would either reject the string or ship it as a bare
# License field, and the whole point is `pip show gpuwm` answering
# "Apache-2.0" instead of dumping the license text.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuwm"
version = "2.4.1"
description = "Native WRF preprocessing and GPU-native limited-area weather modeling"
readme = "README.md"
# The SPDX expression (PEP 639), not `{ file = "LICENSE" }`: the file
# form pasted all 202 lines of Apache-2.0 into the METADATA License
# field, which is what `pip show gpuwm` prints.  The license text
# itself still ships in the wheel via `license-files` below.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
# numpy>=2 is load-bearing: the legacy-RRTMG FP32 max_ulp-0 discipline
# relies on NEP-50 weak promotion (float32 op python-scalar stays
# float32); numpy 1.26 would silently widen those chains to float64.
# The rrtmg modules also guard this at import time.
# jsonschema: every forecast route validates its certification capsule
# against gpuwm/certify/capsule_v1.schema.json at emission (found live:
# a pip install without it ran a whole forecast, then hit the import at
# capsule time -- emission is non-fatal now, but the dependency is real).
#
# rasterio/pyproj are RUNTIME dependencies, not an extra.  They were the
# [geog] extra through 2.3.2, and that shipped a headline feature nobody
# could reach: [all] deliberately excludes geog, every quickstart
# one-liner omits it, and the only mention of the extra anywhere was one
# source-checkout line in an older doc.  Following HIGHRES-TERRAIN.md on
# a documented install downloaded 160.7 MiB of Copernicus tiles and then
# died on the import.
#
# Making them default was weighed against the two things an extra buys,
# and both were measured rather than assumed:
#
#   Platform reach.  rasterio publishes macosx/manylinux/win wheels --
#   the SAME matrix netCDF4 already publishes, and netCDF4 has been a
#   hard dependency here for as long as this table has existed.  Adding
#   it therefore narrows the set of platforms `pip install gpuwm`
#   succeeds on by exactly nothing.  pyproj is strictly wider still (it
#   also ships musllinux).  Across the supported range the resolution is
#   wheel-only: 3.13 takes rasterio 1.5.1, and 3.11 -- which 1.5 dropped
#   -- backtracks to 1.4.4, whose cp311 wheels exist.  No source build,
#   so no GDAL toolchain is ever required of a user.
#
#   Install size.  Measured +118.8 MiB on a 380.3 MiB base install.
#   That is real, and it is still less than the 160.7 MiB the broken
#   path downloaded before failing.
#
# The CuPy precedent below does NOT transfer, and that is the whole
# distinction: CuPy must be an extra because the correct wheel is
# undecidable at pip time -- one wheel per CUDA major and no environment
# marker to pick with.  rasterio and pyproj carry no such ambiguity; pip
# resolves them correctly on every platform this project supports.  An
# extra there would be a workaround for a problem that does not exist.
#
# scipy and pyshp joined them on the same reasoning, one release later,
# for two more capabilities that were shipped-but-unreachable:
#
#   scipy.  Two capabilities, and the weaker of the two arguments is the
#   one about dealiasing, so it is stated exactly: gpuwm/obs/dealias.py's
#   `vad-region` engine labels its gate regions with
#   scipy.sparse.csgraph.connected_components.  Since 2026-08-12 the
#   DEFAULT engine is `region-global`, the Rust crate, so scipy is not
#   what the default dealias run reads -- but `vad-region` is a
#   selectable, supported, documented engine that every run before that
#   date used, and without scipy it is not selectable at all.
#
#   The unconditional one is gpuwm/verify/obs/regrid.py: every remap plan
#   the observation battery builds goes through scipy.spatial.cKDTree,
#   with no second engine and no fallback.  That is the whole referee.
#
#   Both sat behind an [obs]/[dealias] pair that `pip install
#   'gpuwm[all-cu12]'` -- the README's own recommended line -- did not
#   pull, and that no quickstart named.
#
#   The ingest/decode mandate does not bind this one.  Rust-or-CUDA-only
#   is a rule about READING and DECODING data; connected components on a
#   sparse adjacency matrix and a k-d tree over unit vectors are
#   arithmetic on arrays this project already carries in numpy.
#   (rasterio/pyproj above ARE decode, are a standing exception, and are
#   being moved into the Rust stack by the terrain lane.)
#
#   Cost, measured on cp313/win_amd64: 36.6 MiB of wheel.  Platform reach
#   is unchanged -- scipy's wheel matrix is a superset of numpy's, which
#   has been a hard dependency here since the first release.
#
#   pyshp.  The basemap reader.  tools/da_nowcast_render.py, the
#   launcher's basemap endpoint and tilestream/realcase_render.py read
#   the vendored Natural Earth shapefiles with a bare `import shapefile`
#   -- no try/except, no front-door check -- at the very END of the DA
#   nowcast chain, after survey, fetch, prepare, forecast and every DA
#   cycle.  It was in [render], which is the wrong home twice over: the
#   DEFAULT render engine is the rust one, which needs nothing from
#   [render] at all (measured: 161 PNGs from a bare install with staged
#   bridges), so the install that draws maps was not the install
#   carrying the shapefile reader.  73.7 kB of pure Python with no
#   dependencies of its own; there is no case for making anyone choose.
dependencies = ["numpy>=2.0", "netCDF4>=1.6", "matplotlib>=3.8",
                "jsonschema>=4.0", "rasterio>=1.3", "pyproj>=3.6",
                "scipy>=1.11", "pyshp>=2.3"]
keywords = ["WRF", "WPS", "GRIB", "NetCDF", "weather", "CUDA"]
# No `License ::` classifier: PEP 639 deprecates them outright and
# setuptools >=77 refuses to combine one with the SPDX expression above.

[project.urls]
Homepage = "https://github.com/FahrenheitResearch/arwen"
Repository = "https://github.com/FahrenheitResearch/arwen"
Changelog = "https://github.com/FahrenheitResearch/arwen/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# CuPy ships ONE wheel per CUDA major, and the wheel must match the CUDA
# major the box actually serves: cupy-cuda12x on a CUDA-13-only box
# imports cleanly, compiles kernels, and then dies at the first cuBLAS
# load (proven on a rented CUDA 13.2 node, 2026-08-05).
#
# A pip extra CANNOT detect a CUDA major -- there is no environment
# marker for it -- so this table does not pretend to choose.  The choice
# is NAMED, one extra per major:
#
#     CUDA 12.x box .......... gpuwm[gpu-cu12]   (or gpuwm[all-cu12])
#     CUDA-13-only box ....... gpuwm[gpu-cu13]   (or gpuwm[all-cu13])
#
# [gpu] and [all] are kept and still resolve to cu12, because every
# install that already works names them and a silently-changed default
# would break those boxes.  They are ALIASES for the cu12 pair, not a
# third policy: there is exactly one place each wheel is pinned.
#
# The honest-intent rule this table cannot enforce by itself is enforced
# by `gpuwm doctor`, which reads the box's CUDA major straight off the
# driver -- with or without CuPy installed -- and prints the extra that
# matches it rather than a cu12 default.
gpu-cu12 = ["cupy-cuda12x>=13.0"]
gpu-cu13 = ["cupy-cuda13x>=13.6"]
gpu = ["gpuwm[gpu-cu12]"]
# gpuwm render's mandated science core: derived quantities come from the
# wrf package (pip distribution wrf-rust).  A RANGE, not an exact pin:
# `==0.2.35` made `pip install gpuwm[render]` DOWNGRADE a user who already
# ran a newer wrf-rust (field report: 0.2.38 -> 0.2.35), which is a
# hostile thing to do to the co-developed core on someone else's box.
# 0.2.35 is the floor because it is what the products are certified
# against; <0.3 is the ceiling because that is where upstream is free to
# change the diagnostic surface.  The same window is written once in
# gpuwm/science_core.py and enforced at runtime from there.
# This extra is ONLY that window now.  pyshp moved into the runtime
# dependencies above: see the note there for why the shapefile reader had
# no business riding along with a science core the default render engine
# does not even use.
render = ["wrf-rust>=0.2.35,<0.3"]
# RETAINED AND EMPTY ON PURPOSE.  rasterio/pyproj moved into the runtime
# dependencies above in 2.3.3, so this extra has nothing left to add.  It
# is kept because `pip install gpuwm[geog]` is written down in the wild --
# in 2.3.2's own docs, in shell history, in other people's scripts -- and
# pip fails an install naming an extra that does not exist.  Deleting it
# would break the one command that DID work before this release.  Same
# discipline as the [gpu]/[all] aliases below: never invalidate an
# install line that already works.
geog = []
# RETAINED AND EMPTY ON PURPOSE, exactly as [geog] above.  scipy moved
# into the runtime dependencies, so neither of these has anything left to
# add: `pip install gpuwm` now scores against observations and dealiases
# velocity.  They are kept because both spellings are written down --
# 2.3.3's own docs/install.md extras table names them, and until this
# release two code remedies told readers to run them -- and pip fails an
# install naming an extra that does not exist.  Never invalidate an
# install line that already works.
obs = []
dealias = []
# psutil: tests/test_prepare_hrrr_wrf.py's Windows arm walks the process
# ancestry to find the cmd.exe shim that owns a decoder worker, and a
# fresh venv running the union battery breaks on the bare import.  It is
# a test-time need only -- no gpuwm/ or tools/ module imports it -- so
# it lives here beside pytest rather than in the runtime dependencies.
# The two previously-audited undeclared imports of the same class are
# already declared where their features live: pyshp (task #65) in
# [render] and scipy (task #78) in [obs]/[dealias].
dev = ["pytest>=8.0", "psutil>=5.9"]
# Maintainer-only, and both entries are the same shape: a tool that
# REGENERATES something the wheel ships, reachable by nobody else.
#
# `python -m tools.publish_geog_mirror upload` pushes the WPS_GEOG mirror
# snapshot to Hugging Face.  It needs write credentials on a dataset
# repository nobody but the maintainers owns -- but huggingface_hub was
# declared in NO table at all, which is the same third state pyshp and
# scipy were in.
#
# `python -m tools.harvest_radar_heights` reads `/where/height` out of one
# European polar volume per radar to fill the antenna heights in
# `gpuwm/obs/data/radar_sites_odim.json`, which the wheel ships frozen.  A
# user reads that table; only a maintainer rebuilds it, and rebuilding it
# means opening HDF5 from Python.  Nothing on a user path does: the product
# decodes ODIM through `rw_odim`, which carries its own pure-Rust reader,
# so h5py is a build-the-table dependency and not a read-the-table one.
#
# Deliberately outside [all]: an extra nobody can use should not be in the
# one-liner.
publish = ["huggingface_hub>=0.23", "h5py>=3.10"]
# The two extras a person running a forecast on their own card needs,
# under one name, so the quickstart is one pip line instead of a choice
# between two that most readers want both of.  It does not name geog
# because there is nothing left to name: high-resolution geography is in
# the runtime dependencies as of 2.3.3, so [all] carries it the same way
# a bare install does.  Through 2.3.2 this line read "deliberately NOT
# geog", and that reasoning -- authoring tiles is a different job from
# running the model -- was sound about the JOB and wrong about the
# consequence: it left the documented terrain path unreachable from
# every install line the project publishes.
#
# obs and dealias are absent for the same reason and not a different one:
# they are empty now.  The 2.3.2 audit's H14 -- "pip install
# 'gpuwm[all-cu12]' silently ships without velocity dealiasing" -- is
# closed by scipy being a base dependency, NOT by aggregating a name
# here.  Aggregation would have been the bandaid: [all] would have been
# right and a bare `pip install gpuwm` would still have been missing the
# default dealias engine.
#
# The invariant, rather than the enumeration, is what is enforced:
# tests/test_dependency_declaration_parity.py fails if any extra that is
# NOT dev, publish or a CUDA-major alternative ever holds a requirement
# [all-cu12]/[all-cu13] does not.  So the day one of these regains
# content, the aggregate covers it by construction instead of by somebody
# remembering -- which is exactly what failed in 2.3.2.
#
# One [all-*] per CUDA major for the same reason [gpu-*] is split: the
# quickstart's one-liner is the single most-followed instruction in the
# project, so it must be able to reach the cu13 wheel.  Before this pair
# existed, [all] was the ONLY documented one-liner and it hard-routed to
# cu12 -- a CUDA-13 box following the quickstart got the wrong wheel and
# no warning until its first matmul.
all-cu12 = ["gpuwm[gpu-cu12]", "gpuwm[render]"]
all-cu13 = ["gpuwm[gpu-cu13]", "gpuwm[render]"]
all = ["gpuwm[all-cu12]"]

[project.scripts]
gpuwm = "gpuwm.cli:main"
gpuwm-wrf-init = "gpuwm.source_cli:main"
rw-wps = "gpuwm.source_cli:main"
gpuwm-wrf-runtime-check = "gpuwm.native_wrf_distribution:main"
gpuwm-mapped-inspect = "gpuwm.mapped_source:main"
# The two prepared-cache forecast runners.  They used to be reachable
# only as script paths under tools/, which meant a `pip install gpuwm`
# could preprocess a GFS cycle and then had nowhere to run it -- the
# product's own documented chain required a git checkout to finish.
# Their substance is in the package now; tools/ keeps thin delegating
# entry points for the spelling the docs and receipts already use.
gpuwm-prepared-forecast = "gpuwm.prepared_single_domain_forecast:main"
gpuwm-prepared-tree-forecast = "gpuwm.prepared_domain_tree_forecast:main"

# `tilestream*` is not optional and not a convenience: it is the streamed
# transport, and gpuwm/core/streaming.py -- which DOES ship -- imports it at
# about twenty sites.  Every one is function-local, so the omission was
# invisible to any import of gpuwm and to every gate, because
# tools/battery/tiles_gates.txt says to run FROM THE REPOSITORY ROOT and a
# repository root on sys.path makes tilestream importable whether it is
# installed or not.  From a clean install it was not: `[tiles]` mode `auto`
# and `on` both died in `decide()` at `from tilestream.harness import
# halo_radius` with ModuleNotFoundError, and tools/les1m_probe.py the same
# way.  tests/test_tiles_distribution.py is the gate, and it asks setuptools
# rather than restating the pattern.
#
# The glob rather than a bare `tilestream`: a bare name ships the top level
# only, so the first subpackage anyone adds would reproduce exactly the
# defect this line closes.  The package is flat today and setuptools' find
# is not a namespace find, so the directories of evidence and receipts under
# it -- evidence/, evidence-reconcile/, rescued-tools/, skeptic/ -- carry no
# __init__.py and are not swept in by it.
[tool.setuptools.packages.find]
include = ["gpuwm*", "tools", "tilestream*"]

# Recursive globs, never an enumeration of filenames. The previous per-directory
# enumeration had drifted 52 files behind the tree -- including parameter tables
# and lookup fixtures that physics code loads at run time -- because every new
# oracle directory needed a line here and nobody regenerated the list.
# gpuwm/data and gpuwm/authorities hold no Python, so "everything under them"
# is both correct and incapable of going stale.
# tests/test_package_data_coverage.py fails if any file lands outside these.
[tool.setuptools.package-data]
gpuwm = [
    "*.json",
    "authorities/**/*",
    "data/**/*",
]
"gpuwm.core.kernels" = ["*.cu", "*.cuh"]
# The frozen surface-observation network table. It is the thing that turns a
# domain anywhere on Earth into the network ids the surface front door is
# asked for, so a wheel without it can fetch nothing outside whatever the
# caller happened to name by hand.
"gpuwm.obs" = ["data/**/*"]
# The FTZ claim census is a shipped register, not a development artifact: a
# reader who installs the wheel and finds an FTZ sentence in the docs needs
# the record that says which measured cell backs it.
"gpuwm.verify" = ["*.json"]
# The capsule schema ships with the code that emits against it: a capsule a
# reader cannot validate is a receipt they have to take on trust.
"gpuwm.certify" = ["*.json"]
"gpuwm.ingest" = ["*.md"]
tools = ["prepare_hrrr_*.sh"]
# The one non-Python file under tilestream/ that a shipped module OPENS:
# make_plots.py and make_output_json.py both resolve it as
# `Path(__file__).with_name("output-scaling.json")`, which in an install
# resolves inside site-packages and nowhere else.  Declared for the same
# reason the enumeration under `tools` is: this is not a data directory and
# a blanket glob would be wrong.  Everything else beside it -- 27 markdown
# handoffs, 19 gate logs, the skeptic/ and evidence/ receipt trees -- is
# development record read by people out of a checkout, never by code, and
# is deliberately not shipped.  tests/test_tiles_distribution.py pins that
# claim by re-deriving it from the source rather than trusting this comment.
tilestream = ["output-scaling.json"]

# Wheel exclusions come in exactly two pinned classes; nothing may be
# excluded for any other reason, and tests/test_package_data_coverage.py
# pins both lists exactly.
#
# 1. License-driven: the four RFMIP reference-result NetCDFs are
#    CC-BY-NC-SA-4.0 (gpuwm/data/rrtmgp/PROVENANCE.md): they stay in-repo
#    as test fixtures, but shipping them in the distributable would attach
#    a non-commercial restriction to the wheel.  Their license text
#    (LICENSE-CC-BY-NC-SA-4.0) still ships so PROVENANCE.md stays
#    resolvable.
# 2. Size-driven externalized assets: the two largest Thompson tables
#    would push the wheel and sdist over PyPI's 100 MB per-file cap
#    (freezeH2O.dat, 243 MiB, additionally exceeds GitHub's 100 MiB blob
#    limit and is absent from the public repository too).  Both are
#    published as GitHub release assets and staged by
#    `gpuwm fetch-tables` (gpuwm/table_assets.py), verified against the
#    same size + SHA-256 pins every mp8 run enforces
#    (gpuwm/core/thompson_contract.py).  MANIFEST.in carries the same
#    two exclusions for the sdist.
#
# There WAS a third class -- redistribution-driven -- holding exactly
# data/thompson/tables/CCN_ACTIVATE.BIN, the aerosol-aware Thompson
# (mp_physics=28) CCN activation table.  It was removed on 2026-08-01: the
# file is WRF v4.6.1's own run/CCN_ACTIVATE.BIN bit for bit, WRF's
# LICENSE.txt is a public-domain dedication with a notice request rather
# than a condition, and the notice ships in
# gpuwm/data/wrf_radiation/LICENSE-WRF.txt.  It is now tracked, listed in
# gpuwm/data/thompson/tables/MANIFEST.sha256, and swept into the wheel by
# [tool.setuptools.package-data]'s "data/**/*" glob like every other
# packaged table.  It is still NOT in thompson_contract.CLASSIC_TABLE_ASSETS
# and TABLE_SET_ID is unchanged, so mp_physics=8 acquires no dependency on
# it, and the loader still fails closed on a missing or byte-different
# table.  Do not re-add an exclusion here without also flipping
# thompson_aerosol_contract.AEROSOL_ASSET_REDISTRIBUTED back.
[tool.setuptools.exclude-package-data]
gpuwm = [
    "data/rrtmgp/rfmip-clear-sky-reference-lw-down.nc",
    "data/rrtmgp/rfmip-clear-sky-reference-lw-up.nc",
    "data/rrtmgp/rfmip-clear-sky-reference-sw-down.nc",
    "data/rrtmgp/rfmip-clear-sky-reference-sw-up.nc",
    "data/thompson/tables/freezeH2O.dat",
    "data/thompson/tables/qr_acr_qg_V4.dat",
]

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA GPU + cupy",
           "slow: an exhaustive sweep, minutes rather than seconds",
           "network: live-internet smoke, additionally gated on GPUWM_NETWORK_TESTS=1"]
testpaths = ["tests"]
