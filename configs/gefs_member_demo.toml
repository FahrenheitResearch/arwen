# GEFS v12 pgrb2a+pgrb2b 0.50 deg, one ensemble member
#
# PROVEN END TO END, NOT REASONED ABOUT.  This file was taken from
# `gpuwm fetch` (or its named staged-bytes door) through `gpuwm prep`,
# `gpuwm sim` and the Rust renderer `rw_wrfbatch` before it was
# written down, and every number in this header is a measurement of
# THIS file's own run.
#
# EXECUTION CARD: NVIDIA GeForce RTX 5070 Ti, 16 GiB, Linux (weather-node-1)
#   The BUDGET is 10 GiB.  `gpuwm check --vram-gib 10` gated this
#   config, and the peak below is the forecast PROCESS's own device
#   memory, polled back-to-back off the driver for the whole run.
#   The silicon underneath is a 16 GiB card, so read the peak against
#   the 10 GiB BUDGET, never against the card.
#
# MEASURED 2026-08-20:
#   grid                 50 x 50 x 49 at 24 km  1200 x 1200 km
#   window               3 h, boundary interval 10800 s
#   gpuwm check          rc 0 at --vram-gib 10
#   gpuwm prep           rc 0, 8.8 s
#   forecast             rc 0, 5.7 s, report status PASS, health.final.ok True
#   PEAK DEVICE MEMORY   4.24 GiB of the 10.00 GiB budget (5.76 GiB unused)
#                        210 samples over 5.7 s (37 Hz)
#   render               rc 0, 4.9 s, 98 product images through rw_wrfbatch
#
# ACQUISITION: gpuwm fetch --source gefs --cycle 2026-08-20T00 --hours 12
#   --member c00
#
# PHYSICS: morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1 -- this source's own computed default
# (`gpuwm run-plan --physics-profiles`).  Both radiation streams run,
# so the window may cross local night.
#
# The member token is in the leaf filename for GEFS, so the fetched
# tree feeds `gpuwm prep --input-list` directly; the a/b pair is
# concatenated per valid time by the fetch door.
#
[experiment]
