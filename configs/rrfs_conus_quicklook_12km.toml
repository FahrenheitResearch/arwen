# RRFS quicklook -- the smallest RRFS forecast worth looking at.
#
# SOURCE      rrfs (RRFS operational 3 km CONUS), no credentials.  RRFS's
#             wrfprs analogue is a PAIR: prslev carries the upper air and
#             2dfld carries every surface, soil and terrain record, so both
#             products are fetched and both are passed per valid time.
#             Only the 00/06/12/18Z cycles publish the hourly pair.
# COST        the pair runs about 0.84 GiB per valid time on the wire
#             (measured: 1.67 GiB for the two times below, 3 m 29 s), and
#             preparation's HOST RAM tracks THE NUMBER OF FORCING TIMES,
#             not the size of your domain: two times measured 26.3 GiB of
#             peak RSS on a 12 km domain, and three times measured
#             31.5 GiB on a 3 km one.  Two valid times is the least RRFS
#             can initialise from, which is why this file asks for exactly
#             two.  Widening the domain is cheap here; lengthening the
#             window is not.
# DOMAIN      one 12 km Lambert domain, 180 x 150 x 49 (2160 x 1800 km,
#             centred on the central United States), 1 forecast hour from
#             the f000 analysis through f001.
# PHYSICS     morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1 -- the source's
#             own computed default (`gpuwm run-plan --physics-profiles`),
#             and the only suite on RRFS's admissible list carrying
#             wrf-verified status.  Both radiation streams run, so the
#             surface longwave budget stays closed through the night.
#             Kain-Fritsch cumulus is on, which is the right choice at
#             12 km.
# SIZED FOR   a 10 GiB card: forecast peak envelope 5.50 GiB against the
#             8.75 GiB budget `gpuwm domain --vram-gib 10` prices a 10 GiB
#             card at, 3.25 GiB of headroom.  That is the Windows/WDDM
#             accounting; the same configuration prices at 4.11 GiB under
#             the Linux one.
# MEASURED    device residency of the forecast process peaked at 3.39 GiB,
#             inside both envelopes.  Preparation 42.1 s and 26.3 GiB peak
#             host RSS; forecast 39.2 s (60 steps); render 10.5 s for 384
#             PNGs, 192 products across 2 frames.  RTX 5070 Ti 16 GiB /
#             Linux, sharing the card with other work, so the walls are an
#             upper bound.
#
# RUN IT
#   gpuwm fetch --source rrfs --cycle <YYYY-MM-DDT{00,06,12,18}> --hours 1 \
#       --out data/rrfs
#
#   RRFS initialises from the PAIR, so every valid time contributes BOTH
#   of its files as an --input.  The fetched inputs.txt lists the prslev
#   half alone (the product the registry row marks primary); passing that
#   list on its own refuses with "mapped frame ... lacks required fields
#   ['air_temperature_2m', ... 'volumetric_soil_moisture']", because those
#   nine fields live in 2dfld.
#
#   gpuwm prep --source rrfs \
#       --input data/rrfs/rrfs.tHHz.prslev.3km.f000.conus.grib2 \
#       --input data/rrfs/rrfs.tHHz.2dfld.3km.f000.conus.grib2 \
#       --input data/rrfs/rrfs.tHHz.prslev.3km.f001.conus.grib2 \
#       --input data/rrfs/rrfs.tHHz.2dfld.3km.f001.conus.grib2 \
#       --supplement rrfs_prslev_2dfld_in_band_surface=data/rrfs/rrfs.tHHz.2dfld.3km.f000.conus.grib2 \
#       --supplement rrfs_prslev_2dfld_in_band_surface=data/rrfs/rrfs.tHHz.2dfld.3km.f001.conus.grib2 \
#       --experiment-config configs/rrfs_conus_quicklook_12km.toml \
#       --wps-namelist configs/rrfs_conus_quicklook_12km.namelist.wps \
#       --geog-root <WPS_GEOG> --output-root out/rrfs-quicklook-prepared
#   gpuwm sim out/rrfs-quicklook-prepared \
#       --experiment-config configs/rrfs_conus_quicklook_12km.toml \
#       --wps-namelist configs/rrfs_conus_quicklook_12km.namelist.wps \
#       --outdir out/rrfs-quicklook
#   gpuwm render out/rrfs-quicklook/wrfout/<frame> --out out/rrfs-quicklook/png
#
# `start_time` below is the cycle you fetched.  Change both it and the
# namelist's start_date/end_date together when you move to another cycle;
# the operational bucket keeps only the last several days.

[experiment]
name = "rrfs_conus_quicklook_12km"
start_time = 2026-08-20T12:00:00
run_seconds = 3600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 28.5
truelat2 = 48.5
stand_lon = -97.5

[shared]
nz = 49
ztop = 20000.0
# RRFS's prslev ladder reaches 2 hPa on every mapped field, so a 100 hPa
# model top sits far inside the source column and no level is extrapolated.
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 180
ny = 150
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror
# `gpuwm fetch` flags.
[fetch]
source = "rrfs"
cycle = "2026-08-20T12"
hours = 1
out = "data/rrfs"
cadence = 1
