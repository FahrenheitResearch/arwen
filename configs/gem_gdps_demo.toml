# GEM GDPS, the quick one: a single 12 km Lambert domain over eastern North
# America, 180 x 144 x 49, three forecast hours, a wrfout every 30 minutes.
# Three hours is one GDPS forcing interval, which is the shortest window this
# source can drive.
#
# SOURCE: gem-gdps -- Environment and Climate Change Canada, MSC Datamart.
#   No credentials, no decoder-tool flags.
# BUDGET: `gpuwm check configs/gem_gdps_demo.toml --vram-gib 10` on an RTX 3080
#   10 GiB reports a 3.89 GiB forecast peak envelope and PASSES against a
#   5.84 GiB budget -- that card's measured 7.58 GiB free minus the calibrated
#   1.74 GiB reserve.  The card was driving a Windows desktop at the time, so
#   1.95 GiB of that headroom survives a 10 GiB machine that is also in use.
# MEASURED on one RTX 5070 Ti, Linux: 199 s for the whole run-plan chain over
#   staged bytes (prepare 88 s, forecast 75 s, render 32 s), 3.39 GiB peak
#   device memory held by the run's own process, 1344 product PNGs, runner
#   status PASS with nan_free true.  Downloading its 351 objects cold took a
#   further 1240 s, sharing the link with a second download.
#
# Datamart keeps a rolling window of recent cycles, so move
# [experiment].start_time and [fetch].cycle to a current 00Z or 12Z cycle
# before fetching.
# The whole chain -- fetch, prepare, forecast, render -- runs from one
# `gpuwm run-plan` document on the "prepared" route (docs/run-plan.md), and
# `gpuwm check` on this file prints the stage-by-stage alternative.
# PHYSICS: morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1: mp_physics 10, longwave RTE+RRTMGP, shortwave RTE+RRTMGP (radt 12 min), Kain-Fritsch cumulus, bl_pbl_physics 1, sf_surface_physics 2.
# Taken verbatim from gpuwm.physics_compat, so this file passes the prepared-
# forecast runner's profile guard as emitted.  Child dx/dt derive exactly from
# the parent chain and are never hand-typed (gpuwm/experiment.py).
# NOCTURNALLY VALID: longwave and shortwave both run, so the surface longwave
# budget stays closed through the night.

[experiment]
name = "gem_gdps_demo"
start_time = 2026-08-20T12:00:00
run_seconds = 10800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 45.0
ref_lon = -75.0
truelat1 = 35.0
truelat2 = 55.0
stand_lon = -75.0

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 180
ny = 144
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 1800.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror `gpuwm fetch` flags.
[fetch]
source = "gem-gdps"
cycle = "2026-08-20T12"
hours = 3
out = "data/gem_gdps_demo"
cadence = 3
