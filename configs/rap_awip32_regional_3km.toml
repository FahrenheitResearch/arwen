# RAP regional -- a convection-permitting forecast downscaled from RAP.
#
# SOURCE      rap (RAP awip32, AWIPS grid 221, 32 km Lambert over North
#             America), hourly cycles, no credentials.  One file per lead,
#             about 18 MiB: the 6 h window below measured 127.9 MiB over
#             seven files, fetched in 15 s.
# DOMAIN      one 3 km Lambert domain, 300 x 250 x 49 (900 x 750 km,
#             centred on the central United States), 6 forecast hours from
#             the f00 analysis through f06.
# PHYSICS     morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1 -- RAP's own
#             computed default (`gpuwm run-plan --physics-profiles`) and
#             the only suite on its admissible list carrying wrf-verified
#             status -- with ONE deliberate change: cu_physics = 0.  At
#             3 km deep convection is resolved by the dynamics, so leaving
#             the Kain-Fritsch parameterization on would count its heating
#             and rainfall twice.  Both radiation streams still run.
# SIZED FOR   a 10 GiB card: forecast peak envelope 7.29 GiB against the
#             8.75 GiB budget `gpuwm domain --vram-gib 10` prices a 10 GiB
#             card at, 1.46 GiB of headroom.  That is the Windows/WDDM
#             accounting; the same configuration prices at 5.78 GiB under
#             the Linux one.  The wizard fits 342 x 272 on the same card;
#             this grid keeps margin for a desktop that is also driving a
#             display.
# MEASURED    device residency of the forecast process peaked at 5.22 GiB,
#             inside both envelopes.  Preparation 42.4 s and 3.72 GiB peak
#             host RSS; forecast 621.9 s (1440 steps); render 53.6 s for
#             1344 PNGs, 192 products across 7 frames.  RTX 5070 Ti 16 GiB
#             / Linux, sharing the card with other work, so the walls are
#             an upper bound.
#
# RUN IT
#   gpuwm fetch --source rap --cycle <YYYY-MM-DDTHH> --hours 6 --out data/rap
#   gpuwm prep --source rap --input-list data/rap/inputs.txt \
#       --experiment-config configs/rap_awip32_regional_3km.toml \
#       --wps-namelist configs/rap_awip32_regional_3km.namelist.wps \
#       --geog-root <WPS_GEOG> --output-root out/rap-regional-prepared
#   gpuwm sim out/rap-regional-prepared \
#       --experiment-config configs/rap_awip32_regional_3km.toml \
#       --wps-namelist configs/rap_awip32_regional_3km.namelist.wps \
#       --outdir out/rap-regional
#   gpuwm render out/rap-regional/wrfout/<frame> --out out/rap-regional/png
#
# `start_time` below is the cycle you fetched.  Change both it and the
# namelist's start_date/end_date together when you move to another cycle.

[experiment]
name = "rap_awip32_regional_3km"
start_time = 2026-08-20T12:00:00
run_seconds = 21600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 28.5
truelat2 = 48.5
stand_lon = -97.5

[shared]
nz = 49
ztop = 20000.0
# RAP's awip32 ladder reaches 50 hPa on every mapped field, so a 100 hPa
# model top sits inside the source column and no level is extrapolated.
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 300
ny = 250
time_step = 15
dx = 3000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror
# `gpuwm fetch` flags.
[fetch]
source = "rap"
cycle = "2026-08-20T12"
hours = 6
out = "data/rap"
cadence = 1
