# April 3, 1974 four-domain Thompson (mp8) matched-rerun configuration:
# the 12-18Z verification window measured against the retained CPU WRF
# v4.6.1 Thompson reference run
# wrf_cpu_thompson_500m_19740403_norestart_20260721_224158 (WRF v4.6.1
# d66e442f, ifx, 48 ranks; provenance and mirror locations in
# handoffs and docs/thompson-rematch-20260728.md -- no machine-local
# path is normative here).
#
# Derived from the committed flagship configs/real74_4dom.toml with the
# following deliberate, reference-matched differences (the flagship file
# itself is NOT relabeled):
#   * mp_physics 10 (Morrison) -> 8 (Thompson), matching the CPU
#     reference namelist; morr_rimed_ice dropped (Morrison-only knob).
#     mp8 is first-class since the promotion (product/v1 packaging lane
#     2026-07-28): the byte-validated WRF v4.6.1 classic tables ship in
#     gpuwm/data/thompson/tables and are the default table root;
#     GPUWM_THOMPSON_TABLE_ROOT remains an optional byte-identical-root
#     override, and no enable environment variable is required.  (The
#     2026-07-28 rematch itself ran under the pre-promotion guard.)
#   * ra_rrtmg_variant "rrtmg_legacy" + wrf_rrtmg_compatibility
#     "wrf-rrtmg-4-4-legacy-v1": the exact port of WRF v4.6.1's bundled
#     RRTMG, the same scheme family the CPU reference ran
#     (ra_lw/sw_physics = 4/4), never the RTE+RRTMGP substitution.
#   * run_seconds 21600 (12Z -> 18Z window).
#   * d04 is the THOMPSON-campaign nest: WRF e_we = e_sn = 401 staggered
#     -> 400x400 mass, parent_grid_ratio 2, parent_time_step_ratio 2,
#     500 m / dt 2.5 s (the flagship's 601x601 ratio-3 d04 is the
#     ISHMAEL/Morrison-campaign geometry and would not be comparable to
#     the CPU reference d04).
#   * history cadence matches the CPU reference wrfouts exactly:
#     d01/d02/d03 hourly, d04 half-hourly (namelist history_interval
#     60, 60, 60, 30).
# Nest epssm 0.1 overrides mirror the earlier reference-matched GPU
# comparisons (real74_thompson_d03_entryrainfix_18z_20260727) and the
# committed flagship.  The CPU namelist's SCALAR epssm 0.5 is NOT a
# difference: WRF scalar-assignment semantics set d01 only and the
# unassigned tail keeps the Registry default 0.1
# (gpuwm/namelist_import.py), so CPU and GPU agree -- d01 0.5, nests
# 0.1.  An earlier revision of this header claimed a "known, documented
# difference" here; the rematch handoff (anomaly A7) falsified that
# claim and it is struck.

[experiment]
name = "real74_thompson_1218z_rrtmg_legacy_4dom"
start_time = 1974-04-03T12:00:00
run_seconds = 21600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 10800.0

[projection]
map_proj = "lambert"
ref_lat = 39.6848
ref_lon = -83.9297
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -83.9297

[shared]
# WRF e_vert = 50 staggered full levels -> nz = 49 mass levels.
nz = 49
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
top_lid = false
moist = true
moist_cq = true
mp_physics = 8
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
ra_physics = 4
ra_rrtmg_variant = "rrtmg_legacy"
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
bldt = 0.0

[[domain]]
# WRF e_we = 251, e_sn = 201 (staggered) -> mass dimensions.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 250
ny = 200
time_step = 60
dx = 12000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

[[domain]]
# WRF e_we = 501, e_sn = 401 (staggered) -> mass dimensions.
grid_id = 2
parent_id = 1
i_parent_start = 63
j_parent_start = 51
parent_grid_ratio = 4
parent_time_step_ratio = 4
nx = 500
ny = 400
specified = false
nested = true
history_interval_s = 3600.0
epssm = 0.1
radt = 3.0
cu_physics = 0
diff_6th_factor = 0.1

[[domain]]
# WRF e_we = 502, e_sn = 502 (staggered) -> mass dimensions.
grid_id = 3
parent_id = 2
i_parent_start = 167
j_parent_start = 117
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 501
ny = 501
specified = false
nested = true
history_interval_s = 3600.0
epssm = 0.1
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.08

[[domain]]
# WRF e_we = 401, e_sn = 401 (staggered) -> mass dimensions; the
# Thompson-campaign 500 m ratio-2 nest matching the CPU reference
# (namelist e_we/e_sn 401, parent_grid_ratio 2, parent_time_step_ratio 2,
# i/j_parent_start 151/151).
grid_id = 4
parent_id = 3
i_parent_start = 151
j_parent_start = 151
parent_grid_ratio = 2
parent_time_step_ratio = 2
nx = 400
ny = 400
specified = false
nested = true
history_interval_s = 1800.0
epssm = 0.1
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.06

[case_data]
# Declared inputs: same reference-bundle artifacts as real74_4dom.toml.
# The four-domain Thompson rerun consumes the identical ERA5 forcing +
# statics.
forcing = [
    "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/era5_grib/era5_19740403.grb",
]
vtable = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/era5_grib/Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
wps_namelist = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/namelists/namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/static/WPS_GEOG"
# Provenance: the retained ERA5 GRIB lacks invariant geopotential, so each
# grid-specific 12Z WPS met_em SOILHGT is declared from repo-local copies
# retained off the reference runs' own WPS chains.  d01-d03 are the
# committed campaign artifacts (weather-node-1 Morrison matched-run met_em;
# sfcprs2-forward-verified against the retained wrfinput PSFC to <=0.09 Pa)
# and were verified 2026-07-28 to be byte-identical to the Thompson
# reference chain's own met_em SOILHGT.  d04 is retained from the Thompson
# reference chain itself (wrf_cpu_thompson_500m_19740403_20260721_123510/
# real_run/met_em.d04.1974-04-03_12_00_00.nc), the only chain that carries
# the 500 m ratio-2 grid.
source_orography.d01 = "real74/soilhgt.d01.nc"
source_orography.d02 = "real74/soilhgt.d02.nc"
source_orography.d03 = "real74/soilhgt.d03.nc"
source_orography.d04 = "real74/soilhgt_thompson500m.d04.nc"
source_orography_variable = "SOILHGT"
sfcp_to_sfcp = true
# No co2_vmr override: the legacy RRTMG port runs WRF's ghg_input=0
# analytic year-formula trace gases (the exact behavior of the CPU
# reference run) and fails closed on an explicit override.  The
# flagship's co2_vmr=330e-6 exists to give the modern RTE+RRTMGP
# substitution the same 1974 CO2 the WRF formula produces.
output_domain = 1
output_title = "gpuwm Thompson 12-18Z four-domain legacy-RRTMG matched rerun"
