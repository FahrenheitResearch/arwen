# RRFS-like North American template, tier N, on grid K.
#
# A polar stereographic 3 km grid true at 45 N, standard longitude 120 W,
# 4440 x 2488 x 65 (718 M cells): it covers RRFS's four regional product
# grids and stops 4.5 rows short of the pole.  Cold start and boundaries
# from GFS, 84 h, as RRFS's synoptic cycles run.
#
# Physics in kind with RRFS v1's deterministic suite (RRFS_sas at
# ccpp-physics edd85a55), seven of its ten parts: aerosol-aware Thompson,
# MYNN-EDMF, MYNN surface layer, RUC with 9 soil levels and mosaics, CLM
# lake, GSL drag, RRTMG every 15 min.  Declared missing, never substituted:
# scale-aware SAS (C1), smoke and dust (C9, C11), the ozone tracer and
# h2ophys (C4), HAILCAST, lightning threat and the hourly maxima (C10).
# Refused options, run at the engine's value: MYNN TKE
# advection (C2), RUC snow cover option 3 (C3), decorrelation-length cloud
# overlap (C5), radiation aerosol climatology (C6).  Never matched: FV3's
# dycore, its 36 s step and its sequential physics coupling.  Outward name:
# "RRFS-like", never "RRFS".
#
# A TEMPLATE, not a run: 10 cards of 96 GB admit it on price, but the clock
# needs 64 to 96 cards across hosts, which waits on cross-host exchange,
# and preparation needs about 0.5 TB of host RAM.

[experiment]
name = "rrfs-like-north-america-grid-k"
start_time = 2026-10-03T12:00:00
run_seconds = 302400.0
feedback = 0
smooth_option = 0
blend_width = 5
# RRFS blends its lateral boundaries over 20 rows (nrows_blend = 20,
# det/input.nml:120): one specified row plus a 20-row relaxation zone.
spec_bdy_width = 21
restart_interval_s = 0.0

[projection]
# Grid K: polar stereographic true at 45 N, standard longitude 120 W.
map_proj = "polar"
ref_lat = 51.74
ref_lon = -113.03
truelat1 = 45.0
truelat2 = 45.0
stand_lon = -120.0

[devices]
count = 10

[shared]
# ---- physics: the rows of suite rrfs-sas-deterministic in
# gpuwm/data/system_suites/rrfs-v1.json, nothing else.  A test holds every
# value here equal to that row.
mp_physics = 28
aer_init_opt = 1
wif_input_opt = 1
use_rap_aero_icbc = false
bl_pbl_physics = 5
bl_mynn_edmf = 1
bl_mynn_edmf_mom = 1
bl_mynn_mixlength = 1
bl_mynn_tkeadvect = false
icloud_bl = 1
scalar_pblmix = 1
sf_sfclay_physics = 5
sf_surface_physics = 3
num_soil_layers = 9
mosaic_lu = 1
mosaic_soil = 1
sf_lake_physics = 1
gwd_opt = 3
topo_wind = 0
ra_lw_physics = 4
ra_sw_physics = 4
ra_rrtmg_variant = "rrtmg_legacy"
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
km_opt = 4
moist = true
moist_cq = true
bldt = 0.0
# ---- vertical: 65 layers as RRFS runs (npz = 65, det/input.nml:119).  The
# top stays at 15 hPa until package B1 gives the base state a stratosphere;
# RRFS's own top is about 2.1 hPa.  This ladder resamples the 50-level
# operational ARW ladder onto 66 interfaces.
nz = 65
ztop = 20000.0
p_top = 1500.0
eta_levels = [
    1.000000, 0.998462, 0.995846, 0.991846, 0.986077, 0.976846, 0.965154, 0.951308, 0.935462, 0.917769, 0.899385, 0.879538, 0.858077, 0.835000, 0.809615, 0.782615, 0.754000, 0.723769, 0.691462, 0.657308, 0.621538, 0.584308, 0.545846, 0.510846, 0.478308, 0.448192, 0.420500, 0.395269, 0.371815, 0.350046, 0.329862, 0.311477, 0.294569, 0.278877, 0.264323, 0.250938, 0.238038, 0.226392, 0.215546, 0.204700, 0.193854, 0.183008, 0.172162, 0.161315, 0.150469, 0.139623, 0.128777, 0.117931, 0.107085, 0.096238, 0.085392, 0.075008, 0.065700, 0.058854, 0.052385, 0.046231, 0.040346, 0.034808, 0.029638, 0.024715, 0.020008, 0.015546, 0.011362, 0.007392, 0.003615, 0.000000,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
# ---- ARW dynamics (the dycore is a declared difference from FV3)
time_step_sound = 4
epssm = 0.1
emdiv = 0.01
smdiv = 0.1
hypsometric_opt = 2
h_sca_adv_order = 5
moist_adv_opt = 1
diff_6th_opt = 2
diff_6th_slopeopt = 1
diff_6th_thresh = 0.05
moist_mix6_off = false
w_damping = 0
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
top_lid = false
zadvect_implicit = 1
terrain_opt = 1
map_proj = 2
use_adaptive_time_step = true
step_to_output_time = true
adaptation_domain = 1
target_cfl = 1.4
target_hcfl = 0.98
max_step_increase_pct = 5
starting_time_step = 15
starting_time_step_den = 0
max_time_step = 60
max_time_step_den = 0
min_time_step = 3
min_time_step_den = 0
spec_zone = 1
relax_zone = 20

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 4440
ny = 2488
time_step = 15
dx = 3000.0
spec_exp = 0.33
specified = true
nested = false
history_interval_s = 3600.0
# RRTMG every 900 s (fhswr = fhlwr = 900, det/input.nml:199-200).
radt = 15.0
# Scale-aware SAS is declared missing (package C1): no deep convection
# scheme runs, and no other scheme stands in for it.
cu_physics = 0
diff_6th_factor = 0.12

[fetch]
source = "gfs"
cycle = "2026-10-03T12"
hours = 84
cadence = 1
area = "0.0,-180.0,90.0,180.0"
