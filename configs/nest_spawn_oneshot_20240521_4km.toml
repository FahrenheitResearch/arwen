# ONE-SHOT SPAWN CONTROL: the same slot, living once, writing flat paths.
#
# This file is nest_lifecycle_20240521_4km.toml with the retire and rearm
# tables deleted and nothing else changed -- same parent, same child
# geometry, same physics, same placement, same time trigger.  It exists so
# the default-path promise is proven on disk rather than asserted: a domain
# that declares only `spawn` is not a lifecycle episode, and it must keep
# writing the flat wrfout_d02_<date> pathname it has always written, with
# no dNN/episode-NNN/ directory anywhere under the output root.
#
# Read the two runs side by side.  The only difference between them is two
# inline tables in the child's [[domain]] block; the only difference on
# disk should be the child's directory layout.  If the control ever grows
# episode directories, the additive surface stopped being additive.
#
# Shorter than its sibling on purpose: one episode has nothing to wait for
# after the spawn, so 20 model minutes carry the trigger plus three child
# frames.

[experiment]
name = "nest_spawn_oneshot_20240521_4km"
start_time = 2024-05-21T18:00:00
run_seconds = 1200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 41.3
ref_lon = -94.45
truelat1 = 31.3
truelat2 = 51.3
stand_lon = -94.45

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 200
ny = 160
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 300.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# `spawn` and nothing else.  This is the whole difference.
[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 75
j_parent_start = 55
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 150
ny = 150
specified = false
nested = true
history_interval_s = 300.0
epssm = 0.5
radt = 4.0
cu_physics = 0
diff_6th_factor = 0.1
spawn = { trigger = "time", at_s = 300.0 }

[case_data]
forcing = ["${GPUWM_CASE_DATA_ROOT}/era5/era5-combined.grib"]
vtable = "${GPUWM_PACKAGE_ROOT}/gpuwm/data/vtables/Vtable.ERA5_CDO"
forcing_interval_s = 3600.0
wps_namelist = "nest_spawn_oneshot_20240521_4km.namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WPS_GEOG"
sfcp_to_sfcp = true
output_domain = 1
output_title = "gpuwm one-shot nest spawn 2024-05-21 (flat paths)"
