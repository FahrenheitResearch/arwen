[experiment]
name = "era5_l137_demo"
start_time = 2026-05-05T12:00:00
run_seconds = 7200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# The smallest honest ERA5 NATIVE MODEL-LEVEL demo: one 12 km Lambert domain
# at the minimum layout the sizer will fit, two forecast hours on hourly
# analyses, both radiation streams on.  The atmosphere comes down the
# `era5-l137` route -- all 137 hybrid sigma-pressure model levels, whose A/B
# interface coefficients are read from the producer's own GRIB2 coordinate
# octets rather than from a coefficient table -- and the land surface is
# borrowed from the SAME HOUR's pressure-level/single-level analysis.
#
# SIZED FOR a 10 GiB card: `gpuwm check --budget-gib 8.75 --vram-gib 10`
# reports a 4.50 GiB forecast peak envelope against a 9.50 GiB budget.
# MEASURED end to end on one card: 5.9 s preparation, 16.5 s forecast on a
# warm kernel cache (56.8 s the first time on a card, which pays the one-time
# NVRTC compile of this suite's kernels), 11.1 s rendering, 576 product
# plots, and a 2.30 GiB high-water mark of device memory held by the
# forecast process itself.
#
# `gpuwm fetch` has no download route for this source: model-level ERA5 is a
# queued Copernicus MARS request under your own CDS account, so its bytes are
# staged by hand (docs/public/SOURCES.md, 'Sources with no fetch door').  Two
# files, same hours, same 0.25 degree grid:
#   1. dataset reanalysis-era5-complete, class=ea expver=1 stream=oper type=an
#      levtype=ml levelist=1/to/137 param=130/131/132/133
#      date=2026-05-05 time=12:00:00/13:00:00/14:00:00/15:00:00
#      area=52/-112/31.25/-78 grid=0.25/0.25 format=grib
#   2. the same-hour surface donor, which IS a front-door fetch:
#      gpuwm fetch --source era5 --cycle 2026-05-05T12 --hours 3 --cadence 1 \
#          --area 31.25,-112,52,-78 --out data/era5-l137
# then
#   gpuwm prep --source era5-l137 --source-root data/era5-l137 \
#       --experiment-config configs/era5_l137_demo.toml \
#       --wps-namelist configs/era5_l137_demo.namelist.wps
# One MARS request for this dataset at a time: the datastore rejects extra
# queued requests for reanalysis-era5-complete rather than queueing them.

[projection]
map_proj = "lambert"
ref_lat = 42.0
ref_lon = -95.0
truelat1 = 32.0
truelat2 = 52.0
stand_lon = -95.0

[shared]
nz = 49
ztop = 20000.0
# The 137-level ladder's top interface sits near 0.01 hPa, so a 100 hPa model
# top is deep inside the source column and no level is extrapolated.
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
# RADIATION: both streams, so the surface longwave budget stays closed
# through the night and nothing has to be declared away.
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 60
ny = 48
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12
