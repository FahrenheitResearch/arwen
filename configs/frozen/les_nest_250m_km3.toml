# A NESTED LES configuration: 3 km / 750 m parents with the YSU PBL, and a
# 250 m child with the PBL off and WRF's 3-D Smagorinsky closure (km_opt = 3).
#
# This is the shipped example of the per-domain turbulence row -- "a PBL
# parent may carry a PBL-off LES child".  Every LES key on d03 below is
# per-domain and importable from a WRF namelist, so the paired
# namelist.wps/namelist.input for this tree round-trip through
# `gpuwm import-namelist` to this file.
#
# PHYSICS: wsm6-ysu-mm5-noah-no-radiation-v1 -- mp_physics 6, longwave OFF,
# shortwave Dudhia (radt 1 min), no cumulus parameterization,
# sf_surface_physics 2.  Taken verbatim from gpuwm.physics_compat, so this
# file passes the prepared-forecast runner's profile guard as emitted.
# Child dx/dt derive from the parent chain and are never hand-typed
# (gpuwm/experiment.py).
#
# READ docs/public/LES.md BEFORE TRUSTING OUTPUT FROM THIS FILE.  In
# particular:
#   * the vertical grid is shared by every domain -- ArWen rejects
#     per-domain vertical keys by construction -- so the 250 m child runs
#     its 3 km grandparent's 49 levels, about 17 m at the first level and
#     ~250 m at 3 km.  Vertical resolution, not dx, is what makes this a
#     COARSE LES at the gray-zone edge rather than a canonical one;
#   * d02 at 750 m still runs the 1-D YSU PBL and is itself inside the gray
#     zone.  Treat its sub-kilometre structure as indicative;
#   * km_opt = 2 cannot be substituted here: prognostic TKE on a nest child
#     is refused until a nested prognostic-TKE domain has been run.
#
# The `[fetch]` block at the end names the HRRR cycle this tree was built
# and measured against.  Point it at another cycle and the geometry still
# holds; the receipts in docs/superpowers/receipts/les/ do not.
[experiment]
name = "les_nest_250m_km3"
start_time = 2026-08-01T16:00:00
run_seconds = 25200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# ---------------------------------------------------------------------------
# RADIATION DECLARATION, ADDED AT 1.8.8.  THIS FILE IS AN ARCHIVED RUN
# RECORD (configs/frozen/README.md), NOT A TEMPLATE.  Do not copy it to
# start a forecast; copy a config whose radiation is real, both streams on.
# ---------------------------------------------------------------------------
# JUSTIFY constant-downward-longwave-v1: with ra_lw_physics = 0 nothing
# computes downward longwave -- gpuwm's Dudhia adapter is shortwave-only and
# returns the GLW array it was handed -- so Noah (sf_surface_physics 2) on
# every domain integrated a fixed 300 W m-2 for the whole 7 h window.  That
# was already true of the run these bytes are the record of.  Through 1.8.7
# the constant was initialize_physics's seed and nothing said so; the 1.8.8
# guard refuses the pairing unless the experiment declares it, which is the
# ONE reason a frozen record may move -- its old bytes no longer LOAD.  No
# physics selector changed here and none may: the token states the number
# the archived run actually used, so the record loads on 1.8.8 and
# reproduces the same physics it had.  WHAT IT MEANS FOR THE PUBLISHED
# NUMBERS: this tree's surface energy budget was radiatively incomplete, so
# its surface and near-surface fields are not admissible as skill.  The
# window is 16Z-23Z at 46.35 N, 120.00 W -- 08-15 local, daylight end to
# end -- so the nocturnal collapse the companion token is about never
# enters, and the receipts that name these bytes compare arms that all
# carry the same constant, so the comparisons they publish are not what
# this exposes; an absolute surface claim from them would be.
# Restart-tolerated field.
acknowledgements = ["constant-downward-longwave-v1"]

