# The gray-zone parent chain (UNBLESSED, with findings): the shipped
# nested-LES tree with its
# 750 m parent moved from YSU to Shin-Hong (bl_pbl_physics = 11, km_opt = 4).
#
# This file differs from configs/les_nest_250m_km3.toml by exactly one
# per-domain row: d02 selects bl_pbl_physics = 11.  Everything else --
# geometry, vertical grid, physics profile, and every LES key on the child
# (c_s, mix_isotropic, mix_upper_bound, isfflx) -- is byte-identical to the
# shipped tree, so any difference between the two runs is the parent
# closure and nothing else.
#
# P4's interface campaign scored this configuration and it ships WITH
# FINDINGS, unblessed: two of four registered screens read out of band
# (the partition handoff at every frame; rim/far at 22Z), and per the
# registered AC-P4.2 rule those findings block the blessing.  The
# findings section of docs/public/GRAYZONE-NEST.md is the status of
# record; docs/superpowers/receipts/grayzone/P4-CAMPAIGN-20260804.md has
# the numbers.
#
# WHY d02 AND ONLY d02 (the per-domain reading, P4 of the LES
# completion program):
#   * d02 at 750 m sits INSIDE the gray zone (dx between ~2 km and the
#     child).  Shin-Hong there is exactly the `sweep_config(dx, 11)`
#     configuration the acceptance ladder scored -- SH vertical transport,
#     horizontal Smagorinsky via km_opt = 4 -- and every gated rung
#     1600/800/400/200/100 m landed inside its pre-registered Honnert
#     (2011) band (docs/superpowers/receipts/grayzone/
#     PHASE1-SHINHONG-20260803.md).  At d02's own scale the ladder read
#     subgrid TKE fraction ~0.83 at 800 m where every flat closure read
#     ~0.35.
#   * d01 at 3 km STAYS YSU by default.  The ladder's 3200 m rung was
#     advisory-only, never gated; switching the coarse parent is an owner
#     option, not the default.
#   * d03 stays PBL-off with the LES closure (km_opt = 3), unchanged from
#     the shipped child block.
#
# READ docs/public/GRAYZONE-NEST.md BEFORE TRUSTING OUTPUT FROM THIS FILE,
# and docs/public/LES.md for the bounds the tree inherits (shared 49-level
# vertical grid; coarse LES at the gray-zone edge; the fetch/spin-up
# finding).  In particular:
#   * the Shin-Hong parent carries its own subgrid TKE (published as
#     TKE_SHINHONG in its wrfout); like WRF, that field is NOT handed down
#     to the child -- the child cold-starts its own closure;
#   * the km_opt=2-on-a-nest refusal keys on a km_opt=2 PARENT
#     (docs/public/LES.md section 4).  A Shin-Hong parent is km_opt = 4 and
#     passes that predicate.
#
# The `[fetch]` block names the HRRR cycle the shipped tree was built and
# measured against, unchanged, so the two configurations run the same case.
[experiment]
name = "les_nest_250m_grayzone"
start_time = 2026-08-01T16:00:00
run_seconds = 25200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# ---------------------------------------------------------------------------
# RADIATION DECLARATION, ADDED AT 1.8.8.  THIS FILE IS AN ARCHIVED RUN
# RECORD (configs/frozen/README.md), NOT A TEMPLATE.  Do not copy it to
# start a forecast; copy a config whose radiation is real, both streams on.
# ---------------------------------------------------------------------------
# JUSTIFY constant-downward-longwave-v1: with ra_lw_physics = 0 nothing
# computes downward longwave -- gpuwm's Dudhia adapter is shortwave-only and
# returns the GLW array it was handed -- so Noah (sf_surface_physics 2) on
# every domain integrated a fixed 300 W m-2 for the whole 7 h window.  That
# was already true of the R2 and R3 runs these bytes are the record of.
# Through 1.8.7 the constant was initialize_physics's seed and nothing said
# so; the 1.8.8 guard refuses the pairing unless the experiment declares it,
# which is the ONE reason a frozen record may move -- its old bytes no
# longer LOAD.  No physics selector changed here and none may: this file
# still differs from configs/frozen/les_nest_250m_km3.toml by exactly the
# d02 bl_pbl_physics row, and it gained exactly the declaration that file
# gained, so the campaign's one-row comparison is still a one-row
# comparison.  WHAT IT MEANS FOR THE PUBLISHED NUMBERS: this tree's surface
# energy budget was radiatively incomplete, so its surface and near-surface
# fields are not admissible as skill.  The window is 16Z-23Z at 46.35 N,
# 120.00 W -- 08-15 local, daylight end to end -- so the nocturnal collapse
# the companion token is about never enters.  Restart-tolerated field.
acknowledgements = ["constant-downward-longwave-v1"]

