[experiment]
name = "gfs_wrf_direct_proof"
start_time = 2026-07-20T00:00:00
run_seconds = 10800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# THIS FILE DECLARES NOTHING, and that is the point.  It ran shortwave
# with longwave OFF through local night up to release 1.8.7 and carried
# ``asymmetric-radiation-nocturnal-window-v1`` to say so -- a standing
# bypass on a file whose whole job is to be COPIED, since it is the first
# config a new ERA5 or GFS user opens.  The physics below is nocturnally
# valid on its own (RRTMG-class longwave AND shortwave), so there is
# nothing to declare.  Materializing a no-radiation --physics-profile
# ONTO this base is a different act, and the runner writes that
# profile's own declarations into the experiment.toml it publishes.

[projection]
map_proj = "lambert"
ref_lat = 39.6848
ref_lon = -83.9297
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -83.9297

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
moist = true
mp_physics = 6
moist_adv_opt = 1
km_opt = 4
c_s = 0.25
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
# RADIATION: both streams, the exact port of WRF v4.6.1's bundled legacy
# RRTMG rather than the RTE+RRTMGP substitution, so this proof's gpuwm arm
# and the paired stock-WRF namelist (ra_lw_physics = 4, ra_sw_physics = 4)
# run one radiation lineage.  Through 1.8.7 this was 0/1 -- Dudhia shortwave
# with longwave OFF -- which WRF v4.6.1 cannot run at all: with
# ra_sw_physics > 0 its lwrad_select has no lw = 0 case and calls
# wrf_error_fatal (phys/module_radiation_driver.F:2245).  In gpuwm it ran,
# and handed Noah a fixed 300 W m-2 downward longwave for the whole
# forecast.
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
bldt = 0.0

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 250
ny = 200
time_step = 5
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
# 12-minute radiation clock, the cadence every shipped RRTMG-class
# profile uses (gpuwm/physics_compat.py).  It was 1.0 under Dudhia.
radt = 12.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.08
