# The quick HRRR demo: one 118 x 112 x 49 domain at 3 km over the southern
# Great Plains, one forecast hour from the 00Z cycle, a wrfout every 15
# minutes.  It exists to be run in a few minutes, end to end, on a small
# card -- fetch, prepare, integrate, render -- and it is the smallest thing
# that still runs HRRR at HRRR's own spacing.
#
# source: hrrr (native hybrid levels).  Two commands run it:
#   gpuwm prep --source hrrr ... --output-root DIR   (the companions beside
#       this file supply --domain-spec, --namelist-input, --wps-namelist)
#   gpuwm sim DIR --experiment-config DIR/experiment.toml
#       --wps-namelist DIR/namelist.wps --outdir OUT
#
# sized for a 10 GiB card: emitted by `gpuwm domain --vram-gib 10`, whose
# forecast peak envelope is 7.67 GiB against that card's 8.75 GiB budget --
# 1.08 GiB of headroom.
# measured peak VRAM: 6062 MiB (5.92 GiB) held by the forecast process,
# sampled once a second on an RTX 5070 Ti under Linux.
# measured wall time: fetch 81 s (2.1 GB of wrfnat + wrfprs), prepare 30 s,
# forecast 72 s (48 s of that the one-time NVRTC kernel compile), render
# 18 s for 945 product PNGs across the five frames.
#
# PHYSICS: thompson-mp8-ysu-mm5-noah-rrtmg-legacy-v1: mp_physics 8, longwave
# legacy RRTMG, shortwave legacy RRTMG (radt 12 min), NO cumulus
# parameterization, bl_pbl_physics 1, sf_surface_physics 2.  Taken verbatim
# from gpuwm.physics_compat, so this file passes the prepared-forecast
# runner's profile guard as written.  cu_physics = 0 is the route's own
# requirement, and it is the right answer at 3 km: the grid resolves deep
# convection, so parameterizing it would count the same overturning twice.
# NOCTURNALLY VALID: longwave and shortwave both run, so the surface longwave
# budget stays closed through the night -- and this 00Z window is local
# night over the domain.

[experiment]
name = "hrrr_native_quick_demo"
start_time = 2026-08-20T00:00:00
run_seconds = 3600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 35.3
ref_lon = -97.5
truelat1 = 25.3
truelat2 = 45.3
stand_lon = -97.5

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 8
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 118
ny = 112
time_step = 15
dx = 3000.0
specified = true
nested = false
history_interval_s = 900.0
radt = 12.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror `gpuwm fetch` flags.
[fetch]
source = "hrrr"
cycle = "2026-08-20T00"
hours = 1
area = "31.75,-101.52,38.83,-93.48"
out = "data/hrrr_native_quick_demo"
