# Observation-battery CASE CONFIG -- menu row B-06.
#
# This is a CASE, not the shape: it supplies the two things
# shape_3km_thompson_rrtmg_legacy.toml beside it deliberately refuses to
# supply -- a real init instant and a real domain centre -- and changes
# nothing else.  Diff it against that file and exactly four keys move:
# [experiment].name, [experiment].start_time, [projection].ref_lat/ref_lon
# (and stand_lon, which follows ref_lon by WPS convention so the y-axis is
# the domain's own central meridian).  Geometry, the 49-level ladder, dt,
# every physics switch and the radiation lineage are the registered
# composition, untouched, so this case is scored by the same instrument as
# every other case in the battery.
#
# CASE IDENTITY (spec section 1.1: it lives here, in the checker's token
# list, and nowhere else):
#
#   case id        case-20250314
#   event day      2025-03-14 UTC  (battery spec section 1.2, row B-06)
#   phenomenon     high-shear early-spring outbreak (multi-round, day into night)
#   region         MO/AR/MS
#   init           2025-03-14 12:00 UTC -- the HRRR analysis cycle nearest
#                  12 UTC (spec section 1.3)
#   length         24 h; scoring window F02-F18, F18-F24 reported
#   centre         35.40 N, 91.20 W
#
# CENTRE PROVENANCE (spec section 1.3: "centered per case by the wizard").
# The centre is DERIVED, not chosen: the named anchors below are the
# locations this case's own section 1.2 row names, and `gpuwm domain`
# --polygon over them returns 35.4378 N, 91.2372 W, which this file
# transcribes at 0.1 deg.  That rounding is the registered precedent: B-04's
# committed centre 41.30 N / 94.50 W is Greenfield, IA (41.3050, -94.4614)
# at 0.1 deg.  Anchors:
#                  Missouri (Jefferson City): 38.5767 N, 92.1735 W
#                  Arkansas (Little Rock): 34.7465 N, 92.2896 W
#                  Mississippi (Jackson): 32.2988 N, 90.1848 W
#
# FROZEN SOIL (B4-ROUTE-QUALIFICATION.md section 2, caveat 1): the
# stock-WRF exporter refuses when any soil temperature is below 273.15 K
# on the branch that synthesizes SH2O from SMOIS.  This is a cold-season
# case, so that refusal is LIVE until measured -- it is checked at root
# preparation and the answer recorded in the entry receipt, never assumed
# here.  The ArWen arm is unaffected either way.
#
# ROUTE STATUS: re-run tools/battery_route_preflight.py against THIS file for
# the case's own answer; it quotes every gate verbatim from the route's own
# code.

