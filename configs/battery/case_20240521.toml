# Observation-battery CASE CONFIG -- the B5 shakedown case.
#
# This is a CASE, not the shape: it supplies the two things
# shape_3km_thompson_rrtmg_legacy.toml beside it deliberately refuses to
# supply -- a real init instant and a real domain centre -- and changes
# nothing else.  Diff it against that file and exactly four keys move:
# [experiment].name, [experiment].start_time, [projection].ref_lat/ref_lon
# (and stand_lon, which follows ref_lon by WPS convention so the y-axis is
# the domain's own central meridian).  Geometry, the 49-level ladder, dt,
# every physics switch and the radiation lineage are the registered
# composition, untouched, so this case is scored by the same instrument as
# every other case that will follow.
#
# CASE IDENTITY (spec section 1.1: it lives here, in the checker's token
# list, and nowhere else):
#
#   case id        case-20240521
#   event day      2024-05-21 UTC  (battery spec section 1.2, row B-04)
#   phenomenon     daytime cyclic supercell over southwest/central Iowa
#   init           2024-05-21 12:00 UTC -- the HRRR analysis cycle nearest
#                  12 UTC, pre-convective for this domain by roughly eight
#                  hours (spec section 1.3)
#   length         24 h; scoring window F02-F18, F18-F24 reported
#   centre         41.30 N, 94.50 W
#
# WHY THIS CASE IS THE SHAKEDOWN.  It is the warm-season, discrete-mode,
# daytime row of the menu, which is the cheapest place to find an
# instrument bug: convection is deep and widespread inside the box for most
# of the scored window, so a fractions-skill score has signal to measure at
# every registered threshold, and the surface network under it is dense.
# It is also the one case day every upstream lane already touched with real
# bytes -- the B1 front-door decisions (MRMS sentinels, Stage-IV edition
# and template, the ASOS station freeze) were all settled against
# 2024-05-21 objects -- so a shakedown here re-uses proven archive routes
# and any surprise is the battery's, not the archive's.
#
# FROZEN SOIL (B4-ROUTE-QUALIFICATION.md section 2, caveat 1): the stock-WRF
# exporter refuses when any soil temperature is below 273.15 K on the branch
# that synthesizes SH2O from SMOIS.  This is a late-May case, and the check
# is recorded as a checked fact in the case entry receipt rather than left
# to be discovered on a node.  The ArWen arm is unaffected either way.
#
# ROUTE STATUS: the composition is ADMITTED by every static gate with zero
# refusals (docs/public/receipts/obsbattery/B4-ARWEN-HRRR-ROUTE.json, after
# the wave's route motion and the registered profile
# thompson-mp8-ysu-mm5-noah-rrtmg-legacy-v1).  Re-run
# tools/battery_route_preflight.py against THIS file for the case's own
# answer; it quotes every gate verbatim from the route's own code.

[experiment]
name = "battery_case_20240521"
start_time = 2024-05-21T12:00:00
run_seconds = 86400.0
feedback = 0
smooth_option = 0
blend_width = 5
