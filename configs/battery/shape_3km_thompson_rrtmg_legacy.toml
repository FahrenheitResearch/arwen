# Observation-battery DOMAIN SHAPE, faithful arm, as the battery spec
# registers it (docs/superpowers/specs/2026-08-03-obs-verification-battery.md
# section 1.3): one 3 km Lambert domain, 480 x 400 x 49 = 9.408 M cells
# (1440 x 1200 km), the 49-level eta ladder, dt 15 s, Thompson mp8 / YSU /
# classic MM5 / Noah, cumulus OFF (3 km is convection-permitting), radiation
# ra_rrtmg_variant = "rrtmg_legacy" -- the exact WRF transcription used for
# every matched-run comparison -- so the three-way's radiation is the same
# physics on both sides by construction.
#
# THIS FILE IS THE SHAPE, NOT A CASE.  Its centre is the wizard's own CONUS
# reference point and its start time is an arbitrary recent HRRR cycle; a
# registered case supplies both, in its own configs/battery/<case>.toml
# beside its case module.  What this file exists for is to be the exact
# geometry and physics the route gates are asked about, so their answer is
# about the battery's shape rather than about a placeholder.
#
# ROUTE STATUS (B4, measured with tools/battery_route_preflight.py; receipt
# at docs/public/receipts/obsbattery/B4-ARWEN-HRRR-ROUTE.json): the HRRR run
# route REFUSES this composition today, at three independent gates, all for
# one reason -- the HRRR route pins radiation to (ra_lw_physics 0,
# ra_sw_physics 1).  Run the preflight for the current answer; it quotes each
# refusal verbatim from the route's own code.  The sizing smoke that CAN run
# today is shape_smoke_3km_thompson_dudhia.toml beside this file.

[experiment]
name = "battery_shape_3km_legacy_rrtmg"
start_time = 2026-07-28T12:00:00
run_seconds = 86400.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 39.5
ref_lon = -98.5
truelat1 = 29.5
truelat2 = 49.5
stand_lon = -98.5

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 8
top_lid = false
epssm = 0.5
# The exact port of WRF v4.6.1's bundled legacy RRTMG, never the RTE+RRTMGP
# substitution: the matched-run decay tables were produced with this engine,
# so the three-way comparison's two model arms share one radiation lineage.
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 480
ny = 400
time_step = 15
dx = 3000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.12
