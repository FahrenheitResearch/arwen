# Observation-battery SIZING SMOKE: the battery's exact domain shape on the
# one HRRR physics suite the run route admits today.
#
# The battery spec makes a sizing smoke mandatory before any campaign launch
# (section 8.3, "every campaign launch is preceded by its sizing smoke"), and
# its section 8.1 numbers are brackets scaled from a 24.81 M-cell anchor that
# every one of them is waiting to be superseded by.  This file is that smoke:
# the registered battery geometry -- 480 x 400 x 49 = 9.408 M cells at
# dx 3 km, dt 15 s, the 49-level ladder, Thompson mp8 / YSU / classic MM5 /
# Noah, cumulus OFF -- run for one forecast hour, which is enough to measure
# device peak, seconds per simulated minute and bytes per wrfout frame, and
# cheap enough to fetch two HRRR analyses for.
#
# It differs from shape_3km_thompson_rrtmg_legacy.toml beside it in exactly
# two ways, and both are deliberate:
#
#   * RADIATION.  This file selects ra_lw_physics 0 / ra_sw_physics 1 (no
#     longwave, Dudhia shortwave, radt 1 min), which is what the shipped
#     profile thompson-mp8-ysu-mm5-noah-validation-v1 pins and therefore the
#     only radiation the HRRR root preparer will prepare.  It is NOT the
#     battery's radiation: the faithful arm runs legacy RRTMG so that both
#     model arms share one radiation lineage.  A shape measured here
#     therefore prices the DYCORE, MICROPHYSICS, PBL and SURFACE cost of the
#     battery shape, and under-prices radiation by exactly the RRTMG
#     residency and cadence cost -- which is itemized separately by
#     gpuwm.core.preflight and must be added, not assumed away.
#   * RUN LENGTH.  One hour, not the battery's 24.
#
# diff_6th_factor 0.08 and radt 1.0 are the profile's own values, not a
# choice made here: a config that drifts from the named profile in any switch
# is refused by the preparer, so the smoke states the profile exactly.

[experiment]
name = "battery_shape_3km_sizing_smoke"
start_time = 2026-07-28T12:00:00
run_seconds = 3600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# JUSTIFY constant-downward-longwave-v1: this is the battery's SHAPE and
# SIZING smoke -- one hour at 12Z, measuring wall time and device
# footprint at the battery's grid, never a forecast anybody reads.  The
# Dudhia-only pairing is the subject: it is the cheapest radiation the
# battery ships, the file is named for it, and its GLW is therefore a
# declared 300 W m-2 constant rather than a computed flux.  Nothing here
# is a template -- copy configs/battery/shape_3km_thompson_rrtmg_legacy
# .toml for a config with real longwave.
acknowledgements = ["constant-downward-longwave-v1"]

[projection]
map_proj = "lambert"
ref_lat = 39.5
ref_lon = -98.5
truelat1 = 29.5
truelat2 = 49.5
stand_lon = -98.5

[shared]
nz = 49
