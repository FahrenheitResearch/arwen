# A NESTED LES configuration: 3 km / 750 m parents with the YSU PBL, and a
# 250 m child with the PBL off and WRF's 3-D Smagorinsky closure (km_opt = 3).
#
# This is the shipped example of the per-domain turbulence row -- "a PBL
# parent may carry a PBL-off LES child".  Every LES key on d03 below is
# per-domain and importable from a WRF namelist, so the paired
# namelist.wps/namelist.input for this tree round-trip through
# `gpuwm import-namelist` to this file.
#
# PHYSICS: wsm6-ysu-mm5-noah-no-radiation-v1 -- mp_physics 6, longwave OFF,
# shortwave Dudhia (radt 1 min), no cumulus parameterization,
# sf_surface_physics 2.  Taken verbatim from gpuwm.physics_compat, so this
# file passes the prepared-forecast runner's profile guard as emitted.
# Child dx/dt derive from the parent chain and are never hand-typed
# (gpuwm/experiment.py).
#
# READ docs/public/LES.md BEFORE TRUSTING OUTPUT FROM THIS FILE.  In
# particular:
#   * the vertical grid is shared by every domain -- ArWen rejects
#     per-domain vertical keys by construction -- so the 250 m child runs
#     its 3 km grandparent's 49 levels, about 17 m at the first level and
#     ~250 m at 3 km.  Vertical resolution, not dx, is what makes this a
#     COARSE LES at the gray-zone edge rather than a canonical one;
#   * d02 at 750 m still runs the 1-D YSU PBL and is itself inside the gray
#     zone.  Treat its sub-kilometre structure as indicative;
#   * km_opt = 2 cannot be substituted here: prognostic TKE on a nest child
#     is refused until a nested prognostic-TKE domain has been run.
#
# MIXING LENGTH: d03 runs mix_isotropic = 1, and DID NOT ALWAYS.
# ---------------------------------------------------------------------------
# Every run this file's receipts record was made with mix_isotropic = 0 --
# per-axis lengths -- and that configuration is archived at
# configs/frozen/les_nest_250m_km3.toml.  The `--experiment-config-sha256
# 2a3a279b6d...` those receipts carry is the AS-RUN digest of the archived
# configuration, retrievable with `git show
# 4152fcb31:configs/les_nest_250m_km3.toml`; the archived file gained a
# radiation declaration at 1.8.8 so it would keep loading and hashes to
# 68b56f8f74... today, with no physics selector moved.  Both digests, and
# what a reproduction passes, are in configs/frozen/README.md.
# mix_isotropic was changed here on 2026-08-09 because of what 0
# reaches on a grid whose layers are much deeper than the grid is wide:
#
#   WRF hands horizontal_diffusion_w_2 the VERTICAL exchange coefficient
#   (dyn_em/module_diffusion_em.F:2998-3006, dummy spelled xkmv at :3524),
#   and with mix_isotropic = 0 smag_km both BUILDS and CAPS that coefficient
#   on the layer depth (:1890-1900): xkmv <= mix_upper_bound*dz^2/dt.  The
#   operator then differences it over dx.  Nothing in that chain compares
#   the two, so the reachable K*dt/dx^2 is mix_upper_bound*(dz_max/dx)^2 --
#   dt-invariant, because the cap carries 1/dt and the ratio carries dt.
#   An explicit Laplacian multiplies a 2dx mode by 1 - 4*K*dt/dx^2 per step:
#   past 1/4 the sign flips, past 1/2 the mode GROWS.
#
#   On this tree, at dz_max = 662.4 m off the shared 49-level ladder:
#       d01  3000 m  km_opt 4                   not exposed
#       d02   750 m  km_opt 4                   not exposed
#       d03   250 m  km_opt 3   ratio 0.702     2.8x the limit
#
# 0.702 is the WORST case the cap admits, not a number this flow is required
# to reach, and the runs behind the receipts completed at it.  The same
# criterion read 4.23 on a 100 m tornado child, which aborted at step 5467
# with w = 239 m/s, bit-identically across three reproductions.  The remedy
# ruled on there is the remedy applied here: mix_isotropic = 1 builds one
# length from (dx*dy*dz)^(1/3) and caps the vertical coefficient against the
# horizontal one, so what the horizontal operator receives is bounded by the
# spacing it differences over.  Config-only, and the standard LES choice for
# this geometry.
#
# WHAT THAT COSTS, STATED: this is a different answer, not a free repair.
# The child mixes differently, mix_isotropic is inside the RunConfig restart
# fingerprint (gpuwm/io/restart.py configuration_sha256), so no checkpoint
# crosses the change, and NO SCORED RUN OF THIS FILE EXISTS YET -- every
# published number for this tree (docs/public/LES.md section 2, the gray-zone
# campaign) was measured on the archived bytes and says so.
# ---------------------------------------------------------------------------
#
# The `[fetch]` block at the end names the HRRR cycle this tree was built
# and measured against.  Point it at another cycle and the geometry still
# holds; the receipts in docs/superpowers/receipts/les/ do not.
