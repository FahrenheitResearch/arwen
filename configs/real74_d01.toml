# April 3, 1974 full-physics d01 acceptance case.
# Paths are owned by the registered real74_d01 case module; this file carries
# only the frozen RunConfig surface accepted by gpuwm static/ingest/run.

[grid]
nx = 250
ny = 200
nz = 49
dx = 12000.0
dy = 12000.0
ztop = 20000.0
hybrid_opt = 2
etac = 0.2
terrain_opt = 1
map_proj = 1

[dynamics]
# Reference emdiv (Registry default 0.01; ratified 2026-07-16
# with the native-dt=60 configuration).
emdiv = 0.01
# Reference hypsometric_opt=2 (Registry default; A/B-ratified 2026-07-16).
hypsometric_opt = 2
time_step_sound = 4
epssm = 0.5
moist = true
mp_physics = 10
moist_adv_opt = 1
base_temp = 290.0
specified = true
spec_bdy_width = 5
spec_zone = 1
relax_zone = 4
km_opt = 4
c_s = 0.25
diff_6th_opt = 2
diff_6th_factor = 0.12
# Reference namelist diff_6th_slopeopt=1 (terrain-slope taper); the
# Registry-default diff_6th_thresh=0.10 is carried by the RunConfig default.
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
# WRF Registry-default h_sca_adv_order (5): rhs_ph geopotential advection
# runs the 5th/6th-order stencil with the specified-BC narrowing.
h_sca_adv_order = 5
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
ra_physics = 4
cu_physics = 1
radt = 12.0
cudt_minutes = 5.0
bldt = 0.0

[run]
case = "real74_d01"
dt = 60.0
run_seconds = 43200.0
output_interval_s = 3600.0
