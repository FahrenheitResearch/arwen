# RRFS convection-permitting -- 3 km in, 3 km out, no interpolation ladder.
#
# SOURCE      rrfs (RRFS operational 3 km CONUS), no credentials.  RRFS's
#             wrfprs analogue is a PAIR: prslev carries the upper air and
#             2dfld carries every surface, soil and terrain record, so both
#             products are fetched and both are passed per valid time.
#             Only the 00/06/12/18Z cycles publish the hourly pair.
# COST        the pair runs about 0.84 GiB per valid time on the wire
#             (measured: 2.52 GiB for the three times below, 3 m 29 s),
#             and preparation's HOST RAM tracks THE NUMBER OF FORCING
#             TIMES, not the size of your domain: three times measured
#             31.5 GiB of peak RSS on this 3 km domain, two measured
#             26.3 GiB on a 12 km one.  Three valid times is what this
#             file asks for, and that is a deliberate ceiling: widening
#             the domain is cheap here, lengthening the window is not, and
#             a 32 GB host has no room for a fourth.
# DOMAIN      one 3 km Lambert domain, 300 x 250 x 49 (900 x 750 km,
#             centred on the central United States), 2 forecast hours from
#             the f000 analysis through f002, at the source's own spacing.
# PHYSICS     morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1 -- RRFS's own
#             computed default (`gpuwm run-plan --physics-profiles`) and
#             the only suite on its admissible list carrying wrf-verified
#             status -- with ONE deliberate change: cu_physics = 0.  At
#             3 km deep convection is resolved by the dynamics, so leaving
#             the Kain-Fritsch parameterization on would count its heating
#             and rainfall twice.  Both radiation streams still run.
# SIZED FOR   a 10 GiB card: forecast peak envelope 7.29 GiB against the
#             8.75 GiB budget `gpuwm domain --vram-gib 10` prices a 10 GiB
#             card at, 1.46 GiB of headroom.  That is the Windows/WDDM
#             accounting; the same configuration prices at 5.78 GiB under
#             the Linux one.  The wizard fits 342 x 272 on the same card;
#             this grid keeps margin for a desktop that is also driving a
#             display.
# MEASURED    device residency of the forecast process peaked at 5.18 GiB,
#             inside both envelopes.  Preparation 103.5 s and 31.5 GiB
#             peak host RSS; forecast 227.9 s (480 steps); render 19.5 s
#             for 576 PNGs, 192 products across 3 frames.  RTX 5070 Ti
#             16 GiB / Linux, sharing the card with other work, so the
#             walls are an upper bound.
#
# RUN IT
#   gpuwm fetch --source rrfs --cycle <YYYY-MM-DDT{00,06,12,18}> --hours 2 \
#       --out data/rrfs
#
#   RRFS initialises from the PAIR, so every valid time contributes BOTH
#   of its files as an --input.  The fetched inputs.txt lists the prslev
#   half alone (the product the registry row marks primary); passing that
#   list on its own refuses with "mapped frame ... lacks required fields
#   ['air_temperature_2m', ... 'volumetric_soil_moisture']", because those
#   nine fields live in 2dfld.
#
#   gpuwm prep --source rrfs \
#       --input data/rrfs/rrfs.tHHz.prslev.3km.f000.conus.grib2 \
#       --input data/rrfs/rrfs.tHHz.2dfld.3km.f000.conus.grib2 \
#       --input data/rrfs/rrfs.tHHz.prslev.3km.f001.conus.grib2 \
#       --input data/rrfs/rrfs.tHHz.2dfld.3km.f001.conus.grib2 \
#       --input data/rrfs/rrfs.tHHz.prslev.3km.f002.conus.grib2 \
#       --input data/rrfs/rrfs.tHHz.2dfld.3km.f002.conus.grib2 \
#       --supplement rrfs_prslev_2dfld_in_band_surface=data/rrfs/rrfs.tHHz.2dfld.3km.f000.conus.grib2 \
#       --supplement rrfs_prslev_2dfld_in_band_surface=data/rrfs/rrfs.tHHz.2dfld.3km.f001.conus.grib2 \
#       --supplement rrfs_prslev_2dfld_in_band_surface=data/rrfs/rrfs.tHHz.2dfld.3km.f002.conus.grib2 \
#       --experiment-config configs/rrfs_conus_convective_3km.toml \
#       --wps-namelist configs/rrfs_conus_convective_3km.namelist.wps \
#       --geog-root <WPS_GEOG> --output-root out/rrfs-convective-prepared
#   gpuwm sim out/rrfs-convective-prepared \
#       --experiment-config configs/rrfs_conus_convective_3km.toml \
#       --wps-namelist configs/rrfs_conus_convective_3km.namelist.wps \
#       --outdir out/rrfs-convective
#   gpuwm render out/rrfs-convective/wrfout/<frame> --out out/rrfs-convective/png
#
# `start_time` below is the cycle you fetched.  Change both it and the
# namelist's start_date/end_date together when you move to another cycle;
# the operational bucket keeps only the last several days.

[experiment]
name = "rrfs_conus_convective_3km"
start_time = 2026-08-20T12:00:00
run_seconds = 7200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 28.5
truelat2 = 48.5
stand_lon = -97.5

[shared]
nz = 49
ztop = 20000.0
# RRFS's prslev ladder reaches 2 hPa on every mapped field, so a 100 hPa
# model top sits far inside the source column and no level is extrapolated.
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 300
ny = 250
time_step = 15
dx = 3000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror
# `gpuwm fetch` flags.
[fetch]
source = "rrfs"
cycle = "2026-08-20T12"
hours = 2
out = "data/rrfs"
cadence = 1
