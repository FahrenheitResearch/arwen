# The HRRR pressure-level demo at the largest grid a 10 GiB card fits: one
# 192 x 152 x 49 domain at 3 km (576 x 456 km) centred on central Oklahoma,
# three forecast hours from the 00Z cycle, hourly output.  It is the
# useful-resolution sibling of hrrr_prs_demo.toml, and it initialises 1:1
# with HRRR's own 3 km grid -- the pressure-level analysis is smoother near
# sharp terrain than the native hybrid levels, which is the whole reason
# this route exists beside `--source hrrr`.
#
# source: hrrr-prs (the public wrfprs product, packaged mapped profile).
# Three commands run it, and the fetch writes the middle one for you:
#   gpuwm fetch --source hrrr-prs --cycle ... --hours 3 --out DATA
#   gpuwm prep --source hrrr-prs --input-list DATA/inputs.txt ...
#       --experiment-config THIS --wps-namelist THIS.namelist.wps
#       --output-root DIR     (DATA/prep-command.txt is runnable as written)
#   gpuwm sim DIR --experiment-config THIS
#       --wps-namelist THIS.namelist.wps --outdir OUT
#
# sized for a 10 GiB card: emitted by `gpuwm domain --vram-gib 10 --source
# hrrr-prs --root-dx 3 --physics-profile
# thompson-mp8-ysu-mm5-noah-rrtmg-legacy-v1`, forecast peak envelope
# 8.30 GiB against that card's 8.75 GiB budget -- 0.45 GiB of headroom.
# measured peak VRAM: 6.33 GiB held by the forecast process, sampled once a
# second on an RTX 5070 Ti under Linux (three repeat runs read 6460, 6486
# and 6490 MiB, so the sampler's own spread is about 30 MiB).
# measured wall time: fetch 223 s (795 MB, four whole wrfprs files),
# prepare 66 s, forecast 58 s for 720 steps on a warm kernel cache (104 s
# on the cold one, the extra being the one-time NVRTC compile), render 18 s
# for 768 product PNGs across the four frames.
#
# The wizard's own default suite for this source is Morrison + RTE+RRTMGP
# with Kain-Fritsch, and at 3 km that prints a cumulus advisory rather than
# a refusal.  This file takes the Thompson + legacy-RRTMG suite instead,
# because that one carries cu_physics = 0 -- the right answer at
# convection-permitting spacing -- and because it is the one suite
# admissible on BOTH hrrr and hrrr-prs, so the two demos differ in their
# source and in nothing else.
# NOCTURNALLY VALID: longwave and shortwave both run.

[experiment]
name = "hrrr_prs_3km_demo"
start_time = 2026-08-20T00:00:00
run_seconds = 10800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 35.3
ref_lon = -97.5
truelat1 = 25.3
truelat2 = 45.3
stand_lon = -97.5

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 8
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 190
ny = 152
time_step = 15
dx = 3000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror `gpuwm fetch` flags.
[fetch]
source = "hrrr-prs"
cycle = "2026-08-20T00"
hours = 3
out = "data/hrrr_prs_3km_demo"
cadence = 1
