# gpuwm experiment translated from WRF namelists by `gpuwm import-namelist`
# (namelist.wps + namelist.input).  WRF staggered e_we/e_sn/e_vert convert
# to gpuwm mass dimensions nx/ny/nz (one fewer point).  Child dx/dt are NEVER
# written: gpuwm/experiment.py derives them exactly from the parent chain
# (the namelist chain is authoritative).
# Dedicated NSSL-2 (mp_physics=18) 1974 validation geometry.  The case-data
# paths name the exact CPU 500 m WPS/real authority from
# wrf_cpu_thompson_500m_19740403_20260721_123510.  The production launcher
# requires their registered SHA-256 pins and rejects any 333 m derivation.
# Physics substitutions (ratified, never silent):
#   mp_physics 18 (NSSL 2-moment)
#   bl_pbl_physics 11 (Shin-Hong) -> bl_pbl_physics 1 (YSU)
#   ra_lw_physics/ra_sw_physics 4 (RRTMG) -> ra_physics 4 (RTE+RRTMGP)

[experiment]
name = "real74_nssl2_4dom_500m"
start_time = 1974-04-03T12:00:00
run_seconds = 43200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
# One uninterrupted validation trajectory; no main-run checkpoints/restarts.
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 39.6848
ref_lon = -83.9297
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -83.9297

[shared]
# WRF e_vert = 50 staggered full levels -> nz = 49 mass levels.
nz = 49
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
top_lid = false
moist = true
moist_cq = true
mp_physics = 18
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
ra_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v1"
bldt = 0.0

[[domain]]
# WRF e_we = 251, e_sn = 201 (staggered) -> mass dimensions.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 250
ny = 200
time_step = 60
dx = 12000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

[[domain]]
# WRF e_we = 501, e_sn = 401 (staggered) -> mass dimensions.
grid_id = 2
parent_id = 1
i_parent_start = 63
j_parent_start = 51
parent_grid_ratio = 4
parent_time_step_ratio = 4
nx = 500
ny = 400
specified = false
nested = true
history_interval_s = 3600.0
epssm = 0.1
radt = 3.0
cu_physics = 0
diff_6th_factor = 0.1

[[domain]]
# WRF e_we = 502, e_sn = 502 (staggered) -> mass dimensions.
grid_id = 3
parent_id = 2
i_parent_start = 167
j_parent_start = 117
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 501
ny = 501
specified = false
nested = true
history_interval_s = 3600.0
epssm = 0.1
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.08

[[domain]]
# WRF e_we = 401, e_sn = 401 (staggered) -> 400x400 mass points at 500 m.
grid_id = 4
parent_id = 3
i_parent_start = 151
j_parent_start = 151
parent_grid_ratio = 2
parent_time_step_ratio = 2
nx = 400
ny = 400
specified = false
nested = true
history_interval_s = 1800.0
epssm = 0.1
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.06

[case_data]
# GPUWM runtime forcing is the complete pressure/surface ERA5 product.  The
# CPU WPS MSL/geopotential supplement remains hash-pinned by the launch input
# manifest, but is intentionally not decoded here: it is on an independent
# source grid and its only mapped fields are superseded by PSFC plus the
# declared per-domain met_em SOILHGT authority below.
forcing = [
    "${GPUWM_CASE_DATA_ROOT}/WRF_1974_500M_CPU_AUTHORITY/WPS_run/era5_19740403.grb",
]
vtable = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_500M_CPU_AUTHORITY/WPS_run/Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
wps_namelist = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_500M_CPU_AUTHORITY/config/namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_500M_CPU_AUTHORITY/static/WPS_GEOG"
# Provenance exception: the retained ERA5 GRIB lacks invariant geopotential,
# so each grid-specific 12Z WPS met_em SOILHGT is declared from the read-only
# reference bundle. Fresh cases should use the era5_z_invariant provider.
source_orography.d01 = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_500M_CPU_AUTHORITY/real_run/met_em.d01.1974-04-03_12_00_00.nc"
source_orography.d02 = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_500M_CPU_AUTHORITY/real_run/met_em.d02.1974-04-03_12_00_00.nc"
source_orography.d03 = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_500M_CPU_AUTHORITY/real_run/met_em.d03.1974-04-03_12_00_00.nc"
source_orography.d04 = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_500M_CPU_AUTHORITY/real_run/met_em.d04.1974-04-03_12_00_00.nc"
source_orography_variable = "SOILHGT"
sfcp_to_sfcp = true
co2_vmr = 330.0e-6
output_domain = 1
output_title = "gpuwm NSSL-2 April 3 1974 four-domain 500 m validation"
