# April 3 1974 d01 expressed in the Phase-5 experiment schema (Task 2).
# This is the equivalence-gate twin of configs/real74_d01.toml: the resolved
# per-domain RunConfig must equal the frozen profile's phase3_config() (pinned
# by tests/test_case_data.py), and the controller A/B requires
# `gpuwm run configs/real74_d01_exp.toml` to produce wrfouts BITWISE-identical
# to the frozen legacy-path run.  Every formerly implicit path/time/policy of
# the runtime is declared in [case_data].

[experiment]
name = "real74_d01_exp"
start_time = 1974-04-03T12:00:00
run_seconds = 43200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 39.6848
ref_lon = -83.9297
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -83.9297

[shared]
# WRF e_vert = 50 staggered full levels -> nz = 49 mass levels.
nz = 49
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
moist = true
mp_physics = 10
moist_adv_opt = 1
km_opt = 4
c_s = 0.25
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
ra_physics = 4
bldt = 0.0

[[domain]]
# WRF e_we = 251, e_sn = 201 (staggered) -> mass dimensions.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 250
ny = 200
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

[case_data]
# Declared inputs: the reference-bundle artifacts the frozen profile pins,
# now explicit case data (nothing bundle-shaped remains in the runtime).
forcing = [
    "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/era5_grib/era5_19740403.grb",
]
vtable = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/era5_grib/Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
wps_namelist = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/namelists/namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/static/WPS_GEOG"
# Repo-local reference-run WPS SOILHGT (the bundle's met_em SOILHGT is a
# regenerated artifact byte-equal to HGT_M; see real74_4dom.toml).
source_orography = "real74/soilhgt.d01.nc"
source_orography_variable = "SOILHGT"
sfcp_to_sfcp = true
# Declared trace-gas choice for April 1974 (the scheme's frozen default
# value, now explicit; Task 4 adds date-indexed selection).
co2_vmr = 330.0e-6
output_domain = 1
output_title = "gpuwm Phase 3 April 3 1974 d01"
