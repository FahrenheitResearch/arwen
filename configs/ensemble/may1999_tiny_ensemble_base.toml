# Tiny-domain ensemble smoke (EXPERIMENTAL): the May 3 1999 d01 case
# shrunk to a 40x32 grid and two minutes so the ensemble engine can be
# exercised end to end on one GPU in seconds.  Not a science config.
# Derived from configs/may1999_d01_smoke.toml.
#
# May 3 1999 ARC-A second-case smoke.  This case deliberately reuses the
# established d01 grid and vertical coordinate while declaring independent
# ERA5 meteorology.  gpuwm's experiment schema represents UTC as an
# offset-free TOML datetime, so the start below is 1999-05-03T12:00:00Z.

[experiment]
name = "may1999_tiny_ensemble_base"
start_time = 1999-05-03T12:00:00
run_seconds = 120.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 60.0

[projection]
# Same d01 Lambert grid as the established real-data configuration.  This
# gate varies the case and its declared inputs, not the grid.
map_proj = "lambert"
ref_lat = 39.6848
ref_lon = -83.9297
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -83.9297

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
moist = true
mp_physics = 10
moist_adv_opt = 1
km_opt = 4
c_s = 0.25
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
ra_physics = 4
bldt = 0.0

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 40
ny = 32
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 60.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

[case_data]
# Staged CDS ERA5 is read-only.  T3's native-GRIB1 route consumes these two
# files directly through the ERA5 Vtable; retrieve.py/retrieve.log and
# SHA256SUMS.txt beside them are included automatically in run provenance.
forcing = [
    "${GPUWM_CASE_DATA_ROOT}/ERA5_may1999_case_data/era5_may1999_pl.grib",
    "${GPUWM_CASE_DATA_ROOT}/ERA5_may1999_case_data/era5_may1999_sl.grib",
]
vtable = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/era5_grib/Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
# The config-driven Lambert grid above is authoritative.  The WPS declaration
# supplies only the generic d01 `default` geography-resolution selector.
wps_namelist = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/namelists/namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/static/WPS_GEOG"
# No source_orography artifact: T4's era5_z_invariant provider reads SOILGEO
# (invariant geopotential) from the staged single-level GRIB.
sfcp_to_sfcp = true
# No co2_vmr override: T4's date-indexed NOAA table selects 367.80 ppm for
# 1999.  The frozen test pins that documented choice.
output_domain = 1
output_title = "gpuwm May 3 1999 tiny ensemble member"
