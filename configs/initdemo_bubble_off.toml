# Bubble demo, CONTROL arm: identical to the ON arm except the
# [perturbation] block is absent.
# Emitted by `gpuwm domain` -- point 38.5,-99.5, ladder 3-1 km.
# PHYSICS: wsm6-ysu-mm5-noah-no-radiation-v1: mp_physics 6, longwave OFF, shortwave Dudhia (radt 1 min), NO cumulus parameterization, bl_pbl_physics 1, sf_surface_physics 2.
# Taken verbatim from gpuwm.physics_compat, so this file passes the prepared-
# forecast runner's profile guard as emitted.  Child dx/dt derive exactly from
# the parent chain and are never hand-typed (gpuwm/experiment.py).

[experiment]
name = "initdemo"
start_time = 2026-08-06T18:00:00
run_seconds = 7200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# JUSTIFY constant-downward-longwave-v1: the initial-perturbation
# DEMONSTRATION pair.  Its only measurement is the difference between
# this arm and initdemo_bubble_on.toml, which share every switch except
# the perturbation, so the surface energy budget cancels out of the
# comparison entirely.  Downward longwave is a declared 300 W m-2
# constant here and it is identical in both arms by construction.
acknowledgements = ["constant-downward-longwave-v1"]

[projection]
