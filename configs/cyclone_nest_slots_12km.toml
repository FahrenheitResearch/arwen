# CYCLONE NEST SLOTS -- three dormant nests that open themselves on a
# pressure minimum, ride it, and close when it fills.
#
# This is the shape a tropical basin needs and the shape the vocabulary
# could not express until the pressure trigger existed.  Rotation and
# echo are MAXIMA; a cyclone is a MINIMUM, so `[relocation.follow]` could
# ride a vortex all day and nothing in the config could decide to OPEN a
# nest on one.  Every trigger in this file is the same signal, used three
# ways:
#
#   spawn   a low deep enough to be worth 4 km -> a nest is born ON it
#   follow  the nest rides that low as it moves
#   retire  the low fills -> the slot closes and can serve another storm
#
# WHY THREE SLOTS.  A basin has more than one storm and they do not take
# turns.  Each slot is declared in full, so the memory plan prices all
# three from t = 0 and none of them integrates anything until its trigger
# fires -- that reservation is what makes VRAM deterministic and lets
# preflight refuse honestly before a single step runs.  The exclusion
# rule keeps them apart: a watch IGNORES signal inside another live
# nest's footprint, and two triggers crossing at one boundary cannot
# claim one storm (gpuwm.core.nest_spawn.SpawnController.evaluate_all).
#
# WHY THE SURFACES ARE 850 hPa AND NOT SEA LEVEL.  MSLP is a REDUCTION --
# below ground it is an extrapolation through a fictitious column, so an
# island in the footprint injects a terrain signal into the field that
# decides where the nest goes -- and its threshold is an ABSOLUTE hPa
# ceiling, which matches every cell or none as the storm deepens.  The
# 850 hPa geopotential height is a prognostic surface, and the threshold
# on it is RELATIVE: metres of height above the search box's own minimum.
# That is self-calibrating, so the same number means the same thing in
# the deep tropics and in a cold airmass, and it does not have to be
# re-tuned per basin or per season.  `level_hpa = 0` is still there and
# is the sea-level form; it is the one whose threshold is in hPa, and the
# two threshold bands are disjoint so a config that means one and would
# be read as the other refuses at load rather than tracking the wrong
# thing.
#
# THE NUMBERS, and what each one is measured in:
#
#   spawn  threshold = 25.0 m   how deep a slice of the core counts as
#                               the vortex.  20-60 m is a tropical
#                               cyclone inner core.  The watch fires only
#                               when the search box's own signal SPAN
#                               reaches this -- under a relative
#                               threshold some cell always qualifies, so
#                               the span is what distinguishes "there is
#                               a vortex here" from "the box is flat".
#          radius_km = 60.0     how far from the height minimum the
#                               centroid may draw.  A tropical cyclone's
#                               core is 20-100 km; the default is 50.
#   retire threshold = 10.0 m   the vortex DEPTH under the live nest's
#                               own footprint.  Below this for
#                               sustained_s continuously, the storm has
#                               filled and the slot closes.
#          min_lifetime_s       6 h.  A newborn nest spins up its own
#                               convection; retiring it on the field
#                               before that is retiring it on its own
#                               initialization.
#   rearm  cooldown_s           6 h of slot downtime before it may take
#                               another storm, and two firings apiece.
#
# THE CADENCES.  With no tree-level `[relocation]` table the spawn-leg
# length is the ROOT's history interval -- 3600 s here -- so every
# spawn/retire/re-arm decision lands on an hourly mark.  Each follower
# owns its own `cadence_seconds` (900 s) and is consulted inside the leg,
# so a nest tracks its storm four times an hour while the tree itself is
# reconsidered once.  A slot waiting out a cooldown costs no boundary at
# all until the cooldown expires (docs/nest-lifecycle.md, "Cost over a
# long forecast").
#
# THE DOMAIN is deliberately a plain open-ocean box: this file
# demonstrates a CONFIG SHAPE, and the shape is the same wherever it is
# pointed.  Move `[projection]` and `[fetch]` together for another basin.
#
# PHYSICS: morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1: mp_physics 10,
# longwave RTE+RRTMGP, shortwave RTE+RRTMGP (radt 12 min), Kain-Fritsch
# cumulus on the parent only, bl_pbl_physics 1, sf_surface_physics 2.
# Taken verbatim from gpuwm.physics_compat so this file passes the
# prepared-forecast runner's profile guard as written.  Child dx/dt
# derive from the parent chain and are never hand-typed.

[experiment]
name = "cyclone_nest_slots_12km"
start_time = 2026-08-20T12:00:00
run_seconds = 172800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 21600.0

[projection]
map_proj = "lambert"
ref_lat = 22.0
ref_lon = -60.0
truelat1 = 12.0
truelat2 = 32.0
stand_lon = -60.0

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

# The parent: 200 x 160 at 12 km, 2400 x 1920 km of open basin.  Its
# history interval is also the spawn-leg length, so every lifecycle
# decision below lands on an hourly mark.
[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 200
ny = 160
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# SLOT A -- the western third of the basin.
#
# i_parent_start/j_parent_start are a PLACEHOLDER: a field trigger
# chooses its own placement from the centroid it finds, and this position
# only prices the plan and anchors the default search box.  With a
# per-domain `follow` block that box is the declared footprint plus the
# follower's own `search_margin_cells`, so the three slots watch three
# overlapping thirds of the basin rather than all staring at the same
# storm.  Every fired placement is re-checked against the
# spec_bdy_width + blend_width = 10 row edge clearance a declared one
# passes.
[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 35
j_parent_start = 60
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 120
ny = 120
specified = false
nested = true
history_interval_s = 1800.0
epssm = 0.5
radt = 4.0
cu_physics = 0
diff_6th_factor = 0.1
spawn = { trigger = "pressure", threshold = 25.0, level_hpa = 850.0, radius_km = 60.0, earliest_s = 10800.0, latest_s = 151200.0 }
retire = { trigger = "pressure", threshold = 10.0, level_hpa = 850.0, sustained_s = 7200.0, min_lifetime_s = 21600.0 }
rearm = { max_firings = 2, cooldown_s = 21600.0 }
follow = { field = "pressure", threshold = 25.0, level_hpa = 850.0, radius_km = 60.0, search_margin_cells = 20, min_shift_cells = 2, max_shift_cells = 8, cooldown_seconds = 3600.0, cadence_seconds = 900.0, max_move_parent_cells = 8, min_overlap_fraction = 0.7 }

# SLOT B -- the middle third.
[[domain]]
grid_id = 3
parent_id = 1
i_parent_start = 85
j_parent_start = 45
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 120
ny = 120
specified = false
nested = true
history_interval_s = 1800.0
epssm = 0.5
radt = 4.0
cu_physics = 0
diff_6th_factor = 0.1
spawn = { trigger = "pressure", threshold = 25.0, level_hpa = 850.0, radius_km = 60.0, earliest_s = 10800.0, latest_s = 151200.0 }
retire = { trigger = "pressure", threshold = 10.0, level_hpa = 850.0, sustained_s = 7200.0, min_lifetime_s = 21600.0 }
rearm = { max_firings = 2, cooldown_s = 21600.0 }
follow = { field = "pressure", threshold = 25.0, level_hpa = 850.0, radius_km = 60.0, search_margin_cells = 20, min_shift_cells = 2, max_shift_cells = 8, cooldown_seconds = 3600.0, cadence_seconds = 900.0, max_move_parent_cells = 8, min_overlap_fraction = 0.7 }

# SLOT C -- the eastern third, where a storm entering the basin is first
# resolvable.  Its window opens with the others; the exclusion rule, not
# the window, is what keeps three slots off one storm.
[[domain]]
grid_id = 4
parent_id = 1
i_parent_start = 135
j_parent_start = 60
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 120
ny = 120
specified = false
nested = true
history_interval_s = 1800.0
epssm = 0.5
radt = 4.0
cu_physics = 0
diff_6th_factor = 0.1
spawn = { trigger = "pressure", threshold = 25.0, level_hpa = 850.0, radius_km = 60.0, earliest_s = 10800.0, latest_s = 151200.0 }
retire = { trigger = "pressure", threshold = 10.0, level_hpa = 850.0, sustained_s = 7200.0, min_lifetime_s = 21600.0 }
rearm = { max_firings = 2, cooldown_s = 21600.0 }
follow = { field = "pressure", threshold = 25.0, level_hpa = 850.0, radius_km = 60.0, search_margin_cells = 20, min_shift_cells = 2, max_shift_cells = 8, cooldown_seconds = 3600.0, cadence_seconds = 900.0, max_move_parent_cells = 8, min_overlap_fraction = 0.7 }

# Advisory data-acquisition hints (validated, not executed); keys mirror
# `gpuwm fetch` flags.
[fetch]
source = "gfs"
cycle = "2026-08-20T12"
hours = 48
area = "8.0,-76.0,36.0,-44.0"
out = "data/gfs-cyclone-basin"
cadence = 3
