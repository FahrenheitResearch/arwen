# Controller-run N2a/N2b scaffold. This is intentionally a verification-case
# config, not a production [[domain]] experiment: production loading rejects
# ratio-1 children because they are not refinements.  The N2 identity oracle
# needs exactly the opposite -- coincident parent/child grids and clocks.

[identity_nest]
case = "wk82"
nx = 48
ny = 48
nz = 30
dx = 1000.0
dt = 6.0
ztop = 20000.0
run_seconds = 60.0
history_interval_s = 30.0
parent_grid_ratio = 1
parent_time_step_ratio = 1

[identity_nest.n2a]
moist = false
mp_physics = 0

[identity_nest.n2b]
moist = true
mp_physics = 10

[identity_nest.n2c]
parent_nx = 168
parent_ny = 168
child_nx = 120
child_ny = 120
nz = 60
dx = 1000.0
dt = 6.0
ztop = 20000.0
run_seconds = 7200.0
history_interval_s = 600.0
parent_grid_ratio = 3
parent_time_step_ratio = 3
i_parent_start = 85
j_parent_start = 45
moist = true
mp_physics = 10
# WRF em_quarter_ss uses six acoustic steps on every nest level.  The 333 m
# child/uniform companion also carries the vertical-CFL limiter and the same
# 0.06 sixth-order factor as the proven real74 333 m domain; the 1 km parent
# retains the WK82 0.12 factor.  Parent/child dynamics steps remain 6/2 s.
time_step_sound = 6
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
diff_6th_opt = 2
parent_diff_6th_factor = 0.12
fine_diff_6th_factor = 0.06
