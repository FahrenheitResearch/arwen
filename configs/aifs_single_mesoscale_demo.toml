# AIFS single, 12 km mesoscale -- the widest single 12 km domain a
# 10 GiB BUDGET holds, driven by ECMWF's AI forecast.
# One 12 km Lambert domain, 344 x 274 cells (4128 x 3288 km), twelve
# forecast hours off one cycle, thirteen hourly history frames.  This
# is the size `gpuwm domain --vram-gib 10` fits to a 10 GiB budget, so
# it is the large half of the pair: it wants that whole budget with
# nothing else in it.
#
# READ THE BUDGET, NOT A CARD.  Every number below was taken on a
# 16 GiB RTX 5070 Ti under a COMPUTED 10 GiB budget (`--vram-gib 10`).
# No 10 GiB card was involved.  The budget is what was gated against
# and the budget is what the headroom below is relative to; whether a
# real 10 GiB card behaves identically at this size is not something
# this file has measured.
#
# SOURCE    aifs -- ECMWF AIFS single, 0.25 degree open data
#           (CC-BY-4.0), no credentials and no account.  One GRIB2
#           object per six-hourly step carries the 13-level pressure
#           state, the surface/2 m/10 m fields and a two-layer
#           ordinal soil column; the land mask and surface
#           geopotential ride the 0 h file alone, which the fetch
#           route binds as the in-band surface supplement.
# BUDGET    a COMPUTED 10 GiB budget, not a 10 GiB card.
#           `gpuwm check --vram-gib 10`: estimate 5.05 GiB, forecast
#           peak envelope 6.78 GiB, reserve 1.88 GiB, budget
#           8.12 GiB -- PASS.
# MEASURED  peak device residency 5.80 GiB, sampled at 5 Hz over
#           the run's own process tree, so 4.20 GiB of the 10 GiB
#           BUDGET is left over.  prep 28 s, forecast 884 s, render
#           65 s, 13 history frames, 52 product images.
#           RTX 5070 Ti 16 GiB / Linux, gpuwm 2.5.1.  Walls are
#           whole front-door commands, start-up included; a card
#           with no compiled-kernel cache adds about half a minute
#           to the forecast the first time.
# OUTCOME   the one real-card replay of this file ended rc 1.  All
#           thirteen history frames wrote and the products rendered;
#           the non-zero status came afterwards, from the
#           runtime-identity check, not from the forecast failing to
#           integrate.  So the sizing and wall numbers above are what
#           that run actually did, and "it runs clean end to end" is
#           NOT a claim this file makes.  Treat a green run of it as
#           unproven until someone re-runs it and records rc 0 here.
# PHYSICS   morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1, the suite
#           `gpuwm run-plan --physics-profiles` reports as this
#           source's own default.  Both radiation streams run, so
#           the window may cross local night.
# CYCLE     The dates here name the cycle this file was measured on.
#           ECMWF's open-data window is about three days deep -- the
#           2026-08-17 12Z object was already a 404 on 2026-08-20 --
#           so move [experiment].start_time and the companion
#           namelist.wps dates onto a cycle inside the live window.
# WINTER    AIFS publishes no snow state and no sea-ice fraction, so a
#           run from it starts bare-ground and open-water everywhere.
#           A winter or polar case should not initialise here.
#
# RUN, four commands, from the repository root.  $GEOG is a WPS_GEOG
# root and $OUT is anywhere you want the run to land.
#
#   1. gpuwm fetch --source aifs --cycle 2026-08-20T00 --hours 12
#        --out data/aifs
#      This writes data/aifs/prep-command.txt with step 2's
#      --input-list and --supplement already bound to the files it
#      downloaded; the four arguments below are the ones it leaves to
#      you.
#
#   2. gpuwm prep --source aifs   ...the bound half from step 1...
#        --wps-namelist configs/aifs_single_mesoscale_demo.namelist.wps
#        --experiment-config configs/aifs_single_mesoscale_demo.toml
#        --geog-root $GEOG --output-root $OUT/prepared
#
#   3. gpuwm sim $OUT/prepared
#        --experiment-config configs/aifs_single_mesoscale_demo.toml
#        --wps-namelist configs/aifs_single_mesoscale_demo.namelist.wps
#        --outdir $OUT/run
#
#   4. gpuwm render --engine rust --timeidx all --layout nested
#        --products 2m_temperature,10m_wind_speed_and_direction,mslp_10m_winds,composite_reflectivity
#        --out $OUT/png $OUT/run/<run-stamp>/wrfout/*
#
# No decoder-tool flag is needed at any step: the measurements above
# were taken with none passed.

[experiment]
name = "aifs_single_mesoscale_demo"
start_time = 2026-08-20T00:00:00
run_seconds = 43200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 40.0
ref_lon = -92.5
truelat1 = 30.0
truelat2 = 50.0
stand_lon = -92.5

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 344
ny = 274
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror `gpuwm fetch` flags.
[fetch]
source = "aifs"
cycle = "2026-08-20T00"
hours = 12
out = "data/aifs"
cadence = 6
