# ECMWF IFS open data at 12 km over Europe -- one Lambert domain, 344 x 274 x
# 49 (4128 x 3288 km) centred on 50.0N 10.0E, six forecast hours from a 06Z
# oper cycle at the source's own 3 h boundary cadence, hourly history.  This is
# the largest single 12 km domain the fit gate admits on a 10 GiB card.
#
#   source     ecmwf-open-data -- ECMWF IFS open data 0.25 degree (CC-BY-4.0),
#              no credentials; about 135 MiB per three-hourly step
#   sized for  a 10 GiB card.  `gpuwm check configs/ecmwf_oper_12km_10gib.toml
#              --vram-gib 10 --budget-gib 8.75` prices the forecast at an
#              8.29 GiB peak envelope inside the 9.50 GiB budget and PASSes
#              alloc_estimate_le_vram_budget.
#   measured   5.80 GiB peak device memory held by the forecast process;
#              26.6 s prepare + 8 m 21 s forecast + 1 m 04 s render; 1344
#              product PNGs from 7 history frames.  RTX 5070 Ti 16 GiB, Linux,
#              CUDA 13, card shared with other work.
#
# Run it (this source has no one-command chain; the stages are its front door):
#
#   gpuwm fetch --source ecmwf-open-data --cycle 2026-08-20T06 --hours 6 \
#       --out data/ecmwf
#   gpuwm prep --source ecmwf-open-data --input-list data/ecmwf/inputs.txt \
#       --supplement ecmwf_open_data_in_band_surface=<each fetched file> \
#       --author-input-manifest data/ecmwf/inputs.json \
#       --wps-namelist configs/ecmwf_oper_12km_10gib.namelist.wps \
#       --experiment-config configs/ecmwf_oper_12km_10gib.toml \
#       --geog-root <WPS_GEOG> --output-root out/prepared
#   gpuwm sim out/prepared \
#       --experiment-config configs/ecmwf_oper_12km_10gib.toml \
#       --wps-namelist configs/ecmwf_oper_12km_10gib.namelist.wps \
#       --outdir out/run
#   gpuwm render out/run/run-*/wrfout/wrfout_d01_* --products all --out out/png
#
# The cycle is the one these numbers were measured on.  For a current run move
# [experiment].start_time and [fetch].cycle together.
#
# Emitted by `gpuwm domain` -- point 50,10, ladder 12 km.
# PHYSICS: morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1: mp_physics 10, longwave RTE+RRTMGP, shortwave RTE+RRTMGP (radt 12 min), Kain-Fritsch cumulus, bl_pbl_physics 1, sf_surface_physics 2.
# Taken verbatim from gpuwm.physics_compat, so this file passes the prepared-
# forecast runner's profile guard as emitted.  Child dx/dt derive exactly from
# the parent chain and are never hand-typed (gpuwm/experiment.py).
# NOCTURNALLY VALID: longwave and shortwave both run, so the surface longwave
# budget stays closed through the night.

[experiment]
name = "area_50p00n_10p00e"
start_time = 2026-08-20T06:00:00
run_seconds = 21600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 50.0
ref_lon = 10.0
truelat1 = 40.0
truelat2 = 60.0
stand_lon = 10.0

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 344
ny = 274
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror `gpuwm fetch` flags.
[fetch]
source = "ecmwf-open-data"
cycle = "2026-08-20T06"
hours = 6
out = "data/ecmwf"
cadence = 3
