# NEST LIFECYCLE: one declared child slot, two episodes, on the GPU.
#
# This is the artifact proof for retire -> re-arm.  One 12 km parent runs
# for 50 model minutes; one 150x150 @ 4 km child slot is declared DORMANT
# and lives twice inside that window, with a gap between its two lives.
#
# TIME triggers throughout, on purpose.  A field trigger (uh, reflectivity)
# fires when the weather says so, which is the right answer in production
# and the wrong answer for a proof: the instant would move with the physics
# and nothing on disk could be predicted before the run.  `trigger = "time"`
# is the deterministic form the vocabulary carries for exactly this, so the
# episode boundaries below are arithmetic, and the frames they produce can
# be checked against a timetable written before the run started.
#
# THE TIMETABLE.  Retirement and re-arm are evaluated at completed
# spawn-leg boundaries, and with no [relocation] table the leg length is
# the root's own history interval -- 300 s here.  So every decision below
# lands on a 5-minute mark:
#
#   t =    0 s  parent starts alone; the child slot is reserved, integrating nothing
#   t =  300 s  spawn at_s = 300 fires          -> EPISODE 1 begins
#   t = 1200 s  retire at_s = 900 (episode age) -> EPISODE 1 ends, child detached
#   t = 1500 s  rearm cooldown_s = 300 elapsed  -> EPISODE 2 begins
#   t = 2400 s  retire at_s = 900 again         -> EPISODE 2 ends
#   t = 3000 s  run ends; parent has integrated continuously throughout
#
# WHAT THE DISK SHOULD SHOW.  The child DECLARES retire and rearm, so it
# writes d02/episode-001/wrfout_d02_* and d02/episode-002/wrfout_d02_*,
# episode-numbered from its FIRST episode.  The two sets carry disjoint
# valid times, because a slot cannot be alive twice at once.  The parent
# writes its flat wrfout_d01_* series straight through both boundaries
# with no gap: retiring a child is not an interruption of its parent.
#
# The companion one-shot config beside this one --
# nest_spawn_oneshot_20240521_4km.toml -- is the SAME geometry with the
# retire/rearm tables removed.  It must keep writing flat wrfout_d02_*
# paths.  That pair is the default-path promise stated as two runs rather
# than as a sentence.
#
# CASE.  2024-05-21 18Z, central plains, ERA5 reanalysis forcing on the
# hour.  The case is a vehicle: any forcing that reaches this domain would
# prove the same thing, because time triggers do not consult the weather.
#
# PHYSICS: two-moment Morrison (mp_physics = 10), YSU, Noah, RTE+RRTMGP,
# Kain-Fritsch on the parent only.  Two-moment is chosen deliberately:
# a newborn nest is interpolated from its live parent, and a float32
# weighted sum can land a number concentration a few units in the last
# place below zero, where the full-state health gate bounds those fields
# at zero.  Running the scheme that HAS those fields is what keeps the
# parent-SINT positive-definite fix-up exercised on the card instead of
# only in a unit test; the birth certificate reports what it clamped.
#
# restart_interval_s stays 0.  Restart with per-domain lifecycle tables is
# refused before restore (gpuwm.core.nest_lifecycle.refuse_restart_with_
# lifecycle): the checkpoint does not persist episode number, fired
# placement or retirement timers.  Checkpointing here would write files
# that cannot legally be read back.

[experiment]
name = "nest_lifecycle_20240521_4km"
start_time = 2024-05-21T18:00:00
run_seconds = 3000.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 41.3
ref_lon = -94.45
truelat1 = 31.3
truelat2 = 51.3
stand_lon = -94.45

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

# The parent.  history_interval_s = 300 does double duty: it is the frame
# cadence the evidence is read from, and -- with no [relocation] table to
# set one -- it is also the spawn-leg length, so it is the clock every
# lifecycle decision below snaps to.
[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 200
ny = 160
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 300.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# The child slot.  Declared in full so the memory plan prices it from
# t = 0, integrating nothing until the trigger fires -- and, unlike a
# one-shot spawn, able to do that twice.
#
# i_parent_start/j_parent_start are a REAL placement here, not a
# placeholder: a time trigger spawns at the DECLARED position (a field
# trigger is the one that chooses its own).  75,55 centres the 50x50
# parent-cell footprint on the parent and leaves 74 parent columns west,
# 76 east, 54 rows south and 56 north clear -- far outside the
# spec_bdy_width + blend_width = 10 row keepout the placement is
# re-checked against.  Both episodes are born at that same position,
# which is what makes the two frame series comparable.
[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 75
j_parent_start = 55
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 150
ny = 150
specified = false
nested = true
history_interval_s = 300.0
epssm = 0.5
radt = 4.0
cu_physics = 0
diff_6th_factor = 0.1
spawn = { trigger = "time", at_s = 300.0 }
retire = { trigger = "time", at_s = 900.0, min_lifetime_s = 0.0, sustained_s = 0.0 }
rearm = { max_firings = 2, cooldown_s = 300.0 }

[case_data]
forcing = ["${GPUWM_CASE_DATA_ROOT}/era5/era5-combined.grib"]
vtable = "${GPUWM_PACKAGE_ROOT}/gpuwm/data/vtables/Vtable.ERA5_CDO"
forcing_interval_s = 3600.0
wps_namelist = "nest_lifecycle_20240521_4km.namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WPS_GEOG"
sfcp_to_sfcp = true
output_domain = 1
output_title = "gpuwm nest lifecycle 2024-05-21 (two episodes)"
