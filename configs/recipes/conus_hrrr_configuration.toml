# Full-grid clone-kit HRRR configuration template.
# Run: gpuwm go configs/recipes/conus_hrrr_configuration.toml
# Fork selectors are explicit. Other settings retain the translated clone
# kit. Unported operational controls are absent from that kit, so this is
# not a complete operational-configuration equivalence claim.
# The 1797x1057x50 grid needs a qualified large or multi-card run path.
[experiment]
name = "conus-hrrr-clone-18h"
start_time = 2026-09-29T12:00:00
run_seconds = 64800.0
feedback = 1
smooth_option = 0
blend_width = 5
spec_bdy_width = 10
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 38.5
truelat2 = 38.5
stand_lon = -97.5

[shared]
aer_opt = 3
swint_opt = 1
rrtmg_cloud_optics_form = "noaa_wrf39"
# WRF e_vert = 51 staggered full levels -> nz = 50 mass levels.
nz = 50
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 1500.0
eta_levels = [
    1.0, 0.998, 0.994, 0.987, 0.975,
    0.959, 0.939, 0.916, 0.892, 0.865,
    0.835, 0.802, 0.766, 0.727, 0.685,
    0.64, 0.592, 0.542, 0.497, 0.4565,
    0.4205, 0.3877, 0.3582, 0.3317, 0.3078,
    0.2863, 0.267, 0.2496, 0.2329, 0.2188,
    0.2047, 0.1906, 0.1765, 0.1624, 0.1483,
    0.1342, 0.1201, 0.106, 0.0919, 0.0778,
    0.0657, 0.0568, 0.0486, 0.0409, 0.0337,
    0.0271, 0.0209, 0.0151, 0.0097, 0.0047,
    0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.1
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
# Adaptive time step (Registry.EM_COMMON:2269-2281).  Off unless
# the namelist asked for it; with it off every value below is
# WRF's Registry default and nothing reads them.
use_adaptive_time_step = true
step_to_output_time = true
adaptation_domain = 1
target_cfl = 1.4
target_hcfl = 0.98
max_step_increase_pct = 5
starting_time_step = 15
starting_time_step_den = 0
max_time_step = 60
max_time_step_den = 0
min_time_step = 3
min_time_step_den = 0
h_sca_adv_order = 5
smdiv = 0.1
top_lid = false
moist = true
moist_cq = false
mp_physics = 28
thompson_version = "wrf_39_noaa"
thompson_fork_snow_fall = "wrf_39_noaa"
morr_rimed_ice = 1
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 0
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
# &physics use_aero_icbc = .true. + &domains wif_input_opt = 1:
# the ported QNWFA_QNIFA_SIGMA_MONTHLY.dat climatology ingest.
# Leave wif_climatology_path unset to read the staged copy
# (`gpuwm fetch-tables --wif`, ~/.gpuwm/wif).
aer_init_opt = 1
wif_input_opt = 1
diff_6th_thresh = 0.05
moist_mix6_off = false
spec_zone = 1
relax_zone = 9
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 5
# The GSL surface layer the operational fork runs.
mynn_sfclay_variant = "gsl_wrf39"
sf_surface_physics = 3
ruc_irrigation = "wrf_45"
ruc_soilprop = "wrf_45"
ruc_snow = "wrf_45"
ruc_qvg_cold_start = "air"
ruc_2m_diagnostic = "log_profile"
rdlai2d = true
usemonalb = true
bl_pbl_physics = 5
bl_mynn_version = "gsd_41"
bl_mynn_mixlength = 2
ra_physics = 4
num_soil_layers = 9
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
bldt = 0.0

[[domain]]
# HRRR e_we = 1800, e_sn = 1060 (1799 x 1059 mass points). One row is trimmed on every side (1797 x 1057, same centre):
# the engine refuses a domain whose cell corners reach past the hrrr-prs grid it is driven from.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 1797
ny = 1057
time_step = 15
dx = 3000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 15.0
cu_physics = 0
diff_6th_factor = 0.12

[output]
# The engine's 'minimal' surface set plus REFL_10CM (composite reflectivity is drawn from it) and the fields the quick
# skill needs (T2, Q2, PSFC, U10, V10, COSALPHA, SINALPHA, RAINC, RAINNC, LANDMASK); the engine adds its structural
# fields (T, PHB, HGT, coordinates). Same list as the 2026-09-28 CONUS 3 km speed run.
history_vars = ["COSALPHA", "E", "F", "GLW", "GRAUPELNC", "GRDFLX", "HAILNC", "HFX", "ISLTYP", "IVGTYP",
    "LANDMASK", "LH", "LU_INDEX", "MAPFAC_M", "MAPFAC_U", "MAPFAC_V", "MU", "OLR", "PBLH", "PSFC", "PSIH",
    "PSIM", "Q2", "QFX", "RAINC", "RAINNC", "RAINSH", "SEAICE", "SINALPHA", "SNOW", "SNOWC", "SNOWH",
    "SNOWNC", "SWDOWN", "T2", "TH2", "TMN", "TSK", "U10", "UP_HELI_MAX", "UST", "V10", "VEGFRA", "XLAT_U",
    "XLAT_V", "XLONG_U", "XLONG_V", "REFL_10CM"]

[fetch]
source = "hrrr-prs"
cycle = "2026-09-29T12"
hours = 18
cadence = 1

[static]
source = "hrrr-conus-v4"
