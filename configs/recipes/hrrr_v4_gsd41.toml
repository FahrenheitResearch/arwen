# HRRR v4 source configuration on a trimmed 1797 x 1057 mass grid.
# This removes one outer row on each side of the 1799 x 1059 HRRR grid.
# Stage WIF, drag and lake-depth inputs.
# The GSD MYNN source version is explicit. Remaining fork rows are in docs/dev/mynn-gsd41.md.
# This grid needs a larger card than the home nodes. Do not run it there.
[experiment]
name = "hrrr-v4-fork-trimmed-configuration"
start_time = 2026-10-02T21:00:00
run_seconds = 7200.0
feedback = 1
smooth_option = 0
blend_width = 5
spec_bdy_width = 10
restart_interval_s = 0.0

[projection]
# HRRR's Lambert grid (hrrr_namelist.wps).
map_proj = "lambert"
ref_lat = 38.5
ref_lon = -97.5
truelat1 = 38.5
truelat2 = 38.5
stand_lon = -97.5

[shared]
gwd_opt = 3
topo_wind = 0
bl_mynn_mixlength = 2
bl_mynn_version = "gsd_41"
bl_mynn_gsd41_unsquared_qtke = false
bl_mynn_cloud_tendency_form = "wrf_461"
mynn_sfclay_variant = "gsl_wrf39"
scalar_pblmix = 1
alb_sol = 1
zadvect_implicit_variant = "wrf_legacy"
mosaic_lu = 1
mosaic_soil = 1
sf_lake_physics = 1
# WRF e_vert = 51 staggered levels -> nz = 50 mass levels, HRRR's own eta ladder.
nz = 50
ztop = 20000.0
# Native hybrid columns support the operational 15 hPa model top.
p_top = 1500.0
eta_levels = [
    1.0, 0.998, 0.994, 0.987, 0.975,
    0.959, 0.939, 0.916, 0.892, 0.865,
    0.835, 0.802, 0.766, 0.727, 0.685,
    0.64, 0.592, 0.542, 0.497, 0.4565,
    0.4205, 0.3877, 0.3582, 0.3317, 0.3078,
    0.2863, 0.267, 0.2496, 0.2329, 0.2188,
    0.2047, 0.1906, 0.1765, 0.1624, 0.1483,
    0.1342, 0.1201, 0.106, 0.0919, 0.0778,
    0.0657, 0.0568, 0.0486, 0.0409, 0.0337,
    0.0271, 0.0209, 0.0151, 0.0097, 0.0047,
    0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
# HRRR &dynamics
time_step_sound = 6
epssm = 0.1
emdiv = 0.01
smdiv = 0.1
hypsometric_opt = 2
h_sca_adv_order = 5
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
diff_6th_thresh = 0.05
moist_mix6_off = false
w_damping = 0
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
top_lid = false
# HRRR's implicit-explicit vertical advection (zadvect_implicit = 1); ported
# in 2.8.3 and run on the 4-card [devices] road in the smoke test.
zadvect_implicit = 1
terrain_opt = 1
map_proj = 1
# Fixed 20 s operational adaptive-clock bounds.
terrain_clock = "pinned"
use_adaptive_time_step = true
step_to_output_time = true
adaptation_domain = 1
target_cfl = 1.4
target_hcfl = 0.98
max_step_increase_pct = 5
starting_time_step = 20
starting_time_step_den = 0
max_time_step = 20
max_time_step_den = 0
min_time_step = 20
min_time_step_den = 0
# HRRR &bdy_control
spec_zone = 1
relax_zone = 9
# HRRR &physics
moist = true
moist_cq = true
mp_physics = 28
# Three-dimensional aerosol initial and boundary values come from RAP.
# (HRRR's metgrid constants_name QNWFA_QNIFA_Monthly_GFS); staged by
# `gpuwm fetch-tables --wif`.
aer_init_opt = 1
wif_input_opt = 1
use_rap_aero_icbc = true
bl_pbl_physics = 5
sf_sfclay_physics = 5
sf_surface_physics = 3
ruc_soilprop = "wrf_45"
ruc_irrigation = "wrf_45"
ruc_snow = "wrf_45"
ruc_qvg_cold_start = "air"
ruc_2m_diagnostic = "log_profile"
rdlai2d = true
usemonalb = true
num_soil_layers = 9
# ra_lw_physics = ra_sw_physics = 4, WRF's own RRTMG (legacy engine), every 15 min.
ra_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
rrtmg_cloud_optics_form = "noaa_wrf39"
aer_opt = 3
swint_opt = 1
bldt = 0.0

[[domain]]
# HRRR e_we = 1800, e_sn = 1060 (1799 x 1059 mass points); one row trimmed
# on every side, same centre.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 1797
ny = 1057
time_step = 20
dx = 3000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 15.0
cu_physics = 0
diff_6th_factor = 0.12

[fetch]
source = "rap-native"
cycle = "2026-10-02T21"
hours = 3
cadence = 3
