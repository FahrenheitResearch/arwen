# ATTEMPT #2 of the tornado-scale LES ladder.  Same case, same chain, same
# physics as attempt #1; the LES children move onto the storm corridor the
# MODEL produced instead of the one HISTORY did.
#
# READ docs/les/ATTEMPT2-EXPECTATIONS.md AND docs/les/attempt2/
# corridor-placement.json BEFORE TRUSTING ANY OUTPUT FROM THIS FILE.
# Attempt #1's own document, docs/les/ATTEMPT1-EXPECTATIONS.md, still
# describes the screens; this file changes where they are measured, not
# what they are.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS: attempt #1 succeeded and pointed somewhere else
# ---------------------------------------------------------------------------
# Attempt #1 ran both arms of its dual-run pair clean over 00Z-06Z and the
# byte comparison adjudicated PASS, bit-identical, on 112 wrfout files and
# 5053 final-state digests.  Nothing about it failed.
#
# What it produced was a MEASUREMENT, and the measurement was that the box
# was in the wrong place.  Its d04 was centred on 36.72 N 88.70 W -- six
# kilometres southwest of Mayfield, which is where the REAL storm went.  Its
# own certified d02 output puts the model's violent cells 40-90 km southwest
# of that box and one to two hours later:
#
#     02Z   UH 877 @ 36.461 N 90.046 W
#     03Z   UH 691 @ 36.897 N 89.185 W
#     04Z   UH 494 @ 36.439 N 89.398 W      (UH 506 @ 37.117 N 88.545 W)
#     05Z   UH 610 @ 36.303 N 89.204 W      (UH 594 @ 36.597 N 88.876 W)
#     06Z   UH 357 @ 36.706 N 88.375 W
#
# (2-5 km updraft helicity maxima, m2 s-2, from arm a's hourly d02 frames;
# the full table is in docs/les/attempt2/corridor-placement.json.)
#
# A 20 km box cannot be placed on a track the model does not produce.  The
# ruled flow -- run the 3 km, find the actual cell, then downscale -- is what
# this file implements.  The placement below is derived from that table and
# from nothing else; the historical track is used only as a landmark, never
# as a target.
#
# ---------------------------------------------------------------------------
# WHAT MOVED, AND WHAT DID NOT
# ---------------------------------------------------------------------------
# MOVED:
#   d03  i/j_parent_start  151,151 -> 111,127   centre 36.720 -> 36.500 N,
#                                               88.700 -> 89.154 W
#   d04  i/j_parent_start  131,131 -> 132,120   centre 36.720 -> 36.450 N,
#                                               88.700 -> 89.149 W
#   d02  history_interval_s  3600 -> 900 s
#   run_seconds              21600 -> 25200 s   (00Z -> 07Z)
#
# NOT MOVED, deliberately:
#   d01 and d02 geometry, the projection, and the reference point.  Both
#   parents already hold the whole corridor -- d02 spans 34.64-38.75 N,
#   91.33-86.07 W -- so moving them would buy nothing and would throw away
#   the prepared caches that attempt #1 built and verified.  The projection
#   reference therefore STAYS at 36.72 N 88.70 W and is now simply a
#   projection origin rather than a box centre; d03 and d04 are no longer
#   concentric on it, which is the whole point.
#
#   Every physics switch, the 73-level eta ladder, the profile, the
#   timestep law, feedback = 0, and the inflow ruling.
#
# ---------------------------------------------------------------------------
# THE INFLOW RULING, CARRIED UNCHANGED
# ---------------------------------------------------------------------------
# inflow_perturbation is ON at d03 and OFF at d04, ruled 2026-08-06 and
# recorded at e754bc77.  d02 runs YSU and diagnoses a PBLH, so the generator
# has the parent it needs for d03.  d03 is itself LES: its RESOLVED eddies
# advect through d04's inflow faces and ARE the inflow turbulence, so
# injecting synthetic perturbations on top of them would double-count, and
# the model refuses it by contract.  Nothing about re-placing the nests
# touches that argument, so nothing about it changes here.
#
# ---------------------------------------------------------------------------
# THE 100 m BOX -- still a TRANSIT box, and still 20 km wide
# ---------------------------------------------------------------------------
# d04 is 200 x 200 cells at 100 m, spanning 36.358-36.541 N, 89.263-89.035 W.
# Verified against gpuwm.static.projection on this exact geometry, using the
# same ProjectedGrid.nest registration the runner uses:
#
#   d03 clearance inside d02   110 / 190 / 126 / 174 parent rows (W/E/S/N)
#   d04 clearance inside d03   131 / 129 / 119 / 141 parent rows (W/E/S/N)
#   required                    10 parent rows (spec_bdy_width + blend_width)
#
# The storm enters d03's western half and gets ~66 km of in-domain transit
# before reaching d04's west edge -- comparable to attempt #1's 50-75 km, so
# the spin-up fetch risk registered there carries over unchanged and is
# still graded by screen E1.
#
# REGISTERED BEFORE THE RUN, and the honest limitation of this placement:
# the corridor was read off HOURLY d02 frames.  At the 13-23 m s-1 storm
# motion those frames imply, consecutive samples of one cell are 50-90 km
# apart while the box is 20 km wide, so the storm crosses the box BETWEEN
# samples and no hourly maximum need ever land inside it -- and none does.
# A straight-line interpolation between the 04Z and 05Z maxima of the
# strongest corridor cell puts it inside d04 from about 04:16Z to 04:39Z, a
# 19.3 km chord leaving through the NORTH edge.  That is an estimate from
# the crudest possible track model and it is NOT what the box was moved to
# fit; it is committed so that the 15-minute d02 frames this attempt writes
# can falsify it.  If they show the cell clipping a corner rather than
# transiting, the finding is that a fixed 20 km box needs 15-minute
# guidance to place -- which is exactly why d02's cadence changed.
#
# ---------------------------------------------------------------------------
# THE WINDOW
# ---------------------------------------------------------------------------
# 00Z -> 07Z, 25200 s, one hour longer than attempt #1.  The corridor's
# strongest crossings are 04-06Z, so the extra hour is tail past the event
# rather than more spin-up.
#
# NOT A RESTART.  The 02Z checkpoint set attempt #1 wrote cannot be used:
# gpuwm/experiment.py refuses a re-placed nest against a prepared cache
# built at the old placement, and gpuwm/io/restart.py gates the whole tree
# on one experiment fingerprint that carries i_parent_start -- so re-placing
# d03 also blocks resuming d01.  There is no per-domain restart selection
# and no supported path to cold-start a nest from its parent mid-run on the
# prepared-tree route.  Attempt #2 therefore integrates from 00Z, which
# costs about one extra hour of card per arm.  See
# docs/les/ATTEMPT2-EXPECTATIONS.md for the evidence.
#
# ---------------------------------------------------------------------------
# EVERYTHING BELOW THIS LINE IS ATTEMPT #1's, UNCHANGED EXCEPT WHERE NAMED
# ---------------------------------------------------------------------------
# The chain, the vertical grid, the physics profile, the parent/child
# turbulence split and the ingest route are all attempt #1's and are
# documented in configs/les_tornado_100m_mayfield_20211210.toml.  The
# summary: 3 km -> 1 km -> 500 m -> 100 m at ratios 3 / 2 / 5, dt =
# 15 / 5 / 2.5 / 0.5 s, nz = 72 on a stretched ladder with 33 half levels
# below 1.7 km, YSU + km_opt 4 on the parents, PBL off + km_opt 3 (3-D
# Smagorinsky) on the LES children, profile
# wsm6-ysu-mm5-noah-no-radiation-v1, HRRR 2021-12-11 00Z via the native
# front door.
[experiment]
name = "les_tornado_100m_mayfield_20211210_attempt2"
# 00Z on 2021-12-11, the HRRR analysis at the window start.  Convective
# initiation upstream follows around 02Z and Mayfield is struck near 03:27Z,
# so the LES children get roughly 3.5 h of spin-up before the storm arrives.
start_time = 2021-12-11T00:00:00
# 7 h, 00Z -> 07Z.  One hour longer than attempt #1 because the model's
# corridor crossings are 04-06Z rather than the historical 03:27Z, so the
# window needs a tail past the event rather than more spin-up.  Not a
# restart: see the header.
run_seconds = 25200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
# SET, unlike the demonstration.  Its restart_interval_s = 0.0 meant a run
# that could not be resumed had it died, and the scored receipt records that
# as a defect (nested-les-scored-2026-08-02.md:147-148).  3600 s is 240 whole
# root steps at dt = 15 s.  A 2+-domain tree is on the checkpointing route
# (gpuwm/checkpoint_routes.py:67), so this is exercised, not decorative.
restart_interval_s = 3600.0

# UNCHANGED from attempt #1, and now a projection ORIGIN rather than a box
# centre: d01 and d02 stay exactly where they were so their prepared caches
# remain reusable, while d03 and d04 move off-centre onto the corridor.
[projection]
map_proj = "lambert"
ref_lat = 36.72
ref_lon = -88.7
# The secant cone bracketing the reference latitude by +/- 10 deg, which is
# the rule gpuwm/domain_wizard.py:1580-1581 applies.
truelat1 = 26.72
truelat2 = 46.72
stand_lon = -88.7

[shared]
# 73 full levels -> nz = 72 mass levels.  Generated and scored by
# tools/build_stretched_eta_ladder.py --nz 72 --dz0 20 --dz-max 650
# --bl-top 1700 --require-below 30.  See the vertical-grid note above.
nz = 72
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.99738, 0.99463, 0.99173, 0.98868,
    0.98548, 0.98211, 0.97856, 0.97483, 0.97091,
    0.96679, 0.96246, 0.95791, 0.95313, 0.9481,
    0.94283, 0.93729, 0.93148, 0.92538, 0.91898,
    0.91227, 0.90523, 0.89785, 0.89012, 0.88202,
    0.87354, 0.86466, 0.85537, 0.84565, 0.8355,
    0.82488, 0.8138, 0.80223, 0.79016, 0.77757,
    0.76446, 0.75081, 0.7366, 0.72183, 0.70648,
    0.69055, 0.67403, 0.65692, 0.6392, 0.62088,
    0.60196, 0.58245, 0.56234, 0.54166, 0.52041,
    0.49862, 0.4763, 0.45348, 0.43021, 0.40651,
    0.38242, 0.35801, 0.33332, 0.30842, 0.28338,
    0.25826, 0.23317, 0.20817, 0.18338, 0.15888,
    0.13478, 0.1112, 0.08856, 0.06771, 0.04853,
    0.03092, 0.01477, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = false
mp_physics = 6
top_lid = true
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 0
ra_sw_physics = 1
wrf_rrtmg_compatibility = "none"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

# --- d01: 3 km, 918 x 732 km, the synoptic parent.  Holds the whole track
# from the northeast-Arkansas initiation to the Kentucky decay.
[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 306
ny = 244
time_step = 15
dx = 3000.0
specified = true
nested = false
# Hourly: the parent is context, not a subject.  Disk goes to the children.
history_interval_s = 3600.0
radt = 1.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.08

# --- d02: 1 km, 450 x 450 km, centred in d01.  Ratio 3, dt 5 s.
# 150 parent cells wide, placed so its centre is d01's centre exactly:
# i_parent_start = (306 - 450/3)/2 + 1 = 79, j = (244 - 450/3)/2 + 1 = 48.
# UNCHANGED from attempt #1.  It spans 34.639-38.746 N, 91.334-86.066 W,
# which already holds the initiation region, the whole historical track AND
# the whole model corridor, so there is nothing to gain by moving it and a
# reusable prepared cache to lose.  This is also the domain the next
# attempt's placement will be read off, now at 15-minute cadence.
[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 79
j_parent_start = 48
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 450
ny = 450
specified = false
nested = true
# 15 min, and the second reason this attempt exists.  Attempt #1 wrote d02
# hourly, and an hourly frame of a 13-23 m s-1 storm is a 50-90 km sample
# interval -- wider than the 20 km box it is supposed to be placed against.
# Every ambiguity in this file's placement derivation traces to that
# cadence.  900 s is 6-14 km of storm motion per frame, which can resolve a
# cell's track well enough to aim a 20 km box at it.
history_interval_s = 900.0
epssm = 0.5
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.1

# --- d03: 500 m, 150 x 150 km, the first LES domain.  Ratio 2, dt 2.5 s.
# 150 parent cells wide, and NO LONGER CENTRED: moved southwest onto the
# model's corridor, from (151, 151) to (111, 127) in d02's grid.  Centre
# 36.500 N 89.154 W; spans 35.809-37.185 N, 90.018-88.299 W, which holds
# every corridor cell in the 01Z-06Z table and still excludes the northeast
# Arkansas initiation region so genesis stays a parent's job.
#
# Clearance inside d02: 110 / 190 / 126 / 174 parent rows W/E/S/N against
# the 10 rows spec_bdy_width + blend_width requires
# (gpuwm/experiment.py:1604-1632).  Receipt:
# docs/les/attempt2/corridor-placement.json.
#
# Attempt #1's d03 held Princeton and Mayfield; this one holds neither
# inside d04's parentage in the same way -- Princeton and Bremen now fall
# outside d03 entirely.  That is the cost of following the model instead of
# the history, and it is deliberate.
#
# The storm ENTERS this domain from the west-southwest and gets ~66 km of
# transit inside it before reaching d04's west edge -- comparable to
# attempt #1's 50-75 km, so the spin-up fetch risk registered there carries
# over unchanged.
[[domain]]
grid_id = 3
parent_id = 2
i_parent_start = 111
j_parent_start = 127
parent_grid_ratio = 2
parent_time_step_ratio = 2
nx = 300
ny = 300
specified = false
nested = true
# 15 min: fine enough to carry the variance-profile and spectral screens
# without paying the child's cadence.
history_interval_s = 900.0
epssm = 0.5
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.1
# PBL off, resolved-turbulence closure on.
km_opt = 3
bl_pbl_physics = 0
c_s = 0.25
mix_isotropic = 0
mix_upper_bound = 0.1
isfflx = 1
# P3 inflow seeding, pilot amplitude, fixed committed seed.  Settings are the
# pilot ON arm verbatim from
# docs/superpowers/receipts/les/inflow-generator/les.km3.p3.on-7h.toml:166-169.
# The generator is opt-in and OFF by default; the D90 fetch meter runs on the
# output and the scored footprint is the fetch-clean interior only.
inflow_perturbation = true
inflow_perturbation_seed = 20211210
inflow_perturbation_amplitude_scale = 1.0
inflow_perturbation_faces = "inflow"

# --- d04: 100 m, 20 x 20 km, the tornado-scale child.  Ratio 5, dt 0.5 s.
# 40 parent cells wide, at (132, 120) in d03's grid.  Centre 36.450 N
# 89.149 W -- the ruled placement, on the corridor's 04-06Z crossings, 40 km
# southwest of attempt #1's box.  Spans 36.358-36.541 N, 89.263-89.035 W.
#
# Clearance inside d03: 131 / 129 / 119 / 141 parent rows W/E/S/N against
# the 10 required.
#
# The centre is HELD at the ruled 36.45 N 89.15 W rather than nudged onto
# the interpolated chord's midpoint (36.51 N 89.16 W, ~7 km north).  The
# hourly track model that would justify the nudge samples the storm every
# 50-90 km, which is wider than the box, so optimising against it would be
# fitting to interpolation noise.  The measured yield of the ruled centre is
# recorded in the placement receipt and is what the 15-minute frames will
# grade.
#
# Cayce KY (36.508 N 89.039 W) is inside this box.  Mayfield is not -- the
# model's storm does not go there.
[[domain]]
grid_id = 4
parent_id = 3
i_parent_start = 132
j_parent_start = 120
parent_grid_ratio = 5
parent_time_step_ratio = 5
nx = 200
ny = 200
specified = false
nested = true
# 5 min: 73 frames over the window, which is the sampling the d04
# vertical-vorticity maximum and swirling-updraft time series are graded on.
# Finer cadence is affordable in wall time but not in staged disk.
history_interval_s = 300.0
epssm = 0.5
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.1
# PBL off, resolved-turbulence closure on.
km_opt = 3
bl_pbl_physics = 0
c_s = 0.25
mix_isotropic = 0
mix_upper_bound = 0.1
isfflx = 1
# OFF on d04.  RULED 2026-08-06, after the model refused the run:
#
#   ValueError: inflow_perturbation defines its vertical extent from the
#   parent-diagnosed PBLH and therefore requires a parent running a PBL
#   scheme; parent bl_pbl_physics=0
#
# The generator exists for the mesoscale->LES handoff.  A parent running a
# PBL scheme diagnoses PBLH because it PARAMETERIZES the turbulence its
# child must spin up from nothing -- that is d02 (YSU) -> d03 exactly, and
# it is why the perturbation stays ON there.
#
# d03 -> d04 is not that case.  The parent is itself LES at 500 m: its
# RESOLVED eddies advect through d04's inflow faces and ARE the inflow
# turbulence.  Injecting synthetic perturbations on top of them would
# double-count.  The generator was never designed for a resolved-turbulence
# parent, which is precisely why its own contract demands a parent PBLH --
# the refusal is the model correctly encoding its applicability boundary,
# not an obstacle to route around.
#
# FALSIFIER, registered: the d04 D90 spin-up fetch receipt (screen E1) is
# still graded and still committed whatever it reads.  If d03 -> d04 fetch
# turns out to be insufficient -- i.e. the resolved eddies do NOT arrive
# developed -- this ruling is what attempt #2 revisits.
inflow_perturbation = false

# Advisory data-acquisition hints (validated, not executed); keys mirror
# `gpuwm fetch` flags.  `area` is the d01 footprint (33.269-39.941 N,
# 94.163-83.237 W, computed from gpuwm.static.projection) padded ~0.6 deg
# for the HRRR surface-donor margin.  forecast_start_hour 0 + hours 8 is
# f00..f08 off the 00Z cycle = 00Z through 08Z, which leaves one hour of
# boundary margin past the 07Z end of the integration.  The files are the
# ones attempt #1 already fetched (manifest 318d2ba0...); d01 did not move,
# so the same 9.6 GB serves both attempts and nothing is refetched.
[fetch]
source = "hrrr"
cycle = "2021-12-11T00"
forecast_start_hour = 0
hours = 8
area = "32.7,-94.8,40.5,-82.6"
out = "data"
