# GDAS analysis-cycle quickstart -- one 12 km Lambert domain over the central
# United States (40.0N 92.5W), 60 x 48 x 49, three hours from a 06Z cycle at
# the source's own HOURLY boundary cadence, history every 30 min.
#
#   source     gdas -- NCEP GDAS pgrb2 0.25 degree, public, no credentials.
#              f000 is an analysis rather than a forecast field, which is what
#              this source is for; the span ends at f009 and publication lags
#              the cycle by about seven hours.
#   sized for  a 10 GiB card.  `gpuwm check
#              configs/gdas_analysis_12km_quickstart.toml --vram-gib 10
#              --budget-gib 8.75` prices the forecast at a 4.51 GiB peak
#              envelope inside the 9.50 GiB budget and PASSes
#              alloc_estimate_le_vram_budget.
#   measured   2.30 GiB peak device memory held by the forecast process;
#              24.1 s prepare + 24.5 s forecast + 26.2 s render; 1344 product
#              PNGs from 7 history frames.  RTX 5070 Ti 16 GiB, Linux, CUDA 13.
#
# TWO ACQUISITION FACTS THIS CONFIGURATION DEPENDS ON, both non-default on
# `gpuwm fetch`:
#   --mode full-file    the packaged GDAS profile binds the full 33-level
#                       isobaric ladder; the default NOMADS subset transport
#                       emits the 21-level 1000..100 hPa census and `gpuwm
#                       prep` then refuses with an air_temperature vertical
#                       coverage mismatch.  Whole objects are about 500 MB per
#                       valid time.
#   --cadence 1         the profile's cadence contract is hourly; the fetch
#                       door's own default is three-hourly and `gpuwm prep`
#                       refuses a 10800 s series against a 3600 s contract.
#
#   gpuwm fetch --source gdas --cycle 2026-08-20T06 --hours 3 --cadence 1 \
#       --mode full-file --out data/gdas
#   gpuwm prep --source gdas \
#       --input data/gdas/gdas.tHHz.pgrb2.0p25.f00N   (once per f000..f003) \
#       --supplement gdas_pgrb2_in_band_surface=<each of those same files> \
#       --author-input-manifest data/gdas/inputs.json \
#       --wps-namelist configs/gdas_analysis_12km_quickstart.namelist.wps \
#       --experiment-config configs/gdas_analysis_12km_quickstart.toml \
#       --geog-root <WPS_GEOG> --output-root out/prepared
#   gpuwm sim out/prepared \
#       --experiment-config configs/gdas_analysis_12km_quickstart.toml \
#       --wps-namelist configs/gdas_analysis_12km_quickstart.namelist.wps \
#       --outdir out/run
#   gpuwm render out/run/run-*/wrfout/wrfout_d01_* --products all --out out/png
#
# The cycle is the one these numbers were measured on.  For a current run move
# [experiment].start_time and [fetch].cycle together.
#
# Emitted by `gpuwm domain` -- point 40,-92.5, ladder 12 km.
# PHYSICS: morrison-mp10-ysu-mm5-noah-kf-rte-rrtmgp-v1: mp_physics 10, longwave RTE+RRTMGP, shortwave RTE+RRTMGP (radt 12 min), Kain-Fritsch cumulus, bl_pbl_physics 1, sf_surface_physics 2.
# Taken verbatim from gpuwm.physics_compat, so this file passes the prepared-
# forecast runner's profile guard as emitted.  Child dx/dt derive exactly from
# the parent chain and are never hand-typed (gpuwm/experiment.py).
# NOCTURNALLY VALID: longwave and shortwave both run, so the surface longwave
# budget stays closed through the night.

[experiment]
name = "area_40p00n_92p50w"
start_time = 2026-08-20T06:00:00
run_seconds = 10800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 40.0
ref_lon = -92.5
truelat1 = 30.0
truelat2 = 50.0
stand_lon = -92.5

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 60
ny = 48
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 1800.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# Advisory data-acquisition hints (validated, not executed); keys mirror `gpuwm fetch` flags.
[fetch]
source = "gdas"
cycle = "2026-08-20T06"
hours = 3
area = "35.29,-98.96,44.63,-86.04"
out = "data/gdas"
cadence = 1
