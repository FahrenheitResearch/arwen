# ATTEMPT #1 of the tornado-scale LES ladder: a four-domain HRRR-initialized
# chain descending 3 km -> 1 km -> 500 m -> 100 m over the Dodge City, KS
# supercell/tornado family of 2016-05-24.
#
# THIS IS A FALSIFIER, NOT A MILESTONE.  It is staged deliberately ahead of
# P3/P5/P6 completion so that the design fails early and cheaply if it is
# going to.  Every screen it is graded against is registered BEFORE it runs,
# in docs/les/ATTEMPT1-EXPECTATIONS.md, and every one of them is committed
# whatever it reads.  No obs-skill claim is made or admissible from this run.
#
# READ docs/public/LES.md AND docs/les/ATTEMPT1-EXPECTATIONS.md BEFORE
# TRUSTING ANY OUTPUT FROM THIS FILE.
#
# ---------------------------------------------------------------------------
# THE CHAIN, AND WHY IT HAS THIS SHAPE
# ---------------------------------------------------------------------------
# `parent_time_step_ratio` is an integer, which forbids the 250 m -> 100 m
# step the shipped demonstration's geometry would have suggested (2.5x).  The
# clean integer route to 100 m is 3 km -> 1 km -> 500 m -> 100 m, ratios
# 3 / 2 / 5, and that is what this file is.  The timestep law is
# dt = 5 * dx(km): 15 / 5 / 2.5 / 0.5 s, which puts CFL near 0.5 at 100 m s-1.
# A tornado core above ~130 m s-1 breaks that and forces a smaller dt; the
# run therefore logs its max wind and CFL series so attempt #2 can be sized
# from measurement rather than from this comment.
#
# Only d01 types a `time_step`.  Every child dx and dt is derived from the
# parent chain by gpuwm/experiment.py and is never hand-typed.
#
# ---------------------------------------------------------------------------
# PARENTS: YSU + km_opt = 4 (the shipped-demonstration configuration)
# ---------------------------------------------------------------------------
# d01 and d02 run the 1-D YSU PBL with 2-D Smagorinsky horizontal mixing --
# the same parent configuration the scored 250 m demonstration used
# (docs/superpowers/receipts/les/nested-les-scored-2026-08-02.md).  The P4
# Shin-Hong (bl_pbl_physics = 11) gray-zone parent chain is deliberately NOT
# used here: its AC-P4.2 partition screen reads OUT on every frame and
# Finding 1 is unadjudicated.  That adjudication is explicitly NOT a gate on
# this attempt -- the YSU fallback is available immediately and is what runs.
# See docs/les/DECISIONS-2026-08-05.md, ruling G3.
#
# d02 at 1 km is inside the gray zone with a 1-D PBL active.  It is the
# reference for the child comparison, never a ground truth.
#
# ---------------------------------------------------------------------------
# CHILDREN: PBL off, km_opt = 3 (3-D Smagorinsky)
# ---------------------------------------------------------------------------
# d03 (500 m) and d04 (100 m) turn the PBL parameterization off and run WRF's
# 3-D Smagorinsky closure, transcribed from v4.6.1 and certified on the
# release line (gpuwm/core/dycore.py:914; dry-CBL oracle receipts in
# docs/public/receipts/les/).  km_opt = 2 (prognostic TKE) is NOT used: it is
# refused on a nest child until a nested prognostic-TKE domain has been run,
# and the plan's optional km2 d04 arm is contingent on this km3 pair
# succeeding first.
#
# ---------------------------------------------------------------------------
# THE VERTICAL GRID -- the binding constraint, and what was done about it
# ---------------------------------------------------------------------------
# ArWen shares one vertical grid across every domain of a tree
# (gpuwm/experiment.py:193 rejects per-domain vertical keys), so the 100 m
# child runs its 3 km root's levels.  On the shipped 49-level ladder that is
# 18 half levels below 1.7 km -- an effective dz of 96.7 m
# (docs/public/LES.md:263-303) -- and the demonstration receipt named
# vertical resolution, not horizontal dx, as the reason its 250 m child was
# only COARSE LES.
#
# This ladder is the fix.  nz = 72 (73 full levels), built by
# tools/build_stretched_eta_ladder.py from a geometrically stretched
# thickness profile, dz0 = 20 m capped at dz_max = 650 m.  Scored through
# WRF's own analytic base state at the reference column:
#
#     33 half levels below 1.7 km   (ratified threshold: >= 30)
#     35 half levels below 2.0 km   (spec V4 planning target: 33-38)
#     effective dz in the BL 51.5 m (spec V4 planning target: 50-60 m)
#     first half level 10.0 m, largest dz in the column 649.9 m
#
# Receipt: docs/les/attempt1/eta72-ladder.json.  The generator's control arm
# (--certified-ladder) reproduces the published 18 levels / 8.40 m first
# level of the shipped ladder exactly, which is what qualifies it as an
# instrument.  nz = 72 sits under the acoustic 129 tier
# (gpuwm/core/acoustic.py:230), so the w''-phi'' solve compiles unspecialized
# and is byte-identical to the shipped kernel; it is also under WSM6's
# 80-level ceiling (gpuwm/physics_vertical_contract.py:26).
#
# ---------------------------------------------------------------------------
# THE 100 m BOX
# ---------------------------------------------------------------------------
# All four domains are concentric on 37.60 N, 100.00 W, so d04 is a 20 x 20 km
# box spanning 37.509-37.691 N, 100.115-99.885 W (verified against
# gpuwm.static.projection on this exact geometry).  That corridor is the
# ground the 2016-05-24 cyclic supercell occupied between genesis and its
# first tornadoes: Dodge City sits at 37.75 N just north of the box's top
# edge, Minneola at 37.44 N just south of its bottom edge, and the tornado
# family tracked slowly northward through the ground between them.
#
# DOCUMENTED LIMITATION, carried deliberately: d04 is a FIXED nest, and a
# 20 km box cannot hold a northward-moving mesocyclone for the whole 8-hour
# window.  It is placed to hold the genesis-to-first-tornado phase, which is
# the phase the structural screens grade.  Late-track coverage is expected to
# degrade and that degradation is itself a registered observation for
# attempt #2 (a moving nest, or a larger box on a 96 GB card).  The plan's
# sizing verdict is explicit that a 20 km box at 50 m, or any wider 100 m
# box, is 96 GB territory and not available on this card.
#
# ---------------------------------------------------------------------------
# INGEST -- READ THIS BEFORE FETCHING
# ---------------------------------------------------------------------------
# The [fetch] block below is ADVISORY (validated at config load, never
# executed).  The execution route is the HRRR native front door, not
# `gpuwm run` and not `gpuwm go`, both of which refuse HRRR by design:
#
#     gpuwm fetch --source hrrr --mode full-file --transport s3 ...
#     python -m tools.prepare_hrrr_wrf ...
#     python -m gpuwm.hrrr_hierarchy_direct ...
#     python -m gpuwm.prepared_domain_tree_forecast ...
#
# TWO ADMISSION PROBLEMS ARE KNOWN AND UNRESOLVED AT THE TIME THIS FILE WAS
# WRITTEN.  Neither is a defect in this config; both are recorded so that
# nothing about them is discovered by surprise on the card:
#
#  1. HRRRv1 INVENTORY DIVERGENCE.  The 2016-05-24 18Z cycle is published and
#     complete on the S3 archive (probed: f00-f15 present, 778 wrfnat records,
#     and the soil subset is an exact 18-record match at the nine RUC depths
#     the bridge pins).  But the pinned native contract wants the hybrid
#     cloud-ice field spelled CIMIXR
#     (tools/download_hrrr_native_subset.py:31-35), and the 2016 file spells
#     it CICE.  This is NOT the benign CLMR/CLWMR spelling case the alias
#     table already tolerates: decoded from the archive, 2016 CICE is GRIB2
#     discipline 0 / category 6 / parameter 0 ("Cloud Ice", kg m-2) while
#     modern CIMIXR is 0 / 1 / 82 ("Cloud Ice Mixing Ratio", kg kg-1).  Those
#     are different parameters, and the code is explicit that alias tolerance
#     must never absorb an inventory change.  Admitting the 2016 record
#     requires a ruling backed by evidence that HRRRv1's CICE on hybrid
#     levels does carry a mixing ratio.  Nothing here assumes it does.
#  2. bl_pbl_physics = 0 ROUTE REFUSAL.  gpuwm.hrrr_route_inputs
#     .render_namelist_input admits only bl_pbl_physics in [1, 11], so no
#     product path can emit this config's namelists.  The demonstration hit
#     the same wall and solved it by emitting a wizard set and extending the
#     per-domain columns by hand
#     (docs/superpowers/receipts/les/INFLOW-FETCH-D90-2026-08-03.md:68-75,
#     generator docs/superpowers/receipts/les/make_d03.py).  This tree needs
#     the same treatment for TWO PBL-off domains rather than one.
#
# The staged queue runs an ingest admission probe as its first step, before
# any bulk transfer, precisely so that (1) halts the ladder loudly and cheaply
# rather than after a multi-gigabyte fetch.
#
# ---------------------------------------------------------------------------
# PHYSICS PROFILE
# ---------------------------------------------------------------------------
# wsm6-ysu-mm5-noah-no-radiation-v1 -- mp_physics 6, longwave OFF, shortwave
# Dudhia (radt 1 min), no cumulus, sf_surface_physics 2.  Taken verbatim from
# gpuwm.physics_compat and unchanged from the shipped demonstration, so this
# file passes the prepared-forecast runner's profile guard as emitted.
[experiment]
name = "les_tornado_100m_dodgecity_20160524"
# 20Z on 2016-05-24: two hours after the 18Z cycle, ahead of the ~21-22Z
# convective initiation, so the child has spin-up before the storm exists.
start_time = 2016-05-24T20:00:00
# 8 h, 20Z -> 04Z, covering CI through the tornado family.  The plan's floor
# is >= 6 h; the extra two hours buy the decay phase for the vortex time
# series without leaving the fetched boundary window.
run_seconds = 28800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
# SET, unlike the demonstration.  Its restart_interval_s = 0.0 meant a run
# that could not be resumed had it died, and the scored receipt records that
# as a defect (nested-les-scored-2026-08-02.md:147-148).  3600 s is 240 whole
# root steps at dt = 15 s.  A 2+-domain tree is on the checkpointing route
# (gpuwm/checkpoint_routes.py:67), so this is exercised, not decorative.
restart_interval_s = 3600.0
# Nocturnal declaration (1.7.1): this case runs shortwave with longwave OFF
# through local night, a declared validation/experiment configuration -- see
# docs/public/PHYSICS.md, "Nocturnal validity".  Restart-tolerated field.
acknowledgements = ["asymmetric-radiation-nocturnal-window-v1"]

[projection]
map_proj = "lambert"
ref_lat = 37.6
ref_lon = -100.0
# The secant cone bracketing the reference latitude by +/- 10 deg, which is
# the rule gpuwm/domain_wizard.py:1580-1581 applies.
truelat1 = 27.6
truelat2 = 47.6
stand_lon = -100.0

[shared]
# 73 full levels -> nz = 72 mass levels.  Generated and scored by
# tools/build_stretched_eta_ladder.py --nz 72 --dz0 20 --dz-max 650
# --bl-top 1700 --require-below 30.  See the vertical-grid note above.
nz = 72
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.99738, 0.99463, 0.99173, 0.98868,
    0.98548, 0.98211, 0.97856, 0.97483, 0.97091,
    0.96679, 0.96246, 0.95791, 0.95313, 0.9481,
    0.94283, 0.93729, 0.93148, 0.92538, 0.91898,
    0.91227, 0.90523, 0.89785, 0.89012, 0.88202,
    0.87354, 0.86466, 0.85537, 0.84565, 0.8355,
    0.82488, 0.8138, 0.80223, 0.79016, 0.77757,
    0.76446, 0.75081, 0.7366, 0.72183, 0.70648,
    0.69055, 0.67403, 0.65692, 0.6392, 0.62088,
    0.60196, 0.58245, 0.56234, 0.54166, 0.52041,
    0.49862, 0.4763, 0.45348, 0.43021, 0.40651,
    0.38242, 0.35801, 0.33332, 0.30842, 0.28338,
    0.25826, 0.23317, 0.20817, 0.18338, 0.15888,
    0.13478, 0.1112, 0.08856, 0.06771, 0.04853,
    0.03092, 0.01477, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = false
mp_physics = 6
top_lid = true
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 0
ra_sw_physics = 1
wrf_rrtmg_compatibility = "none"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

# --- d01: 3 km, 918 x 732 km, the synoptic parent.
[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 306
ny = 244
time_step = 15
dx = 3000.0
specified = true
nested = false
# Hourly: the parent is context, not a subject.  Disk goes to the children.
history_interval_s = 3600.0
radt = 1.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.08

# --- d02: 1 km, 450 x 450 km, centred in d01.  Ratio 3, dt 5 s.
# 150 parent cells wide, placed so its centre is d01's centre exactly:
# i_parent_start = (306 - 450/3)/2 + 1 = 79, j = (244 - 450/3)/2 + 1 = 48.
[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 79
j_parent_start = 48
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 450
ny = 450
specified = false
nested = true
history_interval_s = 3600.0
epssm = 0.5
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.1

# --- d03: 500 m, 150 x 150 km, the first LES domain.  Ratio 2, dt 2.5 s.
# 150 parent cells wide: i_parent_start = j_parent_start = (450 - 150)/2 + 1.
[[domain]]
grid_id = 3
parent_id = 2
i_parent_start = 151
j_parent_start = 151
parent_grid_ratio = 2
parent_time_step_ratio = 2
nx = 300
ny = 300
specified = false
nested = true
# 15 min: fine enough to carry the variance-profile and spectral screens
# without paying the child's cadence.
history_interval_s = 900.0
epssm = 0.5
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.1
# PBL off, resolved-turbulence closure on.
km_opt = 3
bl_pbl_physics = 0
c_s = 0.25
mix_isotropic = 0
mix_upper_bound = 0.1
isfflx = 1
# P3 inflow seeding, pilot amplitude, fixed committed seed.  Settings are the
# pilot ON arm verbatim from
# docs/superpowers/receipts/les/inflow-generator/les.km3.p3.on-7h.toml:166-169.
# The generator is opt-in and OFF by default; the D90 fetch meter runs on the
# output and the scored footprint is the fetch-clean interior only.
inflow_perturbation = true
inflow_perturbation_seed = 20160524
inflow_perturbation_amplitude_scale = 1.0
inflow_perturbation_faces = "inflow"

# --- d04: 100 m, 20 x 20 km, the tornado-scale child.  Ratio 5, dt 0.5 s.
# 40 parent cells wide: i_parent_start = j_parent_start = (300 - 40)/2 + 1.
[[domain]]
grid_id = 4
parent_id = 3
i_parent_start = 131
j_parent_start = 131
parent_grid_ratio = 5
parent_time_step_ratio = 5
nx = 200
ny = 200
specified = false
nested = true
# 5 min: 97 frames over the window, which is the sampling the d04
# vertical-vorticity maximum and swirling-updraft time series are graded on.
# Finer cadence is affordable in wall time but not in staged disk.
history_interval_s = 300.0
epssm = 0.5
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.1
# PBL off, resolved-turbulence closure on.
km_opt = 3
bl_pbl_physics = 0
c_s = 0.25
mix_isotropic = 0
mix_upper_bound = 0.1
isfflx = 1
# Same pilot amplitude and the same committed seed as d03.  The seed is
# keyed per (seed, grid_id, face, refresh index) inside the generator, so a
# shared seed still gives the two domains independent draws while keeping one
# number in the config to cite.
inflow_perturbation = true
inflow_perturbation_seed = 20160524
inflow_perturbation_amplitude_scale = 1.0
inflow_perturbation_faces = "inflow"

# Advisory data-acquisition hints (validated, not executed); keys mirror
# `gpuwm fetch` flags.  `area` is the d01 footprint (34.146-40.817 N,
# 105.535-94.465 W, computed from gpuwm.static.projection) padded ~0.6 deg
# for the HRRR surface-donor margin.  forecast_start_hour 2 + hours 10 is
# f02..f12 off the 18Z cycle = 20Z through 06Z next day, which leaves two
# hours of boundary margin past the 04Z end of the integration.  The 2016
# 18Z cycle publishes to f15 (probed), so f12 is inside its horizon.
[fetch]
source = "hrrr"
cycle = "2016-05-24T18"
forecast_start_hour = 2
hours = 10
area = "33.6,-106.1,41.4,-93.9"
out = "data"
