# The four-domain April 3 1974 geometry with Noah-MP as the land surface, and
# a 60-second surface-call interval opted into ON THE FINEST NEST ONLY.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE COPYING ANYTHING OUT OF THIS FILE.
#
# The `bldt = 1.0` on domain 4 below is NOT the normal setting, NOT the
# preferred setting, and NOT a physics recommendation.  It is a throughput
# mitigation, granted for Noah-MP specifically, on one nest, in this one file.
# `bldt = 0.0` -- a surface call every dynamics step -- remains the default
# everywhere in gpuwm: it is the RunConfig default, it is the registry's
# generic default, it is what domains 1-3 use below, and it is what every
# other configuration in this repository uses.
#
# Do not propagate this setting into a registry template, a maturity grade, a
# runner-route default or another config.  A template that carried it would
# hand it silently to every run built from that template, which is precisely
# the failure this file is written to avoid.
# tests/test_noahmp_surface_interval.py enforces all of that and fails if a
# non-zero bldt appears anywhere it was not explicitly opted into.
# ---------------------------------------------------------------------------
#
# Why it exists.  Noah-MP's column solver is still substantially host-side
# FP32, and at the d04 geometry below (600x600 = 360,000 columns, dt = 5/3 s)
# `bldt = 0.0` schedules 36 land-surface calls per simulated minute.  That is
# 1.22-1.31 hours of wall clock per simulated minute, and the lane's own
# device-conversion ceiling analysis lands near 15 minutes per simulated
# minute even with the whole column converted.  Optimisation alone does not
# reach usable; a 60 s interval is a straight 36x on top of whatever
# optimisation lands.
#
# What it costs.  bldt in WRF gates the surface layer, the land surface model
# AND the PBL together -- module_surface_driver.F opens `run_param_if` at
# :1895 and closes it at :4500, with sfclay_select (:2003) and sfc_select
# (:2541, NOAHMPSCHEME at :3043) both inside it, and module_pbl_driver.F
# carries the identical predicate.  There is no separate LSM interval in the
# WRF Registry to reach for.  So this is not only a slower soil column, which
# would be defensible on its own timescale; it is a surface layer and a PBL
# updated every 60 s at 333 m grid spacing.  The measured field-by-field
# forecast impact is recorded in docs/noahmp_device_column_report.md.  Read it
# before reusing this setting; it is not negligible.
#
# Derived from configs/real74_4dom.toml.  The only differences are the land
# surface scheme, the d04 surface-call interval, and this commentary.

[experiment]
name = "real74_4dom_noahmp_surface_interval"
start_time = 1974-04-03T12:00:00
run_seconds = 43200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 10800.0
column_chunk = 6250

[projection]
map_proj = "lambert"
ref_lat = 39.6848
ref_lon = -83.9297
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -83.9297

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
top_lid = false
moist = true
moist_cq = true
mp_physics = 10
morr_rimed_ice = 1
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
# Noah-MP.  This is the only reason the file exists; every other physics
# selector is inherited unchanged from configs/real74_4dom.toml.
sf_surface_physics = 4
bl_pbl_physics = 1
ra_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v1"
# The SHARED value is zero, and stays zero.  Domains 1, 2 and 3 inherit it
# and call the surface every step, exactly as every other case does.  Only
# domain 4 overrides it, below, and only with the justification attached.
bldt = 0.0

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 250
ny = 200
time_step = 60
dx = 12000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 63
j_parent_start = 51
parent_grid_ratio = 4
parent_time_step_ratio = 4
nx = 500
ny = 400
specified = false
nested = true
history_interval_s = 900.0
epssm = 0.1
radt = 3.0
cu_physics = 0
diff_6th_factor = 0.1

[[domain]]
grid_id = 3
parent_id = 2
i_parent_start = 167
j_parent_start = 117
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 501
ny = 501
specified = false
nested = true
history_interval_s = 900.0
epssm = 0.1
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.08

[[domain]]
grid_id = 4
parent_id = 3
i_parent_start = 151
j_parent_start = 151
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 600
ny = 600
specified = false
nested = true
history_interval_s = 900.0
epssm = 0.1
radt = 1.0
cu_physics = 0
diff_6th_factor = 0.06
# COST MITIGATION, NOT A PHYSICS RECOMMENDATION.
#
# 60 seconds = exactly 36 steps at this domain's dt of 5/3 s, so the surface
# layer, Noah-MP and the PBL each run once per simulated minute here instead
# of 36 times.  That is the entire reason this file differs from
# configs/real74_4dom.toml, and it buys a 36x reduction in land-surface cost
# on the nest that dominates the run.
#
# It is a deliberate, measured degradation of the forecast, accepted because
# Noah-MP at bldt = 0 does not finish, not because 60 s is a good interval at
# 333 m.  It is scoped to this domain in this file and must not be inherited,
# templated, or treated as a default.  When Noah-MP's column reaches the
# device, this override should be deleted, not kept.
bldt = 1.0

[case_data]
forcing = [
    "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/era5_grib/era5_19740403.grb",
]
vtable = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/era5_grib/Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
wps_namelist = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/namelists/namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/static/WPS_GEOG"
source_orography.d01 = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/met_em/met_em.d01.1974-04-03_12_00_00.nc"
source_orography.d02 = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/met_em/met_em.d02.1974-04-03_12_00_00.nc"
source_orography.d03 = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/met_em/met_em.d03.1974-04-03_12_00_00.nc"
source_orography.d04 = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/met_em/met_em.d04.1974-04-03_12_00_00.nc"
source_orography_variable = "SOILHGT"
sfcp_to_sfcp = true
co2_vmr = 330.0e-6
output_domain = 1
output_title = "gpuwm April 3 1974 four-domain, Noah-MP, d04 surface interval"
