[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 300
ny = 250
time_step = 30
dx = 6000.0
specified = true
nested = false
history_interval_s = 900.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# The static child: one footprint big enough to hold the whole followed
# track -- initial warm-sector position through ~6 h of 25 m/s
# northeastward motion into AL/TN.
[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 113
j_parent_start = 125
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 282
ny = 216
specified = false
nested = true
history_interval_s = 900.0
epssm = 0.5
radt = 2.0
cu_physics = 0
diff_6th_factor = 0.1

# Advisory data-acquisition hints (validated, not executed).
[fetch]
source = "era5"
cycle = "2011-04-26T12"
hours = 30
area = "17.87,-109.29,45.01,-68.31"
out = "data/moving_nest_demo_20110427"
cadence = 6

[case_data]
forcing = ["${GPUWM_DEMO_20110427_ROOT}/era5-combined.grib"]
vtable = "${GPUWM_DEMO_20110427_ROOT}/Vtable.ERA5_CDO"
