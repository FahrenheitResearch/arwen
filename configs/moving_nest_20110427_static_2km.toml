# STORM-FOLLOWING MOVING NEST demo, arm B (the static comparison).
# Identical to arm A (moving_nest_20110427_follow_2km.toml) in window,
# physics, projection and d01 -- but the 2 km nest is STATIC, sized so
# one fixed footprint covers the same ~6 h of northeast-moving warm-sector
# convection the moving 150x150 nest follows: 282x216 @ 2 km
# (564x432 km), 60912 nest columns against the moving arm's 22500.
# That 2.7x in nest cells (and ~1.8x in wall time) IS the demo's
# punchline: equal storm coverage, at a multiple of the VRAM.

[experiment]
name = "moving_nest_20110427_static_2km"
start_time = 2011-04-27T06:00:00
run_seconds = 43200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 31.9
ref_lon = -88.8
truelat1 = 21.9
truelat2 = 41.9
stand_lon = -88.8

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
