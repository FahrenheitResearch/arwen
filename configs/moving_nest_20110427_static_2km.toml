wps_namelist = "moving_nest_20110427_static_2km.namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WPS_GEOG"
sfcp_to_sfcp = true
output_domain = 1
output_title = "gpuwm moving-nest demo 2011-04-27 (static arm)"
