[experiment]
name = "gfs_wrf_hierarchy_proof"
start_time = 2026-07-20T00:00:00
run_seconds = 10800.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# No acknowledgements.  Through 1.8.7 this file carried
# ``asymmetric-radiation-nocturnal-window-v1`` on behalf of runs it does
# not describe -- its own suite had radiation fully OFF, which the
# nocturnal guard never looks at, so the token was pure standing bypass
# on a file users copy as a two-domain starting point.  The suite below
# now runs both radiation streams, so nothing needs declaring.

[projection]
map_proj = "lambert"
ref_lat = 39.6848
ref_lon = -83.9297
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -83.9297

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
moist = true
mp_physics = 6
moist_adv_opt = 1
km_opt = 4
c_s = 0.25
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
# RADIATION: both streams, WRF v4.6.1's bundled legacy RRTMG exactly, to
# match the paired stock-WRF namelist.  Through 1.8.7 this was the legacy
# aggregate ra_physics = 0 -- radiation entirely off -- under Noah
# (sf_surface_physics = 2), and Noah reads GLW every surface step.  WRF in
# that configuration hands the land surface 0.0 W m-2; gpuwm handed it a
# fixed 300 W m-2.  Neither is a downward longwave, so the proof now
# computes one.
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-legacy-v1"
ra_rrtmg_variant = "rrtmg_legacy"
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
bldt = 0.0

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 250
ny = 200
time_step = 5
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.12

[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 90
j_parent_start = 80
parent_grid_ratio = 4
parent_time_step_ratio = 4
nx = 240
ny = 160
specified = false
nested = true
history_interval_s = 900.0
radt = 3.0
cu_physics = 0
cudt_minutes = 0.0
diff_6th_factor = 0.12
