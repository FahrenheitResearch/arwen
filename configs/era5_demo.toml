[experiment]
name = "era5_demo"
start_time = 2026-08-10T00:00:00
run_seconds = 7200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0
# The smallest honest ERA5 reanalysis demo: one 12 km Lambert domain at the
# minimum layout the sizer will fit, two forecast hours between the 00Z and
# 06Z analyses, both radiation streams on.  Nothing here is declared away.
#
# SIZED FOR a 10 GiB card: `gpuwm check --budget-gib 8.75 --vram-gib 10`
# reports a 4.50 GiB forecast peak envelope against a 9.50 GiB budget, and
# passes 19 input checks on the retrieval below.
# MEASURED end to end on one card: 8.3 s for `gpuwm run` (ingest and forecast
# together, 120 steps, 3 hourly frames), 13.2 s rendering, 576 product plots,
# nan_free true, and a 2.26 GiB high-water mark of device memory held by the
# forecast process itself.
#
# The bytes this config reads come from the Copernicus CDS through the
# documented two-step route, staged at
# ${GPUWM_CASE_DATA_ROOT}/era5/era5-combined.grib:
#   gpuwm fetch --source era5 --cycle 2026-08-10T00 --hours 6 \
#       --area 21.54,-118.36,48.09,-76.64 --out data/era5
#   (retrieve with your own cdsapi key, concatenate the two parts)
#   gpuwm fetch --source era5 --validate data/era5/era5-combined.grib

[projection]
map_proj = "lambert"
ref_lat = 35.3
ref_lon = -97.5
truelat1 = 25.3
truelat2 = 45.3
stand_lon = -97.5

[shared]
nz = 49
ztop = 20000.0
# ERA5's pressure ladder reaches 1 hPa on every mapped field, so a 100 hPa
# model top is covered by the source and no level is extrapolated.
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
# RADIATION: both streams, so the surface longwave budget stays closed
# through the night and nothing has to be declared away.
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 60
ny = 48
time_step = 60
dx = 12000.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# Declared inputs for the config-driven check/static/ingest/run front door
# (ERA5 native-GRIB1 route; era5_z_invariant source orography).
[case_data]
forcing = ["${GPUWM_CASE_DATA_ROOT}/era5/era5-combined.grib"]
vtable = "Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
wps_namelist = "era5_demo.namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WPS_GEOG"
sfcp_to_sfcp = true
output_domain = 1
output_title = "ArWen ERA5 demo"
