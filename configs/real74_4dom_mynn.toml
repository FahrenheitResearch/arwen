# The four-domain reference case with the MYNN 5/5 suite substituted for
# YSU + revised-MM5.  It differs from configs/real74_4dom.toml in EXACTLY the
# two selectors the registry template
# `wsm6-mynn-mynn-noah-no-radiation-implemented-unverified-v1` differs from
# `wsm6-ysu-mm5-noah-no-radiation-v1` by -- bl_pbl_physics 1 -> 5 and
# sf_sfclay_physics 91 -> 5 -- plus the forecast length, so a side-by-side
# run isolates the PBL / surface-layer change from the microphysics,
# radiation, cumulus and diffusion settings.  Everything else, including the
# Morrison + RTE-RRTMGP + Kain-Fritsch stack and the 6250 RRTMGP column
# chunk, is byte-for-byte the reference config.
#
# Not an acceptance config: this is the first four-domain MYNN integration
# the project has ever run, and it exists to measure peak VRAM and the d04
# step cost under the 29,500 MiB no-ECC rail.
# gpuwm experiment translated from WRF namelists by `gpuwm import-namelist`
# (namelist.wps + namelist.input).  WRF staggered e_we/e_sn/e_vert convert
# to gpuwm mass dimensions nx/ny/nz (one fewer point).  Child dx/dt are NEVER
# written: gpuwm/experiment.py derives them exactly from the parent chain
# (the namelist chain is authoritative).
# Physics substitutions (ratified, never silent):
#   mp_physics 55 (ISHMAEL) -> mp_physics 10 (Morrison 2-moment)
#   bl_pbl_physics 11 (Shin-Hong) -> bl_pbl_physics 5 (MYNN), and
#     sf_sfclay_physics 91 (revised MM5) -> 5 (MYNN), which is this file's
#     one deliberate departure from configs/real74_4dom.toml
#   ra_lw_physics/ra_sw_physics 4 (RRTMG) -> ra_physics 4 (RTE+RRTMGP)

[experiment]
name = "real74_4dom_mynn"
start_time = 1974-04-03T12:00:00
# Short by design: 60 s is one d01 step, four d02, twelve d03 and
# THIRTY-SIX d04 steps, which is enough to prove every domain
# integrates and that the per-step health inventory survives d04 width.
run_seconds = 60.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
# No restart writing: a 60 s probe would never reach the cadence and
# the checkpoint is 861,001 columns of disk nobody asked for.
restart_interval_s = 0.0
# RRTMGP column chunk.  The library default is the capacity-led 3125
# (gpuwm/config.py); this case buys speed with the headroom it has.
#
#   chunk  d01 call   4-dom footprint    4-dom `check --alloc` measured
#          (250x200x49)   projection     device footprint, no steps
#    1563     5.11 s                        (not taken)
#    3125     2.86 s        24.04 GiB           14.69 GiB
#    6250     1.91 s        25.16 GiB           15.65 GiB   <- this case
#   12500     1.54 s        27.38 GiB           17.56 GiB
#
# The rail is 29500 MiB (28.81 GiB) on a card with no ECC.  6250 is the knee:
# it keeps 3.65 GiB of projection margin where 12500 keeps 1.43 GiB.
#
# 6250 is byte-identical to 3125: the RRTMGP outputs (rthratenlw, rthratensw,
# swdown, glw) digest the same at 1563/3125/6250/12500 over three runs, because
# the chunk loop slices columns only and the McICA seed comes from each
# column's own bottom-four pressures, never from its index
# (gpuwm/core/kernels/rrtmgp_mcica.cu:36-45).  Gated by
# tests/test_rrtmgp.py::test_radiation_is_byte_identical_across_column_chunks.
# Cost measured here: +978.2 MiB of shared workspace, +1140.2 MiB of footprint
# projection, leaving 3739.0 MiB under the 29500 MiB no-ECC rail; preflight's
# recommend_column_chunk still halves it back down if a host has less.
column_chunk = 6250

[projection]
map_proj = "lambert"
ref_lat = 39.6848
ref_lon = -83.9297
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -83.9297

[shared]
# WRF e_vert = 50 staggered full levels -> nz = 49 mass levels.
nz = 49
# Nominal vertical scaffold height; the real path derives heights from
# p_top/eta_levels.
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
# WRF Registry defaults the namelist leaves unset, ratified binding for the
# reference configuration (Phase-4 native-dt baseline): emdiv 0.01,
# hypsometric_opt 2, h_sca_adv_order 5.
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
top_lid = false
moist = true
moist_cq = true
mp_physics = 10
morr_rimed_ice = 1
moist_adv_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
# MYNN 5/5 substitution, selector 1 of 2 (see the header).
sf_sfclay_physics = 5
sf_surface_physics = 2
# MYNN 5/5 substitution, selector 2 of 2 (see the header).
bl_pbl_physics = 5
ra_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v1"
bldt = 0.0

[[domain]]
# WRF e_we = 251, e_sn = 201 (staggered) -> mass dimensions.
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 250
ny = 200
time_step = 60
dx = 12000.0
spec_exp = 0.0
specified = true
nested = false
history_interval_s = 3600.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

[[domain]]
# WRF e_we = 501, e_sn = 401 (staggered) -> mass dimensions.
grid_id = 2
parent_id = 1
i_parent_start = 63
j_parent_start = 51
parent_grid_ratio = 4
parent_time_step_ratio = 4
nx = 500
ny = 400
specified = false
nested = true
history_interval_s = 900.0
epssm = 0.1
radt = 3.0
cu_physics = 0
diff_6th_factor = 0.1

[[domain]]
# WRF e_we = 502, e_sn = 502 (staggered) -> mass dimensions.
grid_id = 3
parent_id = 2
i_parent_start = 167
j_parent_start = 117
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 501
ny = 501
