# Lake Erie user's case, 1985-05-31 12Z, reproduced at the fixed tree.
#
# DOMAIN LAYOUT IS AN APPROXIMATION, and the figures say so.  The user
# describes 25 km d01 straight to 3 km d02, which is a parent grid ratio of
# 8.33 -- not an integer, so not a legal WRF nest.  Per the coordinator's
# ruling, this runs the closest legal approximation: d01 at 24 km with d02 at
# 3 km, an integer ratio-8 nest, positioned to match the coverage of the
# user's image.  If their namelist.wps/namelist.input turns up, discard this
# file and use `gpuwm import-namelist` on the real thing instead.
#
# Everything below the domain block is the project's standard ERA5 route,
# carried over verbatim from configs/userroute_combined_2dom.toml so the only
# deliberate differences from a known-good run are the case, the grid, and
# the forcing files.

[experiment]
name = "lake_erie_19850531_2dom_armc_dx2.7km"
start_time = 1985-05-31T12:00:00
# 12Z -> 18Z, so f006 matches the valid time on the user's artifact.
run_seconds = 21600.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
# Lambert centred on Lake Erie rather than the Ohio-valley reference grid.
map_proj = "lambert"
ref_lat = 41.8
ref_lon = -81.2
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -81.2

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
epssm = 0.5
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
moist = true
mp_physics = 10
moist_adv_opt = 1
km_opt = 4
c_s = 0.25
diff_6th_opt = 2
diff_6th_slopeopt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
spec_zone = 1
relax_zone = 4
terrain_opt = 1
map_proj = 1
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
ra_physics = 4
bldt = 0.0

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 960
ny = 864
time_step = 12
dx = 2700.0
specified = true
nested = false
history_interval_s = 864000.0
radt = 3
cu_physics = 0
diff_6th_factor = 0.12

[case_data]
forcing = [
    "/workspace/overlap/forcing/era5_19850531_wide_pl.grib",
    "/workspace/overlap/forcing/era5_19850531_wide_sl.grib",
]
vtable = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/era5_grib/Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
wps_namelist = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/namelists/namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WRF_1974_MP55_reference_bundle/static/WPS_GEOG"
# era5_z_invariant reads SOILGEO from the staged single-level GRIB, so no
# source_orography artifact is needed.
sfcp_to_sfcp = true
# No co2_vmr override: the date-indexed NOAA table selects the 1985 value.
output_domain = 1
output_title = "gpuwm Lake Erie 1985-05-31 (user layout approximated 24->3 km)"
